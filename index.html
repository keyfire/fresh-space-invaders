            background: radial-gradient(circle at 50% 0%, #16163a 0%, #05050f 70%);
            font-family: 'Press Start 2P', 'Segoe UI', system-ui, monospace;
            color: #e8e8ff;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100dvh;
            box-sizing: border-box;
        }
        /* Счёт/жизни/уровень — наверху вместо заголовка */
        .hud {
            text-align: center;
            font-size: clamp(8px, 2.3vw, 13px);
            padding: 0 8px 8px;
            line-height: 1.5;
            text-shadow: 0 0 2px rgba(124, 246, 255, 0.6);
            white-space: nowrap;
        }
        .hud span { color: #7cffa1; }
        .hud .lives { color: #ff7c9c; display: inline-block; }
        .hud .level { color: #ffd166; }
        /* Вспышка счётчика жизней при подборе сердечка */
        .hud .lives.flash { animation: lifeFlash 0.7s ease; }
        @keyframes lifeFlash {
            0%   { transform: scale(1);   color: #ff7c9c; text-shadow: 0 0 2px rgba(255,124,156,0.6); }
            30%  { transform: scale(1.6); color: #ff4d6d; text-shadow: 0 0 4px rgba(255,77,109,0.95); }
            100% { transform: scale(1);   color: #ff7c9c; text-shadow: 0 0 2px rgba(255,124,156,0.6); }
        }
        .hud .sep { color: #5a6090; margin: 0 4px; }
        /* Игровое поле — занимает всё оставшееся место */
        .stage {
            position: relative;
            flex: 1;
            min-height: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #05050f;
        }
        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .canvas-wrap {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            border: 2px solid #2bd1ff;
            border-radius: 8px;
            background-color: #05050f;
            box-shadow: 0 0 25px rgba(43, 209, 255, 0.45), inset 0 0 40px rgba(20, 20, 60, 0.6);
            touch-action: none;
            display: block;
        }
        /* На телефоне голубая рамка и свечение не нужны */
        @media (pointer: coarse) {
            canvas {
                border: none;
                border-radius: 0;
                box-shadow: none;
            }
        }

        /* Единый «прозрачный» пиксельный стиль для оверлей-контролов:
           прямые углы со ступенчатым срезом, чёткая рамка, без размытий */
        .ctrl {
            position: absolute;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(220, 232, 255, 0.10);
            border: 2px solid rgba(220, 232, 255, 0.35);
            /* угловые пиксели рамки — clip-path срезает border на ступеньках */
            background-image:
                linear-gradient(rgba(220,232,255,0.35), rgba(220,232,255,0.35)),
                linear-gradient(rgba(220,232,255,0.35), rgba(220,232,255,0.35)),
                linear-gradient(rgba(220,232,255,0.35), rgba(220,232,255,0.35)),
                linear-gradient(rgba(220,232,255,0.35), rgba(220,232,255,0.35));
            background-size: 4px 4px;
            background-repeat: no-repeat;
            background-position: 2px 2px, calc(100% - 2px) 2px, 2px calc(100% - 2px), calc(100% - 2px) calc(100% - 2px);
            color: rgba(230, 240, 255, 0.75);
            cursor: pointer;
            padding: 0;
            touch-action: none;
            border-radius: 0;
            clip-path: polygon(
                0 8px, 4px 8px, 4px 4px, 8px 4px, 8px 0,
                calc(100% - 8px) 0, calc(100% - 8px) 4px, calc(100% - 4px) 4px, calc(100% - 4px) 8px, 100% 8px,
                100% calc(100% - 8px), calc(100% - 4px) calc(100% - 8px), calc(100% - 4px) calc(100% - 4px), calc(100% - 8px) calc(100% - 4px), calc(100% - 8px) 100%,
                8px 100%, 8px calc(100% - 4px), 4px calc(100% - 4px), 4px calc(100% - 8px), 0 calc(100% - 8px)
            );
        }
        .ctrl:active { background-color: rgba(220, 232, 255, 0.20); }

        /* Кнопка паузы — пиксельный квадрат справа сверху, видна только в игре */
        .pause-btn {
            display: none;
            top: 10px;          /* стартовое значение; точная привязка к холсту — в JS */
            right: 10px;
            width: 44px;
            height: 44px;
            gap: 5px;
        }
        body.state-playing .pause-btn { display: flex; }
        .pause-btn::before, .pause-btn::after {
            content: '';
            width: 6px;
            height: 18px;
            background: rgba(230, 240, 255, 0.8);
        }
        /* В паузе значок превращается в ступенчатый пиксельный «play» */
        .pause-btn.paused::before {
            width: 15px;
            height: 21px;
            background: rgba(230, 240, 255, 0.8);
            clip-path: polygon(
                0 0, 33.4% 0, 33.4% 14.3%, 66.7% 14.3%, 66.7% 28.6%, 100% 28.6%,
                100% 71.4%, 66.7% 71.4%, 66.7% 85.7%, 33.4% 85.7%, 33.4% 100%, 0 100%
            );
        }
        .pause-btn.paused::after { display: none; }

        /* Мобильные контролы — низ экрана, только на сенсорных устройствах */
        .touch-controls { display: none; }
        @media (pointer: coarse) {
            body.state-playing .touch-controls { display: block; }
            .hud {
                position: absolute;
                top: 0; left: 0; right: 0;
                z-index: 2;
                pointer-events: none;
                background: linear-gradient(180deg, rgba(5,5,15,0.55) 0%, rgba(5,5,15,0) 100%);
                padding-top: env(safe-area-inset-top, 0px);
            }
            .game-area { position: relative; }
            .stage { align-items: flex-start; }
            .pause-btn {
                top: calc(10px + env(safe-area-inset-top, 0px));
            }
        }
        .move-pad {
            left: 10px;
            bottom: 8px;
            width: 80%;
            max-width: calc(100% - 115px);   /* оставляем место под кнопку «Огонь» */
            height: 58px;
            color: rgba(230, 240, 255, 0.45);
            font-size: 14px;
            letter-spacing: 8px;
        }
        .fire-btn {
            right: 14px;
            bottom: 4px;
            width: 74px;
            height: 70px;
            font-size: 10px;
            letter-spacing: 0;
            flex-direction: column;
        }
        .fire-btn::before {
            content: '';
            width: 12px;
            height: 12px;
            background: rgba(230, 240, 255, 0.75);
            margin-bottom: 6px;
        }

        /* Центральная кнопка старт/заново — в меню и после проигрыша */
        .center-btn {
            display: none;
            position: absolute;
            z-index: 6;
            top: 56%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 14px 22px;
            font-size: clamp(10px, 2.6vw, 13px);
            white-space: nowrap;
            cursor: pointer;
            color: #05050f;
            letter-spacing: 0;
            font-family: inherit;
            background: linear-gradient(180deg, #7cf6ff, #2bd1ff);
            border: none;
            border-radius: 8px;
            box-shadow: 0 0 16px rgba(43, 209, 255, 0.6);
            transition: transform 0.08s ease, box-shadow 0.2s ease;
        }
        body.state-menu .center-btn,
        body.state-over .center-btn { display: block; }
        .center-btn:hover { box-shadow: 0 0 26px rgba(43, 209, 255, 0.9); }
        .center-btn:active { transform: translate(-50%, -50%) translateY(1px); }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="stage">
            <div class="game-area">
                <div class="hud">Счёт: <span id="score">0</span><span class="sep">·</span>Жизни: <span id="lives" class="lives">3</span><span class="sep">·</span>Уровень: <span id="level" class="level">1</span></div>
                <div class="canvas-wrap">
                    <canvas id="gameCanvas" width="800" height="600"></canvas>
                    <button class="ctrl pause-btn" id="pauseButton" aria-label="Пауза"></button>
                </div>
            </div>
            <div class="touch-controls">
                <div class="ctrl move-pad" id="movePad">&lt; &gt;</div>
                <button class="ctrl fire-btn" id="fireButton" aria-label="Выстрел">ОГОНЬ</button>
            </div>
            <button class="center-btn" id="startButton">Начать игру</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const levelElement = document.getElementById('level');
        const startButton = document.getElementById('startButton');
        const pauseButton = document.getElementById('pauseButton');
        const movePad = document.getElementById('movePad');
        const fireButton = document.getElementById('fireButton');
        const stageElement = document.querySelector('.stage');
        const hudElement = document.querySelector('.hud');

        // Сенсорное устройство — показываем тач-контролы и приподнимаем корабль над ними
        const isTouch = window.matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);
        const FONT_FAMILY = "'Press Start 2P', monospace";
        // Safe-area inset для «чёлки» — читаем из :root (--sat: env(...))
        let safeAreaTop = 0;
        let hudBottom = 0;   // низ HUD в координатах canvas (только touch)
        function readSafeArea(dpr) {
            // env() гарантированно резолвится в custom property, читаем через CSSOM
            let val = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0;
            // Fallback: читаем из paddingTop HUD (там тоже env())
            if (!val) val = parseFloat(getComputedStyle(hudElement).paddingTop) || 0;
            // Fallback: тестовый элемент
            if (!val && CSS.supports('padding-top', 'env(safe-area-inset-top)')) {
                const el = document.createElement('div');
                el.style.cssText = 'position:fixed;top:0;left:-999px;width:1px;height:1px;padding-top:env(safe-area-inset-top,0px);pointer-events:none;opacity:0';
                document.body.appendChild(el);
                val = parseFloat(getComputedStyle(el).paddingTop) || 0;
                document.body.removeChild(el);
            }
            safeAreaTop = Math.round(val * dpr);
        }
        // Уровни свечения текста (ctx.shadowBlur) — уменьшены вдвое
        const TEXT_GLOW_SMALL = 2;    // метки бонусов и HUD
        const TEXT_GLOW_FLOAT = 3;    // всплывающие надписи (+1 ЖИЗНЬ)
        const TEXT_GLOW_LARGE = 5;    // заголовки экранов (меню, пауза, game over, босс)
        const TEXT_GLOW_RECORD = 6;    // «НОВЫЙ РЕКОРД!»

        // Переключение состояния интерфейса: menu | playing | over
        function setUIState(state) {
            document.body.className = 'state-' + state;
        }


        // Отступ корабля от низа: на сенсорных экранах оставляем место под
        // нижние контролы (трек движения и кнопку «Огонь»), чтобы он не прятался.
        function shipBottomInset() {
            const base = Math.round(canvas.height * 0.02);
            if (!isTouch) return base;
            const sclY = canvas.height / (parseFloat(canvas.style.height) || canvas.height);
            return base + Math.round(96 * sclY);   // ~96px CSS под контролы + safe-area
        }

        // Игровые параметры — пересчитываются под размер холста (см. computeLayout)
        let playerWidth = 50;
        let playerHeight = 30;
        let enemyWidth = 40;
        let enemyHeight = 30;
        let bulletWidth = 4;
        let bulletHeight = 15;
        let enemyRows = 5;
        let enemyCols = 10;
        let enemySpacing = 10;
        let enemyStep = 20;   // шаг строя вниз
        let unit = 1;         // масштаб скоростей относительно эталона (высота 600)

        let player = {};
        let enemies = [];
        let bullets = [];
        let enemyBullets = [];
        let score = 0;
        let lives = 3;
        let level = 1;
        let gameRunning = false;
        let gameOver = false;
        let paused = false;
        let enemyDirection = 1; // 1 - вправо, -1 - влево
        let enemySpeed = 1;
        let enemyMoveDownTimer = 0;
        let lastTime = 0;
        let enemyShootTimer = 0;
        let enemyShootInterval = 1000; // Миллисекунды

        // Босс: после каждого 5-го раунда. HP = числу пришельцев в строю.
        let isBoss = false;
        let boss = null;
        let bossVictoryTimer = 0;   // мс показа «БОСС ПОВЕРЖЕН!» перед продолжением
        // Текущая форма пришельцев — меняется каждые 5 раундов циклично
        function currentFormIndex() {
            return Math.floor((level - 1) / 5) % bugForms.length;
        }

        // ===== Перманентные апгрейды корабля (по одному с каждого босса) =====
        // wings — крылья с пушками, drones — дроны-спутники,
        // pierce — пробивные пули, armor — мини-автощит. 0 = нет, 1..MAX уровень.
        let upgrades = { wings: 0, drones: 0, pierce: 0, armor: 0 };
        const UPGRADE_KEYS = ['wings', 'drones', 'pierce', 'armor'];
        const UPGRADE_MAX = 3;
        const UPGRADE_NAMES = { wings: 'КРЫЛЬЯ', drones: 'ДРОНЫ', pierce: 'ПРОБОЙ', armor: 'МАГНИТ-ЩИТ' };
        const ROMAN = ['', 'I', 'II', 'III', 'IV'];
        let drones = [];            // спутники-дроны: {cx, cy, side, slot}
        let droneFireTimer = 0;
        let armorReady = false, armorTimer = 0;  // мини-автощит
        let lastUpgradeText = '';   // подпись апгрейда в баннере победы
        let lastUpgradeKey = '';    // ключ апгрейда — для иконки в баннере

        // Уникальные пиксельные иконки апгрейдов (для баннера победы)
        const upgradeIcons = {
            // крылья с пушками — корабль с широкими крыльями и дульцами по краям
            wings: {
                glow: '#9aa0c8',
                frame: ['....X....', '...XXX...', '..XXXXX..', 'GXXXXXXXG', 'GXXXXXXXG', '.XXXXXXX.', '..XX.XX..', '.X.....X.'],
                palette: { 'X': '#c2c8e0', 'G': '#ff9d00', '.': null }
            },
            // дроны-спутники — кораблик с двумя дронами по бокам
            drones: {
                glow: '#2bd1ff',
                frame: ['....X....', '...XCX...', 'D.XXXXX.D', 'D.XXXXX.D', '..XXXXX..', '...XXX...', '..X.X.X..', '.........'],
                palette: { 'X': '#c2c8e0', 'C': '#1b9dff', 'D': '#7cf6ff', '.': null }
            },
            // пробивные пули — копьё-пуля сквозь осколки строя
            pierce: {
                glow: '#9dff5a',
                frame: ['....A....', '...AAA...', '..AAAAA..', 'XX.AAA.XX', '....A....', '....A....', '....A....', '....A....', '.........'],
                palette: { 'A': '#eaffff', 'X': '#ff5e7e', '.': null }
            },
            // магнитный щит — фиолетовый щит-герб с бликами
            armor: {
                glow: '#b06bff',
                frame: ['.XXXXXXX.', 'XXXXXXXXX', 'XLXXXXXLX', 'XXXXXXXXX', 'XXXXXXXXX', '.XXXXXXX.', '..XXXXX..', '...XXX...', '....X....'],
                palette: { 'X': '#b06bff', 'L': '#e0c8ff', '.': null }
            }
        };

        // Декоративные слои
        let stars = [];
        let particles = [];

        // Призы (падают с убитых жуков) и активные бонусы
        let powerups = [];
        // Таймеры бонусов: { triple, shield, freeze, rapid, double } в мс оставшегося времени
        let bonuses = { triple: 0, shield: 0, freeze: 0, rapid: 0, double: 0 };
        const BONUS_DURATION = { triple: 3000, shield: 5000, freeze: 3000, rapid: 2000, double: 5000 };
        const POWERUP_DROP_CHANCE = 0.14;     // шанс выпадения приза с жука
        const POWERUP_TYPES = ['triple', 'shield', 'freeze', 'rapid', 'double'];
        // Веса выпадения: тройной и двойной — вдвое реже остальных
        const POWERUP_WEIGHTS = { triple: 1, double: 1, shield: 2, freeze: 2, rapid: 2 };
        function pickPowerupType() {
            let total = 0;
            for (const t of POWERUP_TYPES) total += POWERUP_WEIGHTS[t] || 1;
            let r = Math.random() * total;
            for (const t of POWERUP_TYPES) {
                r -= POWERUP_WEIGHTS[t] || 1;
                if (r < 0) return t;
            }
            return POWERUP_TYPES[0];
        }

        // Удержание огня (мышь / тап «Огонь» / пробел) и темп автоматической стрельбы
        let fireHeld = false;
        let fireCooldown = 0;                 // мс до следующего выстрела при удержании
        const HOLD_INTERVAL = 280;            // обычный темп при удержании, мс
        const RAPID_INTERVAL = 85;            // темп при активной «очереди», мс

        // Всплывающие надписи (например, «+1 ЖИЗНЬ» при подборе сердечка)
        let floatTexts = [];

        // ===== Рекорды (в куках) =====
        let bestScore = 0;          // лучший счёт за всё время
        let bestLevel = 0;          // лучший достигнутый уровень
        let hadRecord = false;      // был ли рекорд на старте (для салюта)
        let recordCelebrated = false; // салют уже показан в этой игре
        let celebrateTimer = 0;     // мс показа «НОВЫЙ РЕКОРД!»
        let fireworkTimer = 0;      // мс до следующего залпа салюта

        function setCookie(name, value, days) {
            const d = new Date();
            d.setTime(d.getTime() + days * 86400000);
            document.cookie = name + '=' + encodeURIComponent(value) +
                ';expires=' + d.toUTCString() + ';path=/;SameSite=Lax';
        }
        function getCookie(name) {
            const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
            return m ? decodeURIComponent(m[1]) : null;
        }
        function loadBest() {
            bestScore = parseInt(getCookie('ksi_best_score'), 10) || 0;
            bestLevel = parseInt(getCookie('ksi_best_level'), 10) || 0;
            hadRecord = bestScore > 0 || bestLevel > 0;
        }
        function saveBest() {
            setCookie('ksi_best_score', bestScore, 3650);
            setCookie('ksi_best_level', bestLevel, 3650);
        }
        // Проверка/обновление рекорда; салют — при превышении уже существующего рекорда
        function checkRecord() {
            if (!recordCelebrated && hadRecord && (score > bestScore || level > bestLevel)) {
                recordCelebrated = true;
                startCelebration();
            }
            let grew = false;
            if (score > bestScore) { bestScore = score; grew = true; }
            if (level > bestLevel) { bestLevel = level; grew = true; }
            if (grew) saveBest();
        }

        // Цвета жуков по рядам
        const bugColors = ['#ff5e7e', '#ff9f45', '#ffe14a', '#7cff6b', '#6bd5ff'];

        // Пять форм пришельцев (по 2 кадра анимации). Меняются каждые 5 раундов
        // циклично; форма 0 (первые раунды) — исходный «стройный» жук.
        // Символы: X тело, D тень, L блик, e глаз, '.' прозрачно.
        const bugForms = [
            // 0 — жук (стройный, оригинал)
            [
                ['....X...X....', '.....X.X.....', '....XXXXX....', '....eXXXe....', '...XXXXXXX...', '...XXXXXXX...', '...XDDDDDX...', '...XLLLLLX...', '...XXXXXXX...', '..X..X.X..X..', '.X...X.X...X.'],
                ['....X...X....', '.....X.X.....', '....XXXXX....', '....eXXXe....', '...XXXXXXX...', '...XXXXXXX...', '...XDDDDDX...', '...XLLLLLX...', '...XXXXXXX...', '..X.X...X.X..', '..X..X.X..X..']
            ],
            // 1 — кальмар
            [
                ['...XXXXX...', '..XXXXXXX..', '..XeXXXeX..', '..XXXXXXX..', '...XXXXX...', '...X.X.X...', '..X.X.X.X..', '.X.......X.'],
                ['...XXXXX...', '..XXXXXXX..', '..XeXXXeX..', '..XXXXXXX..', '...XXXXX...', '...X.X.X...', '.X.X.X.X.X.', '..X.....X..']
            ],
            // 2 — краб
            [
                ['.X.......X.', '..X.X.X.X..', '.XXXXXXXXX.', 'XXXeXXXeXXX', 'XXXXXXXXXXX', 'X.XXXXXXX.X', 'X.X.....X.X', '...XX.XX...'],
                ['.X.......X.', '..X.X.X.X..', '.XXXXXXXXX.', 'XXXeXXXeXXX', 'XXXXXXXXXXX', 'X.XXXXXXX.X', '..X.....X..', '.X.X...X.X.']
            ],
            // 3 — осьминог
            [
                ['..XXXXXXX..', '.XXXXXXXXX.', 'XXXXXXXXXXX', 'XXeXXXXXeXX', 'XXXXXXXXXXX', 'XXXXXXXXXXX', '.X.X.X.X.X.', 'X..X.X.X..X'],
                ['..XXXXXXX..', '.XXXXXXXXX.', 'XXXXXXXXXXX', 'XXeXXXXXeXX', 'XXXXXXXXXXX', 'XXXXXXXXXXX', 'X.X.X.X.X.X', '.X..X.X..X.']
            ],
            // 4 — череп
            [
                ['...XXXXX...', '..XXXXXXX..', '.XXXXXXXXX.', '.XeeXXXeeX.', '.XXXXXXXXX.', '..XXXXXXX..', '..X.X.X.X..', '...X.X.X...'],
                ['...XXXXX...', '..XXXXXXX..', '.XXXXXXXXX.', '.XeeXXXeeX.', '.XXXXXXXXX.', '..XXXXXXX..', '.X.X.X.X.X.', '..X.X.X.X..']
            ]
        ];

        // Боссы — большие детальные версии каждой формы пришельцев. Выбираются
        // по форме предыдущих 5 раундов, поэтому босс «в стиле» этих пришельцев.
        const bossDefs = [
            // 0 — гигантский жук (детальный, удвоенное разрешение)
            {
                frame: [
                    '........LD......LD........',
                    '........DD......DD........',
                    '..........LD..LD..........',

        // ===== Звук (Web Audio, синтез без файлов) =====
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) audioCtx = new AC();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }
        // Универсальная нота: осциллятор с указанной формой, частотой (и конечной частотой),
        // громкостью и длительностью. offset — смещение старта (для арпеджио).
        function sndNote(type, freqStart, freqEnd, gain, dur, offset) {
            if (!audioCtx) return;
            const t = audioCtx.currentTime + (offset || 0);
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = type;
            o.frequency.setValueAtTime(freqStart, t);
            if (freqEnd !== undefined) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
            g.gain.setValueAtTime(gain, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(t); o.stop(t + dur);
        }
        function sndSequence(type, notes, gain, dur, gap) {
            if (!audioCtx) return;
            notes.forEach((f, i) => sndNote(type, f, undefined, gain, dur, i * gap));
        }
        function sndShoot() { sndNote('square', 900, 240, 0.05, 0.14); }
        function sndExplosion() {
            if (!audioCtx) return;
            const dur = 0.32;
            const buffer = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
            const src = audioCtx.createBufferSource();
            src.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 1200;
            const g = audioCtx.createGain();
            g.gain.value = 0.13;
            src.connect(filter); filter.connect(g); g.connect(audioCtx.destination);
            src.start();
        }
        function sndHit() { sndNote('sawtooth', 320, 60, 0.12, 0.3); }
        function sndPowerup() { sndSequence('square', [523, 659, 784, 1047], 0.06, 0.13, 0.06); }
        function sndFanfare() { sndSequence('triangle', [523, 659, 784, 1047, 1319], 0.09, 0.35, 0.1); }
