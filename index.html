<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Космические жуки</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle at 50% 0%, #16163a 0%, #05050f 70%);
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #e8e8ff;
        }
        .game-container {
            text-align: center;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 28px;
            letter-spacing: 3px;
            color: #7cf6ff;
            text-shadow: 0 0 12px #1b9dff, 0 0 24px #1b9dff;
        }
        canvas {
            border: 2px solid #2bd1ff;
            border-radius: 8px;
            background-color: #05050f;
            box-shadow: 0 0 25px rgba(43, 209, 255, 0.45), inset 0 0 40px rgba(20, 20, 60, 0.6);
            max-width: 100%;
        }
        .score {
            margin-top: 14px;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(124, 246, 255, 0.6);
        }
        .score span { color: #7cffa1; }
        .score .lives { color: #ff7c9c; }
        .score .level { color: #ffd166; }
        .controls {
            margin-top: 12px;
            font-size: 14px;
            color: #9aa0c8;
        }
        button {
            margin-top: 14px;
            padding: 10px 22px;
            font-size: 16px;
            cursor: pointer;
            color: #05050f;
            font-weight: bold;
            letter-spacing: 1px;
            background: linear-gradient(180deg, #7cf6ff, #2bd1ff);
            border: none;
            border-radius: 6px;
            box-shadow: 0 0 16px rgba(43, 209, 255, 0.6);
            transition: transform 0.08s ease, box-shadow 0.2s ease;
        }
        button:hover { box-shadow: 0 0 26px rgba(43, 209, 255, 0.9); }
        button:active { transform: translateY(1px); }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>КОСМИЧЕСКИЕ ЖУКИ</h1>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="score">Счёт: <span id="score">0</span> &nbsp;|&nbsp; Жизни: <span id="lives" class="lives">3</span> &nbsp;|&nbsp; Уровень: <span id="level" class="level">1</span></div>
        <div class="controls">Клавиши: ← → – движение, Пробел – выстрел &nbsp;|&nbsp; Мышь: курсор – движение, клик – выстрел</div>
        <button id="startButton">Начать игру</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const levelElement = document.getElementById('level');
        const startButton = document.getElementById('startButton');

        // Игровые параметры
        const playerWidth = 50;
        const playerHeight = 30;
        const enemyWidth = 40;
        const enemyHeight = 30;
        const bulletWidth = 4;
        const bulletHeight = 15;
        const enemyRows = 5;
        const enemyCols = 10;
        const enemySpacing = 10;

        let player = {};
        let enemies = [];
        let bullets = [];
        let enemyBullets = [];
        let score = 0;
        let lives = 3;
        let level = 1;
        let gameRunning = false;
        let gameOver = false;
        let enemyDirection = 1; // 1 - вправо, -1 - влево
        let enemySpeed = 1;
        let enemyMoveDownTimer = 0;
        let lastTime = 0;
        let enemyShootTimer = 0;
        let enemyShootInterval = 1000; // Миллисекунды

        // Декоративные слои
        let stars = [];
        let particles = [];

        // Цвета жуков по рядам
        const bugColors = ['#ff5e7e', '#ff9f45', '#ffe14a', '#7cff6b', '#6bd5ff'];

        // Пиксельные спрайты жуков, 2 кадра анимации (мельче клетки + детали).
        // Символы: X тело, D тень, L блик, e глаз, '.' прозрачно. Цвет тела — по ряду.
        const bugFrames = [
            [
                '....X...X....',
                '.....X.X.....',
                '....XXXXX....',
                '....eXXXe....',
                '...XXXXXXX...',
                '...XXXXXXX...',
                '...XDDDDDX...',
                '...XLLLLLX...',
                '...XXXXXXX...',
                '..X..X.X..X..',
                '.X...X.X...X.'
            ],
            [
                '....X...X....',
                '.....X.X.....',
                '....XXXXX....',
                '....eXXXe....',
                '...XXXXXXX...',
                '...XXXXXXX...',
                '...XDDDDDX...',
                '...XLLLLLX...',
                '...XXXXXXX...',
                '..X.X...X.X..',
                '..X..X.X..X..'
            ]
        ];

        // Пиксельный спрайт корабля (квадратный, в тон жукам).
        // H корпус, C кабина, F дюза, '.' прозрачно.
        const shipFrame = [
            '......H......',
            '.....HHH.....',
            '....HHHHH....',
            '....HCCCH....',
            '...HHCCCHH...',
            '..HHHHHHHHH..',
            '.HHHHHHHHHHH.',
            'HHH.HHHHH.HHH',
            'HH...HHH...HH',
            '.....F.F.....'
        ];
        const shipPalette = { 'H': '#c2c8e0', 'C': '#1b9dff', 'F': '#ff9d00', '.': null };

        // ===== Звук (Web Audio, синтез без файлов) =====
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) audioCtx = new AC();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }
        function sndShoot() {
            if (!audioCtx) return;
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'square';
            const t = audioCtx.currentTime;
            o.frequency.setValueAtTime(900, t);
            o.frequency.exponentialRampToValueAtTime(240, t + 0.14);
            g.gain.setValueAtTime(0.05, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(t); o.stop(t + 0.14);
        }
        function sndExplosion() {
            if (!audioCtx) return;
            const dur = 0.32;
            const buffer = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
            const src = audioCtx.createBufferSource();
            src.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 1200;
            const g = audioCtx.createGain();
            g.gain.value = 0.13;
            src.connect(filter); filter.connect(g); g.connect(audioCtx.destination);
            src.start();
        }
        function sndHit() {
            if (!audioCtx) return;
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'sawtooth';
            const t = audioCtx.currentTime;
            o.frequency.setValueAtTime(320, t);
            o.frequency.exponentialRampToValueAtTime(60, t + 0.3);
            g.gain.setValueAtTime(0.12, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(t); o.stop(t + 0.3);
        }

        // ===== Звёздное небо =====
        function initStars() {
            stars = [];
            for (let i = 0; i < 110; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 1.6 + 0.3,
                    speed: Math.random() * 1.1 + 0.2
                });
            }
        }
        function updateStars() {
            for (const s of stars) {
                s.y += s.speed;
                if (s.y > canvas.height) {
                    s.y = 0;
                    s.x = Math.random() * canvas.width;
                }
            }
        }

        // ===== Частицы взрыва =====
        function spawnExplosion(x, y, color) {
            for (let i = 0; i < 18; i++) {
                const a = Math.random() * Math.PI * 2;
                const sp = Math.random() * 4 + 1;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(a) * sp,
                    vy: Math.sin(a) * sp,
                    life: 1,
                    color: color
                });
            }
        }
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.06;
                p.life -= 0.03;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        // Создание уровня (игрок + строй врагов). Счёт и жизни НЕ сбрасываются.
        function spawnLevel() {
            // Создаем игрока
            player = {
                x: canvas.width / 2 - playerWidth / 2,
                y: canvas.height - playerHeight - 20,
                width: playerWidth,
                height: playerHeight,
                speed: 5
            };

            // Создаем врагов
            enemies = [];
            for (let row = 0; row < enemyRows; row++) {
                for (let col = 0; col < enemyCols; col++) {
                    enemies.push({
                        x: col * (enemyWidth + enemySpacing) + 50,
                        y: row * (enemyHeight + enemySpacing) + 50,
                        width: enemyWidth,
                        height: enemyHeight,
                        alive: true,
                        row: row
                    });
                }
            }

            // Очищаем пули и частицы
            bullets = [];
            enemyBullets = [];
            particles = [];

            // Скорость и темп стрельбы растут с каждым уровнем
            enemySpeed = 1 + (level - 1) * 0.4;
            enemyShootInterval = Math.max(350, 1000 - (level - 1) * 90);

            // Сбрасываем флаги уровня
            gameRunning = true;
            gameOver = false;
            enemyDirection = 1;
            enemyMoveDownTimer = 0;
            enemyShootTimer = 0;
        }

        // Новая игра с первого уровня
        function startGame() {
            score = 0;
            lives = 3;
            level = 1;
            updateScore();
            spawnLevel();
        }

        // Следующий уровень — ускорение, счёт и жизни сохраняются
        function nextLevel() {
            level++;
            spawnLevel();
            updateScore();
        }

        // Обновление счета
        function updateScore() {
            scoreElement.textContent = score;
            livesElement.textContent = lives;
            levelElement.textContent = level;
        }

        // Единый цикл: звёзды и частицы живут всегда, логика — только в игре
        function loop(currentTime) {
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            updateStars();
            updateParticles();

            if (gameRunning && !gameOver) {
                update(deltaTime);
            }

            draw();
            requestAnimationFrame(loop);
        }

        // Обновление состояния игры
        function update(deltaTime) {
            // Обработка движения игрока
            if (keys.left && player.x > 0) {
                player.x -= player.speed;
            }
            if (keys.right && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }

            // Обновление пуль игрока
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= 7;

                // Удаляем пули, вышедшие за границы
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Проверка столкновения с врагами
                for (let j = 0; j < enemies.length; j++) {
                    if (enemies[j].alive &&
                        bullets[i].x < enemies[j].x + enemies[j].width &&
                        bullets[i].x + bulletWidth > enemies[j].x &&
                        bullets[i].y < enemies[j].y + enemies[j].height &&
                        bullets[i].y + bulletHeight > enemies[j].y) {

                        enemies[j].alive = false;
                        spawnExplosion(
                            enemies[j].x + enemies[j].width / 2,
                            enemies[j].y + enemies[j].height / 2,
                            bugColors[enemies[j].row % bugColors.length]
                        );
                        sndExplosion();
                        bullets.splice(i, 1);
                        score += 10;
                        updateScore();
                        break;
                    }
                }
            }

            // Обновление врагов
            let moveDown = false;
            let leftmost = canvas.width;
            let rightmost = 0;

            // Находим крайних врагов
            for (let i = 0; i < enemies.length; i++) {
                if (enemies[i].alive) {
                    leftmost = Math.min(leftmost, enemies[i].x);
                    rightmost = Math.max(rightmost, enemies[i].x + enemies[i].width);
                }
            }

            // Проверяем, нужно ли двигаться вниз
            if (rightmost >= canvas.width - 10 || leftmost <= 10) {
                enemyDirection *= -1;
                moveDown = true;
            }

            // Двигаем врагов
            for (let i = 0; i < enemies.length; i++) {
                if (enemies[i].alive) {
                    enemies[i].x += enemyDirection * enemySpeed;
                    if (moveDown) {
                        enemies[i].y += 20;
                    }
                }
            }

            // Проверка на победу
            let allDead = true;
            for (let i = 0; i < enemies.length; i++) {
                if (enemies[i].alive) {
                    allDead = false;
                    break;
                }
            }

            if (allDead) {
                // Следующий уровень — ускорение и более частая стрельба
                nextLevel();
                return;
            }

            // Проверка на проигрыш (враги достигли дна)
            for (let i = 0; i < enemies.length; i++) {
                if (enemies[i].alive && enemies[i].y + enemies[i].height >= player.y) {
                    gameOver = true;
                    showGameOver();
                    return;
                }
            }

            // Враги стреляют
            enemyShootTimer += deltaTime;
            if (enemyShootTimer >= enemyShootInterval) {
                enemyShootTimer = 0;
                shootEnemyBullet();
            }

            // Обновление пуль врагов
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                enemyBullets[i].y += 5;

                // Удаляем пули, вышедшие за границы
                if (enemyBullets[i].y > canvas.height) {
                    enemyBullets.splice(i, 1);
                    continue;
                }

                // Проверка столкновения с игроком
                if (enemyBullets[i].x < player.x + player.width &&
                    enemyBullets[i].x + bulletWidth > player.x &&
                    enemyBullets[i].y < player.y + player.height &&
                    enemyBullets[i].y + bulletHeight > player.y) {

                    enemyBullets.splice(i, 1);
                    lives--;
                    sndHit();
                    spawnExplosion(player.x + player.width / 2, player.y + player.height / 2, '#7cf6ff');
                    updateScore();

                    if (lives <= 0) {
                        gameOver = true;
                        showGameOver();
                        return;
                    }
                }
            }
        }

        // Выстрел игрока
        function shootPlayerBullet() {
            if (!gameRunning || gameOver || !player.width) return;
            bullets.push({
                x: player.x + player.width / 2 - bulletWidth / 2,
                y: player.y - bulletHeight,
                width: bulletWidth,
                height: bulletHeight
            });
            sndShoot();
        }

        // Стрельба врагов
        function shootEnemyBullet() {
            // Выбираем случайного живого врага
            const aliveEnemies = enemies.filter(enemy => enemy.alive);
            if (aliveEnemies.length > 0) {
                const randomEnemy = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
                enemyBullets.push({
                    x: randomEnemy.x + randomEnemy.width / 2 - bulletWidth / 2,
                    y: randomEnemy.y + randomEnemy.height,
                    width: bulletWidth,
                    height: bulletHeight
                });
            }
        }

        // ===== Рисование объектов =====

        // Затемнение / осветление hex-цвета (f<1 темнее, f>1 светлее)
        function shade(hex, f) {
            const n = parseInt(hex.slice(1), 16);
            const r = Math.max(0, Math.min(255, Math.round(((n >> 16) & 255) * f)));
            const g = Math.max(0, Math.min(255, Math.round(((n >> 8) & 255) * f)));
            const b = Math.max(0, Math.min(255, Math.round((n & 255) * f)));
            return `rgb(${r},${g},${b})`;
        }

        // Универсальный рендер пиксельного спрайта по сетке символов и палитре
        function drawSprite(grid, palette, x, y, w, h, glow) {
            const cols = grid[0].length;
            const rows = grid.length;
            const cell = Math.min(w / cols, h / rows);
            const ox = x + (w - cell * cols) / 2;
            const oy = y + (h - cell * rows) / 2;
            ctx.save();
            if (glow) {
                ctx.shadowColor = glow.color;
                ctx.shadowBlur = glow.blur;
            }
            for (let r = 0; r < rows; r++) {
                const line = grid[r];
                for (let c = 0; c < cols; c++) {
                    const color = palette[line[c]];
                    if (color) {
                        ctx.fillStyle = color;
                        // +0.5 убирает зазоры между клетками при дробном масштабе
                        ctx.fillRect(ox + c * cell, oy + r * cell, cell + 0.5, cell + 0.5);
                    }
                }
            }
            ctx.restore();
            return { cell, ox, oy, cols, rows };
        }

        // Космический корабль игрока — квадратный пиксельный спрайт
        function drawShip(p) {
            const s = drawSprite(shipFrame, shipPalette, p.x, p.y, p.width, p.height, null);

            // Пламя из дюз — мигающие пиксельные блоки под двигателями
            ctx.save();
            ctx.shadowColor = '#ff9d00';
            ctx.shadowBlur = 6;
            const flick = Math.floor(performance.now() / 90) % 2;
            for (const col of [5, 7]) {
                const len = 1 + flick + (Math.random() < 0.5 ? 1 : 0);
                for (let k = 0; k < len; k++) {
                    ctx.fillStyle = k === 0 ? '#ffd27c' : '#ff6a00';
                    ctx.fillRect(s.ox + col * s.cell, s.oy + (s.rows + k) * s.cell, s.cell + 0.5, s.cell + 0.5);
                }
            }
            ctx.restore();
        }

        // Жук-враг — детальный пиксельный спрайт, цвет по ряду, без яркого свечения
        function drawBug(e) {
            const frame = bugFrames[Math.floor(performance.now() / 450) % bugFrames.length];
            const base = bugColors[e.row % bugColors.length];
            const palette = {
                'X': base,
                'D': shade(base, 0.55),   // тень
                'L': shade(base, 1.35),   // блик
                'e': '#ffffff',           // глаз
                '.': null
            };
            drawSprite(frame, palette, e.x, e.y, e.width, e.height, null);
        }

        function drawBackground() {
            const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bg.addColorStop(0, '#0a0a2a');
            bg.addColorStop(1, '#160a26');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Звёзды
            for (const s of stars) {
                ctx.globalAlpha = 0.4 + s.r / 2;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function drawParticles() {
            for (const p of particles) {
                ctx.globalAlpha = Math.max(p.life, 0);
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3 * p.life + 1, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        // Отрисовка игры
        function draw() {
            drawBackground();

            // Экран меню (до старта)
            if (!gameRunning && !gameOver) {
                drawParticles();
                ctx.fillStyle = '#7cf6ff';
                ctx.font = 'bold 44px Segoe UI, Arial';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#1b9dff';
                ctx.shadowBlur = 20;
                ctx.fillText('КОСМИЧЕСКИЕ ЖУКИ', canvas.width / 2, canvas.height / 2 - 30);
                ctx.shadowBlur = 0;
                ctx.font = '20px Segoe UI, Arial';
                ctx.fillStyle = '#cfd3f5';
                ctx.fillText('Нажмите «Начать игру»', canvas.width / 2, canvas.height / 2 + 20);
                ctx.textAlign = 'left';
                return;
            }

            // Игрок
            if (player.width) drawShip(player);

            // Враги
            for (let i = 0; i < enemies.length; i++) {
                if (enemies[i].alive) drawBug(enemies[i]);
            }

            // Пули игрока (светящиеся)
            ctx.save();
            ctx.shadowColor = '#7cff6b';
            ctx.shadowBlur = 12;
            ctx.fillStyle = '#d6ffcf';
            for (let i = 0; i < bullets.length; i++) {
                const b = bullets[i];
                ctx.fillRect(b.x, b.y, bulletWidth, bulletHeight);
            }
            ctx.restore();

            // Пули врагов (светящиеся)
            ctx.save();
            ctx.shadowColor = '#ff6a3d';
            ctx.shadowBlur = 12;
            ctx.fillStyle = '#ffd27c';
            for (let i = 0; i < enemyBullets.length; i++) {
                const b = enemyBullets[i];
                ctx.fillRect(b.x, b.y, bulletWidth, bulletHeight);
            }
            ctx.restore();

            // Частицы взрывов
            drawParticles();

            // Если игра окончена, показываем сообщение
            if (gameOver) {
                ctx.fillStyle = 'rgba(5, 5, 15, 0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff7c9c';
                ctx.font = 'bold 48px Segoe UI, Arial';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#ff2b5e';
                ctx.shadowBlur = 18;
                ctx.fillText('ИГРА ОКОНЧЕНА', canvas.width / 2, canvas.height / 2 - 50);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#e8e8ff';
                ctx.font = '24px Segoe UI, Arial';
                ctx.fillText(`Ваш счёт: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText('Нажмите «Начать игру» для перезапуска', canvas.width / 2, canvas.height / 2 + 60);
                ctx.textAlign = 'left';
            }
        }

        // Конец игры
        function showGameOver() {
            gameRunning = false;
            startButton.textContent = 'Начать игру';
        }

        // Обработчик нажатия клавиш
        const keys = {
            left: false,
            right: false,
            space: false
        };

        document.addEventListener('keydown', function(e) {
            switch (e.key) {
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    keys.left = true;
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    keys.right = true;
                    break;
                case ' ':
                    shootPlayerBullet();
                    e.preventDefault();
                    break;
            }
        });

        document.addEventListener('keyup', function(e) {
            switch (e.key) {
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    keys.left = false;
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    keys.right = false;
                    break;
            }
        });

        // ===== Управление мышкой =====
        // Корабль следует за курсором по горизонтали (с учётом масштаба канваса)
        canvas.addEventListener('mousemove', function(e) {
            if (!gameRunning || gameOver || !player.width) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const mouseX = (e.clientX - rect.left) * scaleX;
            player.x = mouseX - player.width / 2;
            // Не выходим за границы поля
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
        });

        // Выстрел по клику (левая кнопка)
        canvas.addEventListener('mousedown', function(e) {
            if (e.button === 0) {
                initAudio();
                shootPlayerBullet();
            }
        });

        // Сенсорное управление для мобильных
        canvas.addEventListener('touchmove', function(e) {
            if (!gameRunning || gameOver || !player.width || e.touches.length === 0) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const touchX = (e.touches[0].clientX - rect.left) * scaleX;
            player.x = touchX - player.width / 2;
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchstart', function(e) {
            initAudio();
            shootPlayerBullet();
            e.preventDefault();
        }, { passive: false });

        // Обработчик кнопки "Начать игру"
        startButton.addEventListener('click', function() {
            initAudio();
            if (!gameRunning || gameOver) {
                startGame();
                startButton.textContent = 'Игра идёт...';
            }
        });

        // Запуск единого цикла анимации
        initStars();
        lastTime = performance.now();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
