        // ===== Карточка счёта для шаринга (offscreen PNG) =====
        // drawSprite привязан к главному ctx, поэтому здесь — свой мини-художник спрайтов.
        function paintSprite(c, grid, palette, x, y, w, h, glow) {
            const cols = grid[0].length, rows = grid.length;
            const cell = Math.min(w / cols, h / rows);
            const ox = x + (w - cell * cols) / 2, oy = y + (h - cell * rows) / 2;
            c.save();
            if (glow) { c.shadowColor = glow.color; c.shadowBlur = glow.blur; }
            for (let r = 0; r < rows; r++) {
                for (let col = 0; col < cols; col++) {
                    const color = palette[grid[r][col]];
                    if (color) { c.fillStyle = color; c.fillRect(ox + col * cell, oy + r * cell, cell + 0.5, cell + 0.5); }
                }
            }
            c.restore();
        }
        function buildScoreCardPng() {
            const W = 640, H = 800;
            const cv = document.createElement('canvas');
            cv.width = W; cv.height = H;
            const c = cv.getContext('2d');
            const g = c.createLinearGradient(0, 0, 0, H);
            g.addColorStop(0, '#0b0b22'); g.addColorStop(1, '#05050f');
            c.fillStyle = g; c.fillRect(0, 0, W, H);
            // Звёзды (детерминированные)
            let seed = 12345;
            const rnd = function() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
            for (let i = 0; i < 70; i++) {
                c.globalAlpha = 0.3 + rnd() * 0.6;
                c.fillStyle = '#ffffff';
                const sz = rnd() * 2 + 0.5;
                c.fillRect(rnd() * W, rnd() * H, sz, sz);
            }
            c.globalAlpha = 1;
            c.strokeStyle = '#2bd1ff'; c.lineWidth = 4; c.strokeRect(6, 6, W - 12, H - 12);
            c.textAlign = 'center';
            // Заголовок (ужимаем шрифт под ширину)
            let ts = 34; c.font = 'bold ' + ts + 'px ' + FONT_FAMILY;
            while (c.measureText(t('title')).width > W - 60 && ts > 10) { ts -= 2; c.font = 'bold ' + ts + 'px ' + FONT_FAMILY; }
            c.fillStyle = '#ffd166'; c.shadowColor = '#ff9d2e'; c.shadowBlur = 8;
            c.fillText(t('title'), W / 2, 84);
            c.shadowBlur = 0;
            // Три жука для антуража
            try {
                const form = bugForms[0][0];
                const cols = ['#ff5e7e', '#ffe14a', '#6bd5ff'];
                for (let i = 0; i < 3; i++) {
                    const col = cols[i];
                    const pal = { 'X': col, 'D': shade(col, 0.6), 'L': shade(col, 1.4), 'e': '#0a0a16', '.': null };
                    paintSprite(c, form, pal, W / 2 + (i - 1) * 92 - 28, 116, 56, 56, null);
                }
            } catch (e) { /* без жуков не страшно */ }
            // Корабль-герой
            paintSprite(c, shipFrame, shipPalette, W / 2 - 90, 196, 180, 180, { color: '#2bd1ff', blur: 16 });
            // Подпись «СЧЁТ» + крупное число
            c.fillStyle = '#8fb7ff'; c.font = '16px ' + FONT_FAMILY;
            c.fillText(t('hud_score').replace(':', '').toUpperCase(), W / 2, 438);
            c.fillStyle = '#ffffff'; c.shadowColor = '#2bd1ff'; c.shadowBlur = 12;
            c.font = 'bold 72px ' + FONT_FAMILY;
            c.fillText(String(score), W / 2, 512);
            c.shadowBlur = 0;
            c.fillStyle = '#9dff5a'; c.font = '20px ' + FONT_FAMILY;
            c.fillText(t('hud_level').replace(':', '').toUpperCase() + ' ' + level, W / 2, 560);
            // Призыв + ссылка
            c.fillStyle = '#ff7c9c'; c.font = '18px ' + FONT_FAMILY;
            c.fillText(t('card_beat'), W / 2, 686);
            c.fillStyle = '#6bd5ff'; c.font = '15px ' + FONT_FAMILY;
            c.fillText('t.me/kosmozhuki_bot', W / 2, 728);
            return { dataUrl: cv.toDataURL('image/png'), w: W, h: H };
        }
        function dataUrlToFile(dataUrl, name) {
            const arr = dataUrl.split(',');
            const bin = atob(arr[1]);
            const u8 = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
            return new File([u8], name, { type: 'image/png' });
        }

        // Поделиться результатом карточкой-картинкой.
        //  - в Telegram: карточка -> подготовленное inline-сообщение (фото) через воркер;
        //    fallback — прежний шаринг ссылки текстом;
        //  - вне Telegram: системный share с файлом, иначе текст+ссылка.
        function shareScore() {
            const text = t('share')(score);
            let card = null;
            try { card = buildScoreCardPng(); } catch (e) { card = null; }

            if (isTelegram) {
                if (card && LEADERBOARD_URL && tg.initData && typeof tg.shareMessage === 'function') {
                    fetch(LEADERBOARD_URL + '/share', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            initData: tg.initData, png: card.dataUrl, text: text,
                            w: card.w, h: card.h, gameUrl: SHARE_URL, playText: '🎮 ' + t('btn_start'),
                        }),
                    }).then(function(r) { return r.json(); }).then(function(d) {
                        if (d && d.ok && d.prepared_message_id) {
                            tg.shareMessage(d.prepared_message_id, function(sent) {
                                if (!sent) shareLinkFallback(text);
                            });
                        } else { shareLinkFallback(text); }
                    }).catch(function() { shareLinkFallback(text); });
                } else {
                    shareLinkFallback(text);
                }
                return;
            }
            // Вне Telegram: системный share с картинкой, если поддерживается
            if (card && navigator.canShare) {
                try {
                    const file = dataUrlToFile(card.dataUrl, 'cosmic-bugs.png');
                    if (navigator.canShare({ files: [file] })) {
                        navigator.share({ files: [file], text: text, url: SHARE_URL }).catch(function() {});
                        return;
                    }
                } catch (e) { /* упадём в текстовый share */ }
            }
            if (navigator.share) { navigator.share({ text: text, url: SHARE_URL }).catch(function() {}); }
        }
        // Прежний способ: открыть диалог пересылки ссылки с текстом.
        function shareLinkFallback(text) {
            if (isTelegram) {
                tg.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(SHARE_URL) +
                                    '&text=' + encodeURIComponent(text));
            } else if (navigator.share) {
                navigator.share({ text: text, url: SHARE_URL }).catch(function() {});
            }
        }

        // Продолжить после гибели (за рекламу): вернуть жизни и отодвинуть строй
        function revivePlayer() {
            usedRevive++;
            lives = 3;
            bullets = [];
            enemyBullets = [];
            // Отодвигаем строй вверх, если жуки у самого игрока
            if (!isBoss) {
                let lowest = 0;
                for (const e of enemies) if (e.alive) lowest = Math.max(lowest, e.y + e.height);
                const safeY = player.y - player.height * 3;
                if (lowest > safeY) {
                    const shift = lowest - safeY;
                    for (const e of enemies) if (e.alive) e.y -= shift;
                }
            }
            createPlayer();
            gameOver = false;
            gameRunning = true;
            paused = false;
            updateScore();
            setUIState('playing');
        }

        // Удвоить очки за рекламу (после игры)
        function doubleScore() {
            usedDouble = true;
            score *= 2;
            spawnFloatText(canvas.width / 2, canvas.height * 0.5, t('doubled'), '#9dff5a');
            updateScore();          // обновит и рекорд (checkRecord)
            refreshOverButtons();
            submitScore();          // удвоенный счёт — обновить место в топе
        }

        // Конец игры
        function showGameOver() {
            gameRunning = false;
            paused = false;
            stopFire();
            refreshOverButtons();
            setUIState('over');
            submitScore();          // отправить результат в глобальный топ
        }

        // Обработчик нажатия клавиш
        const keys = {
            left: false,
            right: false,
            space: false
        };

        const KEY_ACTIONS = {
            'ArrowLeft': 'left', 'a': 'left', 'A': 'left',
            'ArrowRight': 'right', 'd': 'right', 'D': 'right',
            ' ': 'fire',
            'Escape': 'pause', 'p': 'pause', 'P': 'pause', 'з': 'pause', 'З': 'pause'
        };

        document.addEventListener('keydown', function(e) {
            const action = KEY_ACTIONS[e.key];
            if (action === 'left') keys.left = true;
            else if (action === 'right') keys.right = true;
            else if (action === 'fire') { startFire(); e.preventDefault(); }
            else if (action === 'pause') togglePause();
        });

        document.addEventListener('keyup', function(e) {
            const action = KEY_ACTIONS[e.key];
            if (action === 'left') keys.left = false;
            else if (action === 'right') keys.right = false;
            else if (action === 'fire') stopFire();
        });

        // ===== Управление мышкой =====
        // Корабль следует за курсором по горизонтали (с учётом масштаба канваса)
        canvas.addEventListener('mousemove', function(e) {
            if (!gameRunning || gameOver || paused || !player.width) return;
            player.x = canvasCoord(e.clientX) - player.width / 2;
            clampPlayerX();
        });

        // Выстрел по зажатию левой кнопки (удержание — автоматическая стрельба)
        canvas.addEventListener('mousedown', function(e) {
            if (e.button === 0) startFire();
        });
        window.addEventListener('mouseup', function(e) {
            if (e.button === 0) stopFire();
        });

        // ===== Сенсорные контролы (телефон) =====
        // Трек-полоса слева: относительный свайп с ускорением — короткого
        // движения хватает, чтобы пройти всё поле.
        const MOVE_GAIN = 1.9;
        const PAD_TAP_FIRE_MS = 250;   // макс. пауза между тапами для выстрела
        let padTouchId = null, padLastX = 0;
        let lastPadUp = 0;              // время отрыва пальца от трека (для тап-выстрела)
        let padHeld = false;           // палец на треке (для «очереди» одним пальцем)
        movePad.addEventListener('touchstart', function(e) {
            initAudio();
            // Игра одним пальцем: повторный тап по треку (< 1 с после отрыва) — выстрел
            if (lastPadUp && performance.now() - lastPadUp < PAD_TAP_FIRE_MS) {
                shootPlayerBullet();
            }
            const t = e.changedTouches[0];
            padTouchId = t.identifier;
            padLastX = t.clientX;
            padHeld = true;
            e.preventDefault();
        }, { passive: false });
        movePad.addEventListener('touchmove', function(e) {
            if (padTouchId === null || !player.width) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            for (const t of e.changedTouches) {
                if (t.identifier !== padTouchId) continue;
                const dx = (t.clientX - padLastX) * scaleX * MOVE_GAIN;
                padLastX = t.clientX;
                player.x += dx;
                clampPlayerX();
                e.preventDefault();
            }
        }, { passive: false });
        function endPad(e) {
            for (const t of e.changedTouches) {
                if (t.identifier === padTouchId) {
                    padTouchId = null;
                    padHeld = false;
                    lastPadUp = performance.now();   // запоминаем отрыв для тап-выстрела
                }
            }
        }
        movePad.addEventListener('touchend', endPad);
        movePad.addEventListener('touchcancel', endPad);

        // Единое удержание огня для всех способов ввода (пробел / мышь / «Огонь»).
        // Мгновенный первый выстрел, дальше — автострельба в update(): обычный
        // темп, а при активной «очереди» — частый.
        function startFire() {
            if (fireHeld) return;          // игнорируем авто-повтор клавиши и лишние касания
            initAudio();
            fireHeld = true;
            fireCooldown = getFireInterval();
            shootPlayerBullet();
        }
        function stopFire() {
            fireHeld = false;
        }
        fireButton.addEventListener('touchstart', function(e) { startFire(); e.preventDefault(); }, { passive: false });
        fireButton.addEventListener('touchend', function(e) { stopFire(); e.preventDefault(); }, { passive: false });
        fireButton.addEventListener('touchcancel', stopFire);
        fireButton.addEventListener('mousedown', startFire);
        fireButton.addEventListener('mouseup', stopFire);
        fireButton.addEventListener('mouseleave', stopFire);

        // Пауза / продолжение
        function togglePause() {
            if (!gameRunning || gameOver) return;
            paused = !paused;
            pauseButton.classList.toggle('paused', paused);
            if (paused) stopFire();
        }

        // Кнопка паузы (кружок слева сверху)
        pauseButton.addEventListener('click', togglePause);

        // Центральная кнопка — старт новой игры / рестарт
        startButton.addEventListener('click', function() {
            initAudio();
            startGame();
        });
        restartButton.addEventListener('click', function() {
            initAudio();
            startGame();
        });
        // Продолжить за рекламу
        // Сообщение, если реклама не показалась (нет заполнения/модерация/ошибка)
        function adUnavailable() {
            spawnFloatText(canvas.width / 2, canvas.height * 0.5, t('adUnavailable'), '#ff7c9c');
        }
        reviveBtn.addEventListener('click', function() {
            initAudio();
            Ads.showRewarded(revivePlayer, adUnavailable);
        });
        // Удвоить очки за рекламу
        doubleBtn.addEventListener('click', function() {
            initAudio();
            Ads.showRewarded(doubleScore, adUnavailable);
        });
        shareBtn.addEventListener('click', shareScore);

        // Кнопки и оверлей глобального рейтинга
        lbBtnMenu.addEventListener('click', openLeaderboard);
        lbBtnOver.addEventListener('click', openLeaderboard);
        lbClose.addEventListener('click', closeLeaderboard);
        lbOverlay.addEventListener('click', function(e) { if (e.target === lbOverlay) closeLeaderboard(); });

        // Кнопка и оверлей ежедневного бонуса
        dailyBtn.addEventListener('click', function() { initAudio(); openDaily(); });
        dailyClose.addEventListener('click', closeDaily);
        dailyOverlay.addEventListener('click', function(e) { if (e.target === dailyOverlay) closeDaily(); });

        // Перестройка холста при изменении размера/повороте экрана
        window.addEventListener('resize', fitCanvas);
        window.addEventListener('orientationchange', function() { setTimeout(fitCanvas, 200); });

        // Запуск единого цикла анимации
        loadBest();
        loadBestFromCloud();
        loadDaily();
        loadDailyFromCloud();
        applyI18n();
        refreshDailyButton();
        if (!LEADERBOARD_URL) lbBtnMenu.style.display = 'none';   // топ не настроен — прячем кнопку
        setUIState('menu');
        fitCanvas();
        lastTime = performance.now();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
