            font-family: 'Press Start 2P', 'Segoe UI', system-ui, monospace;
            color: #e8e8ff;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100dvh;
            box-sizing: border-box;
        }
        /* Счёт/жизни/уровень — наверху вместо заголовка, с отступом под «чёлку» */
        .hud {
            width: 100%;
            box-sizing: border-box;
            padding: calc(env(safe-area-inset-top) + 8px) 8px 8px;
            text-align: center;
            font-size: clamp(8px, 2.3vw, 13px);
            line-height: 1.5;
            text-shadow: 0 0 8px rgba(124, 246, 255, 0.6);
        }
        .hud span { color: #7cffa1; }
        .hud .lives { color: #ff7c9c; display: inline-block; }
        .hud .level { color: #ffd166; }
        /* Вспышка счётчика жизней при подборе сердечка */
        .hud .lives.flash { animation: lifeFlash 0.7s ease; }
        @keyframes lifeFlash {
            0%   { transform: scale(1);   color: #ff7c9c; text-shadow: 0 0 8px rgba(255,124,156,0.6); }
            30%  { transform: scale(1.6); color: #ff4d6d; text-shadow: 0 0 16px rgba(255,77,109,0.95); }
            100% { transform: scale(1);   color: #ff7c9c; text-shadow: 0 0 8px rgba(255,124,156,0.6); }
        }
        .hud .sep { color: #5a6090; margin: 0 4px; }
        /* Игровое поле — занимает всё оставшееся место */
        .stage {
            position: relative;
            flex: 1;
            min-height: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            border: 2px solid #2bd1ff;
            border-radius: 8px;
            background-color: #05050f;
            box-shadow: 0 0 25px rgba(43, 209, 255, 0.45), inset 0 0 40px rgba(20, 20, 60, 0.6);
            touch-action: none;
            display: block;
        }
        /* На телефоне голубая рамка и свечение не нужны */
        @media (pointer: coarse) {
            canvas {
                border: none;
                border-radius: 0;
                box-shadow: none;
            }
        }

        /* Единый «прозрачный» пиксельный стиль для оверлей-контролов:
           прямые углы со ступенчатым срезом, чёткая рамка, без размытий */
        .ctrl {
            position: absolute;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(220, 232, 255, 0.10);
            border: 2px solid rgba(220, 232, 255, 0.35);
            color: rgba(230, 240, 255, 0.75);
            cursor: pointer;
            padding: 0;
            touch-action: none;
            border-radius: 0;
            clip-path: polygon(
                0 8px, 4px 8px, 4px 4px, 8px 4px, 8px 0,
                calc(100% - 8px) 0, calc(100% - 8px) 4px, calc(100% - 4px) 4px, calc(100% - 4px) 8px, 100% 8px,
                100% calc(100% - 8px), calc(100% - 4px) calc(100% - 8px), calc(100% - 4px) calc(100% - 4px), calc(100% - 8px) calc(100% - 4px), calc(100% - 8px) 100%,
                8px 100%, 8px calc(100% - 4px), 4px calc(100% - 4px), 4px calc(100% - 8px), 0 calc(100% - 8px)
            );
        }
        .ctrl:active { background: rgba(220, 232, 255, 0.20); }

        /* Кнопка паузы — пиксельный квадрат справа сверху, видна только в игре */
        .pause-btn {
            display: none;
            top: 10px;          /* стартовое значение; точная привязка к холсту — в JS */
            right: 10px;
            width: 44px;
            height: 44px;
            gap: 5px;
        }
        body.state-playing .pause-btn { display: flex; }
        .pause-btn::before, .pause-btn::after {
            content: '';
            width: 6px;
            height: 18px;
            background: rgba(230, 240, 255, 0.8);
        }
        /* В паузе значок превращается в ступенчатый пиксельный «play» */
        .pause-btn.paused::before {
            width: 15px;
            height: 21px;
            background: rgba(230, 240, 255, 0.8);
            clip-path: polygon(
                0 0, 33.4% 0, 33.4% 14.3%, 66.7% 14.3%, 66.7% 28.6%, 100% 28.6%,
                100% 71.4%, 66.7% 71.4%, 66.7% 85.7%, 33.4% 85.7%, 33.4% 100%, 0 100%
            );
        }
        .pause-btn.paused::after { display: none; }

        /* Мобильные контролы — низ экрана, только на сенсорных устройствах */
        .touch-controls { display: none; }
        @media (pointer: coarse) {
            body.state-playing .touch-controls { display: block; }
        }
        .move-pad {
            position: absolute;
            z-index: 5;
            left: 10px;
            bottom: calc(env(safe-area-inset-bottom) + 12px);
            width: 80%;
            max-width: calc(100% - 115px);   /* оставляем место под кнопку «Огонь» */
            height: 58px;
            background: rgba(220, 232, 255, 0.08);
            border: 2px solid rgba(220, 232, 255, 0.3);
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(230, 240, 255, 0.45);
            font-size: 14px;
            letter-spacing: 8px;
            clip-path: polygon(
                0 8px, 4px 8px, 4px 4px, 8px 4px, 8px 0,
                calc(100% - 8px) 0, calc(100% - 8px) 4px, calc(100% - 4px) 4px, calc(100% - 4px) 8px, 100% 8px,
                100% calc(100% - 8px), calc(100% - 4px) calc(100% - 8px), calc(100% - 4px) calc(100% - 4px), calc(100% - 8px) calc(100% - 4px), calc(100% - 8px) 100%,
                8px 100%, 8px calc(100% - 4px), 4px calc(100% - 4px), 4px calc(100% - 8px), 0 calc(100% - 8px)
            );
        }
        .fire-btn {
            right: 14px;
            bottom: calc(env(safe-area-inset-bottom) + 4px);
            width: 74px;
            height: 74px;
            font-size: 10px;
            letter-spacing: 0;
            flex-direction: column;
        }
        .fire-btn::before {
            content: '';
            width: 12px;
            height: 12px;
            background: rgba(230, 240, 255, 0.75);
            margin-bottom: 6px;
        }

        /* Центральная кнопка старт/заново — в меню и после проигрыша */
        .center-btn {
            display: none;
            position: absolute;
            z-index: 6;
            top: 56%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 14px 22px;
            font-size: clamp(10px, 2.6vw, 13px);
            white-space: nowrap;
            cursor: pointer;
            color: #05050f;
            letter-spacing: 0;
            font-family: inherit;
            background: linear-gradient(180deg, #7cf6ff, #2bd1ff);
            border: none;
            border-radius: 8px;
            box-shadow: 0 0 16px rgba(43, 209, 255, 0.6);
            transition: transform 0.08s ease, box-shadow 0.2s ease;
        }
        body.state-menu .center-btn,
        body.state-over .center-btn { display: block; }
        .center-btn:hover { box-shadow: 0 0 26px rgba(43, 209, 255, 0.9); }
        .center-btn:active { transform: translate(-50%, -50%) translateY(1px); }

<body>

    <script>

        const fireButton = document.getElementById('fireButton');
        const stageElement = document.querySelector('.stage');

        // Сенсорное устройство — показываем тач-контролы и приподнимаем корабль над ними
        const isTouch = window.matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);

        // Переключение состояния интерфейса: menu | playing | over
        function setUIState(state) {
            document.body.className = 'state-' + state;
        }

        // Привязка кнопки паузы к правому верхнему углу холста
        // (а не к краю широкой сцены, где она «улетала» в угол экрана).
        function positionPauseButton() {
            pauseButton.style.top = (canvas.offsetTop + 10) + 'px';
            pauseButton.style.left = 'auto';
            const fromRight = stageElement.clientWidth - (canvas.offsetLeft + canvas.offsetWidth) + 10;
            pauseButton.style.right = fromRight + 'px';
        }

        // Отступ корабля от низа: на сенсорных экранах оставляем место под
        // нижние контролы (трек движения и кнопку «Огонь»), чтобы он не прятался.
        function shipBottomInset() {
            const base = Math.round(canvas.height * 0.04);
            if (!isTouch) return base;
            const sclY = canvas.height / (parseFloat(canvas.style.height) || canvas.height);
            return base + Math.round(96 * sclY);   // ~96px CSS под контролы + safe-area
        }

        // Игровые параметры — пересчитываются под размер холста (см. computeLayout)
        let playerWidth = 50;

        let bulletWidth = 4;
        let bulletHeight = 15;
        let enemyRows = 5;
        let enemyCols = 10;
        let enemySpacing = 10;
        let enemyStep = 20;   // шаг строя вниз
        let unit = 1;         // масштаб скоростей относительно эталона (высота 600)

        let player = {};

        let isBoss = false;

        function currentFormIndex() {
            return Math.floor((level - 1) / 5) % bugForms.length;
        }

        // Декоративные слои
        let stars = [];

        let powerups = [];

        let shieldTimer = 0;                  // мс действия щита

        function pickPowerupType() {
            let total = 0;
            for (const t of POWERUP_TYPES) total += POWERUP_WEIGHTS[t] || 1;
            let r = Math.random() * total;
            for (const t of POWERUP_TYPES) {

            }
            return POWERUP_TYPES[0];

            const d = new Date();
            d.setTime(d.getTime() + days * 86400000);

        }
        function getCookie(name) {
            const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
            return m ? decodeURIComponent(m[1]) : null;
        }
        function loadBest() {
            bestScore = parseInt(getCookie('ksi_best_score'), 10) || 0;
            bestLevel = parseInt(getCookie('ksi_best_level'), 10) || 0;
            hadRecord = bestScore > 0 || bestLevel > 0;
        }
        function saveBest() {
            setCookie('ksi_best_score', bestScore, 3650);
            setCookie('ksi_best_level', bestLevel, 3650);
        }
        // Проверка/обновление рекорда; салют — при превышении уже существующего рекорда

        // ===== Звук (Web Audio, синтез без файлов) =====
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) audioCtx = new AC();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }
        function sndShoot() {
            if (!audioCtx) return;
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'square';
            const t = audioCtx.currentTime;
            o.frequency.setValueAtTime(900, t);
            o.frequency.exponentialRampToValueAtTime(240, t + 0.14);
            g.gain.setValueAtTime(0.05, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(t); o.stop(t + 0.14);
        }
        function sndExplosion() {
            if (!audioCtx) return;
            const dur = 0.32;
            const buffer = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
            const src = audioCtx.createBufferSource();
            src.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 1200;
            const g = audioCtx.createGain();
            g.gain.value = 0.13;
            src.connect(filter); filter.connect(g); g.connect(audioCtx.destination);
            src.start();
        }
        function sndHit() {
            if (!audioCtx) return;
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'sawtooth';
            const t = audioCtx.currentTime;
            o.frequency.setValueAtTime(320, t);
            o.frequency.exponentialRampToValueAtTime(60, t + 0.3);
            g.gain.setValueAtTime(0.12, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(t); o.stop(t + 0.3);
        }
        function sndPowerup() {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            [523, 659, 784, 1047].forEach((f, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'square';
                const st = t + i * 0.06;
                o.frequency.setValueAtTime(f, st);
                g.gain.setValueAtTime(0.06, st);
                g.gain.exponentialRampToValueAtTime(0.0001, st + 0.13);
                o.connect(g); g.connect(audioCtx.destination);
                o.start(st); o.stop(st + 0.13);
            });
        }
        function sndFanfare() {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            // триумфальное восходящее арпеджио
            [523, 659, 784, 1047, 1319].forEach((f, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'triangle';
                const st = t + i * 0.1;
                o.frequency.setValueAtTime(f, st);
                g.gain.setValueAtTime(0.09, st);
                g.gain.exponentialRampToValueAtTime(0.0001, st + 0.35);
                o.connect(g); g.connect(audioCtx.destination);
                o.start(st); o.stop(st + 0.35);
            });
        }

        // ===== Салют «Новый рекорд» =====
        function startCelebration() {
            celebrateTimer = 3600;   // мс показа надписи и залпов
            fireworkTimer = 0;       // первый залп сразу

        }
        function spawnFirework() {
            const x = canvas.width * (0.15 + Math.random() * 0.7);
            const y = canvas.height * (0.12 + Math.random() * 0.4);
            const colors = ['#ff5e7e', '#ffd166', '#7cffa1', '#6bd5ff', '#c13ae0', '#ff9d2e', '#ffffff'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const n = 30;
            for (let i = 0; i < n; i++) {
                const a = (Math.PI * 2) * i / n + Math.random() * 0.12;
                const sp = Math.random() * 3.5 + 2;
                particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color: color });
            }
            sndExplosion();
        }

        // ===== Адаптация под размер экрана (в т.ч. портрет iPhone) =====
        // Пересчёт игровых размеров от текущего холста
        function computeLayout() {
            const W = canvas.width, H = canvas.height;
            unit = H / 600;
            const portrait = H > W;
            enemyRows = 5;
            enemyCols = portrait ? 6 : 10;           // в портрете строй уже
            enemySpacing = Math.max(6, Math.round(W * 0.014));
            // Строй занимает ~72% ширины — остаётся место для движения вбок,
            // иначе он отскакивает от стенок каждый кадр и слишком быстро падает вниз
            const usableW = W * 0.72;
            enemyWidth = Math.floor((usableW - enemySpacing * (enemyCols - 1)) / enemyCols);
            enemyHeight = Math.round(enemyWidth * 0.78);
            playerWidth = Math.round(enemyWidth * 1.25);
            playerHeight = Math.round(playerWidth * 0.6);
            bulletWidth = Math.max(3, Math.round(W * 0.006));
            bulletHeight = Math.max(10, Math.round(H * 0.025));
            enemyStep = Math.round(enemyHeight * 0.35);
        }

        // Пропорциональный перенос объектов при изменении размера холста
        function rescaleEntities(oldW, oldH) {
            if (!oldW || !oldH) { initStars(); return; }
            const sx = canvas.width / oldW, sy = canvas.height / oldH;
            if (player && player.width) {
                player.x *= sx;
                player.width = playerWidth;
                player.height = playerHeight;
                player.y = canvas.height - playerHeight - shipBottomInset();
                player.speed = 5 * unit;
                player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            }
            for (const e of enemies) { e.x *= sx; e.y *= sy; e.width = enemyWidth; e.height = enemyHeight; }
            for (const b of bullets) { b.x *= sx; b.y *= sy; }
            for (const b of enemyBullets) { b.x *= sx; b.y *= sy; }
            for (const pu of powerups) { pu.x *= sx; pu.y *= sy; pu.width = Math.round(enemyWidth * 0.7); pu.height = pu.width; }
            if (boss) {
                const bf = bossDefs[boss.form || 0].frame;
                boss.x *= sx; boss.y *= sy;
                boss.width = Math.round(canvas.width * 0.3);
                boss.height = Math.round(boss.width * (bf.length / bf[0].length));
                boss.vx = (boss.vx < 0 ? -1 : 1) * (canvas.width * 0.25) / 60;
                if (boss.vy !== 0) boss.vy = (boss.vy < 0 ? -1 : 1) * (canvas.height * 0.16) / 60;
                boss.yMin *= sy; boss.yMax *= sy;
            }
            initStars();
        }

        // Подгонка холста под доступное место сцены (с учётом плотности пикселей)
        function fitCanvas() {
            const oldW = canvas.width, oldH = canvas.height;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            // Сцена флексом занимает всё под HUD — меряем её, а не окно целиком
            const availW = Math.max(240, (stageElement.clientWidth || window.innerWidth) - 8);
            const availH = Math.max(320, (stageElement.clientHeight || window.innerHeight) - 8);
            const portrait = availH > availW;
            let cssW, cssH;
            if (portrait) {
                cssW = availW;
                cssH = availH;
            } else {
                cssW = Math.min(availW, 900);   // на десктопе не растягиваем на весь монитор
                cssH = Math.min(availH, 680);
            }
            canvas.style.width = cssW + 'px';
            canvas.style.height = cssH + 'px';
            canvas.width = Math.round(cssW * dpr);
            canvas.height = Math.round(cssH * dpr);
            computeLayout();
            rescaleEntities(oldW, oldH);
            positionPauseButton();
        }

        // ===== Звёздное небо =====
        function initStars() {
            stars = [];
            for (let i = 0; i < 110; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 1.6 + 0.3,
                    speed: Math.random() * 1.1 + 0.2
                });
            }
        }
        function updateStars(dt) {
            for (const s of stars) {
                s.y += s.speed * dt;
                if (s.y > canvas.height) {
                    s.y = 0;
                    s.x = Math.random() * canvas.width;
                }
            }
        }

        // ===== Частицы взрыва =====
        function spawnExplosion(x, y, color) {
            for (let i = 0; i < 18; i++) {
                const a = Math.random() * Math.PI * 2;
                const sp = Math.random() * 4 + 1;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(a) * sp,
                    vy: Math.sin(a) * sp,
                    life: 1,
                    color: color
                });
            }
        }
        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += 0.06 * dt;
                p.life -= 0.03 * dt;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        // ===== Всплывающие надписи =====
        function spawnFloatText(x, y, text, color) {
            floatTexts.push({ x: x, y: y, text: text, color: color, life: 1 });
        }
        function updateFloatTexts(dt) {
            for (let i = floatTexts.length - 1; i >= 0; i--) {
                const f = floatTexts[i];
                f.y -= 0.7 * unit * dt;     // плывёт вверх
                f.life -= 0.012 * dt;       // и затухает
                if (f.life <= 0) floatTexts.splice(i, 1);
            }
        }
        function drawFloatTexts() {
            const fs = Math.max(14, Math.round(canvas.width * 0.034));
            ctx.save();
            ctx.font = `bold ${fs}px 'Press Start 2P', monospace`;
            ctx.textAlign = 'center';
            for (const f of floatTexts) {
                ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
                ctx.fillStyle = f.color;
                ctx.shadowColor = f.color;
                ctx.shadowBlur = 12;
                ctx.fillText(f.text, f.x, f.y);
            }
            ctx.restore();
            ctx.globalAlpha = 1;
            ctx.textAlign = 'left';
        }

        // Создание уровня (игрок + строй врагов). Счёт и жизни НЕ сбрасываются.
        function spawnLevel() {
            // Создаем игрока
            player = {
                x: canvas.width / 2 - playerWidth / 2,
                y: canvas.height - playerHeight - shipBottomInset(),
                width: playerWidth,
                height: playerHeight,
                speed: 5 * unit
            };

            // Создаем врагов (строй центрируется по ширине холста)
            const formationW = enemyCols * enemyWidth + (enemyCols - 1) * enemySpacing;
            const startX = (canvas.width - formationW) / 2;
            const startY = Math.round(canvas.height * 0.08);
            enemies = [];
            for (let row = 0; row < enemyRows; row++) {
                for (let col = 0; col < enemyCols; col++) {
                    enemies.push({
                        x: startX + col * (enemyWidth + enemySpacing),
                        y: startY + row * (enemyHeight + enemySpacing),
                        width: enemyWidth,
                        height: enemyHeight,
                        alive: true,
                        row: row
                    });
                }
            }

            // Очищаем пули, частицы и падающие призы (бонус по времени сохраняется)
            bullets = [];
            enemyBullets = [];
            particles = [];
            powerups = [];
            floatTexts = [];

            // Сложность считается ВНУТРИ цикла из 5 раундов: после каждого босса
            // (нового цикла) она «сбрасывается» к началу, но каждый цикл чуть выше —
            // поэтому спуск замедляется после босса, но в целом игра ускоряется.
            const cycle = Math.floor((level - 1) / 5);    // 0,1,2,... (сколько боссов пройдено)
            const inCycle = (level - 1) % 5;              // 0..4 — номер раунда в цикле
            const diff = inCycle + cycle;                 // сбрасывается каждый цикл, +1 за цикл

            // Скорость задаётся так, чтобы строй пересекал свободное поле за фиксированное
            // время — тогда темп одинаков и в широком альбомном, и в узком портретном холсте.
            const margin = 10 * unit;
            const travelRoom = Math.max(40, canvas.width - formationW - 2 * margin);
            const traverseSec = Math.max(0.7, 1.6 - diff * 0.18);
            enemySpeed = travelRoom / (traverseSec * 60);   // px за кадр (при 60 fps), далее * dt

            // Шаг спуска привязан к расстоянию до игрока: фиксированное число «ступеней»,
            // поэтому время до игрока одинаково на коротком и высоком холсте.
            const formationBottom = startY + enemyRows * (enemyHeight + enemySpacing) - enemySpacing;
            const desiredSteps = Math.max(10, 22 - diff * 2);
            enemyStep = Math.max(6, Math.round((player.y - formationBottom) / desiredSteps));

            enemyShootInterval = Math.max(350, 1000 - diff * 90);

            // Сбрасываем флаги уровня
            isBoss = false;
            boss = null;
            gameRunning = true;
            gameOver = false;
            enemyDirection = 1;
            enemyMoveDownTimer = 0;
            enemyShootTimer = 0;
        }

        // Бой с боссом: один большой пришелец, HP = числу пришельцев в строю
        function spawnBoss() {
            player = {
                x: canvas.width / 2 - playerWidth / 2,
                y: canvas.height - playerHeight - shipBottomInset(),
                width: playerWidth,
                height: playerHeight,
                speed: 5 * unit
            };
            enemies = [];
            bullets = [];
            enemyBullets = [];
            particles = [];
            powerups = [];
            floatTexts = [];

            const form = currentFormIndex();   // форма предыдущих 5 раундов
            const def = bossDefs[form];
            const bw = Math.round(canvas.width * 0.3);
            const bh = Math.round(bw * (def.frame.length / def.frame[0].length));
            const hp = enemyRows * enemyCols;   // HP = суммарному HP всех пришельцев
            const bossNum = Math.max(1, Math.round(level / 5));  // 1,2,3,... номер босса
            const spX = (canvas.width * 0.25) / 60;
            const spY = (canvas.height * 0.16) / 60;
            const yTop = Math.round(canvas.height * 0.06);
            // со 2-го босса — диагональ (вертикальная скорость), с 3-го — больший
            // вертикальный размах (залетает ниже)
            const yBand = bossNum >= 3 ? 0.6 : (bossNum >= 2 ? 0.42 : 0.2);
            boss = {
                form: form,
                x: canvas.width / 2 - bw / 2,
                y: yTop,
                width: bw,
                height: bh,
                vx: spX * (Math.random() < 0.5 ? 1 : -1),
                vy: bossNum >= 2 ? spY * (Math.random() < 0.5 ? 1 : -1) : 0,
                yMin: yTop,
                yMax: Math.round(canvas.height * yBand),
                hp: hp,
                maxHp: hp,
                shootTimer: 0,
                shootInterval: Math.max(500, 900 - (level - 1) * 25)
            };

            isBoss = true;
            gameRunning = true;
            gameOver = false;
            enemyShootTimer = 0;
        }

        // Новая игра с первого уровня
        function startGame() {
            score = 0;
            lives = 3;
            level = 1;
            tripleShotTimer = 0;
            shieldTimer = 0;
            freezeTimer = 0;
            rapidTimer = 0;
            doubleShotTimer = 0;
            fireHeld = false;
            fireCooldown = 0;
            isBoss = false;
            boss = null;
            bossVictoryTimer = 0;
            paused = false;
            // Новая игра — салют можно показать снова; рекорд берём актуальный
            recordCelebrated = false;
            celebrateTimer = 0;
            hadRecord = bestScore > 0 || bestLevel > 0;
            pauseButton.classList.remove('paused');
            updateScore();
            spawnLevel();
            setUIState('playing');
        }

        // Переход к следующему этапу: после каждого 5-го раунда — бой с боссом,
        // победа над боссом ведёт к следующему раунду (с новой формой пришельцев).
        function advanceStage() {
            if (isBoss) {
                level++;            // босс побеждён — следующий обычный раунд
                spawnLevel();
            } else if (level % 5 === 0) {
                spawnBoss();        // отыграли 5-й раунд — босс
            } else {
                level++;
                spawnLevel();
            }
            updateScore();
        }

        // Обновление счета
        function updateScore() {
            scoreElement.textContent = score;
            livesElement.textContent = lives;
            levelElement.textContent = level;
            checkRecord();
        }

        // Кратко подсветить счётчик жизней (при подборе сердечка)
        function flashLives() {
            livesElement.classList.remove('flash');
            void livesElement.offsetWidth;   // перезапуск анимации
            livesElement.classList.add('flash');
        }

        // Единый цикл: звёзды и частицы живут всегда, логика — только в игре
        function loop(currentTime) {
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;
            // Нормировка к 60 fps: на 120 Гц экранах (iPhone Pro) кадров вдвое больше,
            // поэтому движение считаем по времени, а не по числу кадров
            const dt = Math.min(deltaTime / 16.6667, 3);

            updateStars(dt);
            updateParticles(dt);
            updateFloatTexts(dt);

            // Салют «Новый рекорд» живёт поверх любого состояния
            if (celebrateTimer > 0) {
                celebrateTimer = Math.max(0, celebrateTimer - deltaTime);
                fireworkTimer -= deltaTime;
                if (fireworkTimer <= 0 && celebrateTimer > 400) {
                    spawnFirework();
                    fireworkTimer = 300;
                }
            }

            // Пауза после победы над боссом: показываем надпись, затем продолжаем
            if (bossVictoryTimer > 0) {
                bossVictoryTimer = Math.max(0, bossVictoryTimer - deltaTime);
                if (bossVictoryTimer === 0) advanceStage();
            }

            // Игровая логика стоит на паузе во время «Босс повержен»
            if (gameRunning && !gameOver && !paused && bossVictoryTimer <= 0) {
                update(deltaTime, dt);
            }

            draw();
            requestAnimationFrame(loop);
        }

        // Обновление состояния игры
        function update(deltaTime, dt) {
            // Обработка движения игрока
            if (keys.left && player.x > 0) {
                player.x -= player.speed * dt;
            }
            if (keys.right && player.x < canvas.width - player.width) {
                player.x += player.speed * dt;
            }

            // Таймеры бонусов тают (пауза замораживает их — сюда мы не заходим)
            if (tripleShotTimer > 0) tripleShotTimer = Math.max(0, tripleShotTimer - deltaTime);
            if (shieldTimer > 0) shieldTimer = Math.max(0, shieldTimer - deltaTime);
            if (freezeTimer > 0) freezeTimer = Math.max(0, freezeTimer - deltaTime);
            if (rapidTimer > 0) rapidTimer = Math.max(0, rapidTimer - deltaTime);
            if (doubleShotTimer > 0) doubleShotTimer = Math.max(0, doubleShotTimer - deltaTime);

            // Автострельба при удержании огня. С активной «очередью» темп выше.
            if (fireHeld) {
                fireCooldown -= deltaTime;
                if (fireCooldown <= 0) {
                    shootPlayerBullet();
                    fireCooldown = rapidTimer > 0 ? RAPID_INTERVAL : HOLD_INTERVAL;
                }
            }

            // Обновление пуль игрока
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= 7 * unit * dt;
                bullets[i].x += (bullets[i].vx || 0) * dt;

                // Удаляем пули, вышедшие за границы (верх или бока — для угловых)
                if (bullets[i].y < 0 || bullets[i].x < -bulletWidth || bullets[i].x > canvas.width) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Бой с боссом: каждое попадание снимает 1 HP
                if (isBoss) {
                    if (boss && bullets[i].x < boss.x + boss.width &&
                        bullets[i].x + bulletWidth > boss.x &&
                        bullets[i].y < boss.y + boss.height &&
                        bullets[i].y + bulletHeight > boss.y) {
                        boss.hp--;
                        spawnExplosion(bullets[i].x, bullets[i].y, '#e89bff');
                        bullets.splice(i, 1);
                        score += 5;
                        updateScore();
                        if (boss.hp <= 0) {
                            defeatBoss();
                            return;
                        }
                    }
                    continue;
                }

                // Проверка столкновения с врагами
                for (let j = 0; j < enemies.length; j++) {
                    if (enemies[j].alive &&
                        bullets[i].x < enemies[j].x + enemies[j].width &&
                        bullets[i].x + bulletWidth > enemies[j].x &&
                        bullets[i].y < enemies[j].y + enemies[j].height &&
                        bullets[i].y + bulletHeight > enemies[j].y) {

                        enemies[j].alive = false;
                        const cx = enemies[j].x + enemies[j].width / 2;
                        const cy = enemies[j].y + enemies[j].height / 2;
                        spawnExplosion(cx, cy, bugColors[enemies[j].row % bugColors.length]);
                        // Сердечко — втрое реже и только если жизней меньше 3; иначе обычный приз
                        if (lives < 3 && Math.random() < POWERUP_DROP_CHANCE / 3) {
                            spawnPowerup(cx, cy, 'heart');
                        } else if (Math.random() < POWERUP_DROP_CHANCE) {
                            spawnPowerup(cx, cy);
                        }
                        sndExplosion();
                        bullets.splice(i, 1);
                        score += 10;
                        updateScore();
                        break;
                    }
                }
            }

            // Падающие призы: летят вниз, при касании корабля включают тройной выстрел
            for (let i = powerups.length - 1; i >= 0; i--) {
                const pu = powerups[i];
                pu.y += pu.vy * dt;
                if (pu.y > canvas.height) { powerups.splice(i, 1); continue; }
                if (pu.x < player.x + player.width &&
                    pu.x + pu.width > player.x &&
                    pu.y < player.y + player.height &&
                    pu.y + pu.height > player.y) {
                    if (pu.type === 'shield') shieldTimer = SHIELD_DURATION;
                    else if (pu.type === 'freeze') freezeTimer = FREEZE_DURATION;
                    else if (pu.type === 'rapid') rapidTimer = RAPID_DURATION;
                    else if (pu.type === 'double') doubleShotTimer = DOUBLE_SHOT_DURATION;
                    else if (pu.type === 'heart') {
                        lives++;
                        updateScore();
                        spawnFloatText(player.x + player.width / 2, player.y - player.height * 0.4, '+1 ЖИЗНЬ', '#ff6b86');
                        flashLives();
                    }
                    else tripleShotTimer = TRIPLE_SHOT_DURATION;
                    spawnExplosion(player.x + player.width / 2, player.y, powerupDefs[pu.type].color);
                    sndPowerup();
                    powerups.splice(i, 1);
                }
            }

            // Бой с боссом обновляется отдельно; иначе — логика строя
            if (isBoss) {
                updateBoss(deltaTime, dt);
            } else {
            // Обновление врагов — при заморозке строй стоит на месте
            if (freezeTimer <= 0) {
                const margin = 10 * unit;
                let leftmost = canvas.width;
                let rightmost = 0;

                // Находим крайних врагов
                for (let i = 0; i < enemies.length; i++) {
                    if (enemies[i].alive) {
                        leftmost = Math.min(leftmost, enemies[i].x);
                        rightmost = Math.max(rightmost, enemies[i].x + enemies[i].width);
                    }
                }

                // Разворот вниз только если строй реально упирается в стену
                // ПО ХОДУ движения. Без проверки направления строй, оказавшийся
                // за линией стены (например, после заморозки), разворачивался бы
                // каждый кадр и моментально сыпался вниз.
                let moveDown = false;
                if ((enemyDirection > 0 && rightmost >= canvas.width - margin) ||
                    (enemyDirection < 0 && leftmost <= margin)) {
                    enemyDirection *= -1;
                    moveDown = true;
                }

                // Двигаем врагов
                const dx = enemyDirection * enemySpeed * dt;
                for (let i = 0; i < enemies.length; i++) {
                    if (enemies[i].alive) {
                        enemies[i].x += dx;
                        if (moveDown) enemies[i].y += enemyStep;
                    }
                }

                // Прижимаем строй внутрь поля, чтобы он не «застревал» за стеной
                leftmost += dx; rightmost += dx;
                let clamp = 0;
                if (rightmost > canvas.width - margin) clamp = (canvas.width - margin) - rightmost;
                else if (leftmost < margin) clamp = margin - leftmost;
                if (clamp !== 0) {
                    for (let i = 0; i < enemies.length; i++) {
                        if (enemies[i].alive) enemies[i].x += clamp;
                    }
                }
            }

            // Проверка на победу
            let allDead = true;
            for (let i = 0; i < enemies.length; i++) {
                if (enemies[i].alive) {
                    allDead = false;
                    break;
                }
            }

            if (allDead) {
                // Раунд пройден — следующий этап (или босс после каждого 5-го)
                advanceStage();
                return;
            }

            // Проверка на проигрыш (враги достигли дна)
            for (let i = 0; i < enemies.length; i++) {
                if (enemies[i].alive && enemies[i].y + enemies[i].height >= player.y) {
                    gameOver = true;
                    showGameOver();
                    return;
                }
            }

            // Враги стреляют (замороженные молчат)
            if (freezeTimer <= 0) {
                enemyShootTimer += deltaTime;
                if (enemyShootTimer >= enemyShootInterval) {
                    enemyShootTimer = 0;
                    shootEnemyBullet();
                }
            }
            } // конец логики строя/босса

            // Обновление пуль врагов (общее для строя и босса)
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                enemyBullets[i].y += 5 * unit * dt;
                enemyBullets[i].x += (enemyBullets[i].vx || 0) * dt;

                // Удаляем пули, вышедшие за границы (низ или бока — для веера босса)
                if (enemyBullets[i].y > canvas.height ||
                    enemyBullets[i].x < -bulletWidth || enemyBullets[i].x > canvas.width) {
                    enemyBullets.splice(i, 1);
                    continue;
                }

                // Проверка столкновения с игроком
                if (enemyBullets[i].x < player.x + player.width &&
                    enemyBullets[i].x + bulletWidth > player.x &&
                    enemyBullets[i].y < player.y + player.height &&
                    enemyBullets[i].y + bulletHeight > player.y) {

                    enemyBullets.splice(i, 1);

                    // Щит поглощает попадание — жизнь не теряется
                    if (shieldTimer > 0) {
                        spawnExplosion(player.x + player.width / 2, player.y + player.height / 2, '#3fd8ff');
                        continue;
                    }

                    lives--;
                    sndHit();
                    spawnExplosion(player.x + player.width / 2, player.y + player.height / 2, '#7cf6ff');
                    updateScore();

                    if (lives <= 0) {
                        gameOver = true;
                        showGameOver();
                        return;
                    }
                }
            }
        }

        // Создание падающего приза в точке (cx, cy). Тип можно задать явно
        // (forced), иначе берётся случайный из POWERUP_TYPES (без сердечка).
        function spawnPowerup(cx, cy, forced) {
            const size = Math.round(enemyWidth * 0.7);
            const type = forced || pickPowerupType();
            powerups.push({
                x: cx - size / 2,
                y: cy - size / 2,
                width: size,
                height: size,
                vy: 1.7 * unit,
                type: type
            });
        }

        // Выстрел игрока. При активном бонусе — три пули: прямо + две под углом
        function shootPlayerBullet() {
            if (!gameRunning || gameOver || paused || !player.width) return;
            const cx = player.x + player.width / 2 - bulletWidth / 2;
            const top = player.y - bulletHeight;
            if (tripleShotTimer > 0) {
                bullets.push({ x: cx, y: top, width: bulletWidth, height: bulletHeight, vx: 0 });
                bullets.push({ x: cx, y: top, width: bulletWidth, height: bulletHeight, vx: -2.6 * unit });
                bullets.push({ x: cx, y: top, width: bulletWidth, height: bulletHeight, vx: 2.6 * unit });
            } else if (doubleShotTimer > 0) {
                // две параллельные пули на ширине корабля (без угла)
                const lx = player.x + player.width * 0.2 - bulletWidth / 2;
                const rx = player.x + player.width * 0.8 - bulletWidth / 2;
                bullets.push({ x: lx, y: top, width: bulletWidth, height: bulletHeight, vx: 0 });
                bullets.push({ x: rx, y: top, width: bulletWidth, height: bulletHeight, vx: 0 });
            } else {
                bullets.push({ x: cx, y: top, width: bulletWidth, height: bulletHeight, vx: 0 });
            }
            sndShoot();
        }

        // Стрельба врагов
        function shootEnemyBullet() {
            // Выбираем случайного живого врага
            const aliveEnemies = enemies.filter(enemy => enemy.alive);
            if (aliveEnemies.length > 0) {
                const randomEnemy = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
                enemyBullets.push({
                    x: randomEnemy.x + randomEnemy.width / 2 - bulletWidth / 2,
                    y: randomEnemy.y + randomEnemy.height,
                    width: bulletWidth,
                    height: bulletHeight
                });
            }
        }

        // ===== Босс =====
        function updateBoss(deltaTime, dt) {
            if (!boss) return;
            const margin = 10 * unit;
            // Горизонталь — с отскоком от стен
            boss.x += boss.vx * dt;
            if (boss.x <= margin) { boss.x = margin; boss.vx = Math.abs(boss.vx); }
            if (boss.x + boss.width >= canvas.width - margin) {
                boss.x = canvas.width - margin - boss.width;
                boss.vx = -Math.abs(boss.vx);
            }
            // Вертикаль (со 2-го босса) — отскок в дозволенной полосе
            if (boss.vy !== 0) {
                boss.y += boss.vy * dt;
                if (boss.y <= boss.yMin) { boss.y = boss.yMin; boss.vy = Math.abs(boss.vy); }
                if (boss.y + boss.height >= boss.yMax) {
                    boss.y = boss.yMax - boss.height;
                    boss.vy = -Math.abs(boss.vy);
                }
            }
            // Стрельба веером
            boss.shootTimer += deltaTime;
            if (boss.shootTimer >= boss.shootInterval) {
                boss.shootTimer = 0;
                shootBossBullets();
            }
        }
        function shootBossBullets() {
            const cx = boss.x + boss.width / 2 - bulletWidth / 2;
            const by = boss.y + boss.height * 0.85;
            for (const vx of [-2.4 * unit, 0, 2.4 * unit]) {
                enemyBullets.push({ x: cx, y: by, width: bulletWidth, height: bulletHeight, vx: vx });
            }
        }
        function defeatBoss() {
            const def = bossDefs[boss.form || 0];
            // Фейерверк взрывов по корпусу
            for (let k = 0; k < 26; k++) {
                spawnExplosion(boss.x + Math.random() * boss.width,
                               boss.y + Math.random() * boss.height, def.bodyGlow);
            }
            sndExplosion();
            score += 200;
            updateScore();
            boss = null;                 // босс уничтожен
            enemyBullets = [];           // его пули убираем, чтобы не задели в паузе
            bossVictoryTimer = 1800;     // показываем «БОСС ПОВЕРЖЕН!» и держим паузу
            // продолжение игры (advanceStage) — по истечении таймера, см. loop()
        }

        // ===== Рисование объектов =====

        // Затемнение / осветление hex-цвета (f<1 темнее, f>1 светлее)
        function shade(hex, f) {
            const n = parseInt(hex.slice(1), 16);
            const r = Math.max(0, Math.min(255, Math.round(((n >> 16) & 255) * f)));
            const g = Math.max(0, Math.min(255, Math.round(((n >> 8) & 255) * f)));
            const b = Math.max(0, Math.min(255, Math.round((n & 255) * f)));
            return `rgb(${r},${g},${b})`;
        }

        // Универсальный рендер пиксельного спрайта по сетке символов и палитре
        function drawSprite(grid, palette, x, y, w, h, glow) {
            const cols = grid[0].length;
            const rows = grid.length;
            const cell = Math.min(w / cols, h / rows);
            const ox = x + (w - cell * cols) / 2;
            const oy = y + (h - cell * rows) / 2;
            ctx.save();
            if (glow) {
                ctx.shadowColor = glow.color;
                ctx.shadowBlur = glow.blur;
            }
            for (let r = 0; r < rows; r++) {
                const line = grid[r];
                for (let c = 0; c < cols; c++) {
                    const color = palette[line[c]];
                    if (color) {
                        ctx.fillStyle = color;
                        // +0.5 убирает зазоры между клетками при дробном масштабе
                        ctx.fillRect(ox + c * cell, oy + r * cell, cell + 0.5, cell + 0.5);
                    }
                }
            }
            ctx.restore();
            return { cell, ox, oy, cols, rows };
        }

        // Космический корабль игрока — квадратный пиксельный спрайт
        function drawShip(p) {
            const s = drawSprite(shipFrame, shipPalette, p.x, p.y, p.width, p.height, null);

            // Пламя из дюз — мигающие пиксельные блоки под двигателями
            ctx.save();
            ctx.shadowColor = '#ff9d00';
            ctx.shadowBlur = 6;
            const flick = Math.floor(performance.now() / 90) % 2;
            for (const col of [5, 7]) {
                const len = 1 + flick + (Math.random() < 0.5 ? 1 : 0);
                for (let k = 0; k < len; k++) {
                    ctx.fillStyle = k === 0 ? '#ffd27c' : '#ff6a00';
                    ctx.fillRect(s.ox + col * s.cell, s.oy + (s.rows + k) * s.cell, s.cell + 0.5, s.cell + 0.5);
                }
            }
            ctx.restore();

            drawShipDamage(p, s);
        }

        // Повреждения корабля: чем меньше жизней, тем больше обугленных клеток.
        // Урон считается от текущих жизней, поэтому +1 от сердечка его откатывает.
        function drawShipDamage(p, s) {
            const dmg = Math.max(0, Math.min(shipDamageStages.length, 3 - lives));
            if (dmg <= 0) return;
            ctx.save();
            // Обугленные клетки
            for (let i = 0; i < dmg; i++) {
                for (const [c, r] of shipDamageStages[i]) {
                    ctx.fillStyle = '#241a22';
                    ctx.fillRect(s.ox + c * s.cell, s.oy + r * s.cell, s.cell + 0.5, s.cell + 0.5);
                }
            }
            // Тлеющие угольки на свежих повреждениях (мигают)
            if (Math.floor(performance.now() / 130) % 2 === 0) {
                ctx.fillStyle = '#ff6a00';
                ctx.shadowColor = '#ff6a00';
                ctx.shadowBlur = 6;
                const e = Math.max(1, s.cell * 0.4);
                for (const [c, r] of shipDamageStages[dmg - 1]) {
                    ctx.fillRect(s.ox + c * s.cell + s.cell * 0.3, s.oy + r * s.cell + s.cell * 0.3, e, e);
                }
            }
            ctx.restore();

            // Дым при тяжёлых повреждениях (последняя стадия)
            if (dmg >= shipDamageStages.length) {
                ctx.save();
                const baseX = p.x + p.width * 0.5;
                const baseY = p.y + p.height * 0.28;
                const now = performance.now();
                for (let k = 0; k < 3; k++) {
                    const t = ((now / 750) + k * 0.37) % 1;
                    const px = baseX + Math.sin(now / 320 + k * 2) * s.cell * 0.9;
                    const py = baseY - t * p.height * 0.75;
                    ctx.globalAlpha = (1 - t) * 0.22;
                    ctx.fillStyle = '#9aa0b0';
                    ctx.beginPath();
                    ctx.arc(px, py, s.cell * (0.6 + t * 1.3), 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
                ctx.globalAlpha = 1;
            }
        }

        // Жук-враг — пиксельный спрайт текущей формы, цвет по ряду
        function drawBug(e) {
            const frames = bugForms[currentFormIndex()];
            const frame = frames[Math.floor(performance.now() / 450) % frames.length];
            const base = bugColors[e.row % bugColors.length];
            const palette = {
                'X': base,
                'D': shade(base, 0.55),   // тень
                'L': shade(base, 1.35),   // блик
                'e': '#ffffff',           // глаз
                '.': null
            };
            drawSprite(frame, palette, e.x, e.y, e.width, e.height, null);
        }

        // Босс — большой детальный спрайт с пульсирующими глазами и лёгким покачиванием
        function drawBoss(b) {
            const def = bossDefs[b.form || 0];
            const frame = def.frame;
            const bob = Math.sin(performance.now() / 500) * b.height * 0.02;
            // свечение тела
            const s = drawSprite(frame, def.palette, b.x, b.y + bob, b.width, b.height,
                                 { color: def.bodyGlow, blur: 14 });
            // пульсирующее свечение глаз
            const glow = 6 + Math.sin(performance.now() / 180) * 4;
            ctx.save();
            ctx.shadowColor = def.eyeGlow;
            ctx.shadowBlur = glow;
            ctx.fillStyle = def.eyeGlow;
            for (let r = 0; r < frame.length; r++) {
                for (let c = 0; c < frame[r].length; c++) {
                    if (frame[r][c] === 'e') {
                        ctx.fillRect(s.ox + c * s.cell, s.oy + r * s.cell, s.cell + 0.5, s.cell + 0.5);
                    }
                }
            }
            ctx.restore();
        }

        // Полоса HP босса — по центру сверху
        function drawBossHpBar() {
            if (!boss) return;
            const bw = canvas.width * 0.5;
            const bh = Math.max(8, canvas.height * 0.016);
            const bx = (canvas.width - bw) / 2;
            const by = canvas.height * 0.03;
            const frac = Math.max(0, boss.hp / boss.maxHp);
            const col = frac > 0.5 ? '#9dff5a' : (frac > 0.25 ? '#ffd166' : '#ff5e7e');
            ctx.save();
            ctx.fillStyle = 'rgba(10, 8, 18, 0.7)';
            ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
            ctx.fillStyle = col;
            ctx.shadowColor = col;
            ctx.shadowBlur = 8;
            ctx.fillRect(bx, by, bw * frac, bh);
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(230, 240, 255, 0.5)';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(bx, by, bw, bh);
            const labelCol = bossDefs[boss.form || 0].bodyGlow;
            ctx.fillStyle = labelCol;
            ctx.font = `bold ${Math.round(canvas.width * 0.026)}px 'Press Start 2P', monospace`;
            ctx.textAlign = 'center';
            ctx.shadowColor = labelCol;
            ctx.shadowBlur = 8;
            ctx.fillText('БОСС  ' + boss.hp + ' / ' + boss.maxHp, canvas.width / 2, by + bh + Math.round(canvas.width * 0.032));
            ctx.restore();
            ctx.textAlign = 'left';
        }

        // Капсула-приз с пульсирующим свечением своего цвета
        function drawPowerup(pu) {
            const def = powerupDefs[pu.type];
            const blur = 10 + Math.sin(performance.now() / 150) * 5;
            drawSprite(def.frame, def.palette, pu.x, pu.y, pu.width, pu.height, { color: def.color, blur });
        }

        function drawBackground() {
            const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bg.addColorStop(0, '#0a0a2a');
            bg.addColorStop(1, '#160a26');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Звёзды
            for (const s of stars) {
                ctx.globalAlpha = 0.4 + s.r / 2;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function drawParticles() {
            for (const p of particles) {
                ctx.globalAlpha = Math.max(p.life, 0);
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3 * p.life + 1, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        // Отрисовка игры
        function draw() {
            drawBackground();

            // Экран меню (до старта)
            if (!gameRunning && !gameOver) {
                drawParticles();
                const titleSize = Math.round(canvas.width * 0.048);
                ctx.fillStyle = '#7cf6ff';
                ctx.font = `bold ${titleSize}px 'Press Start 2P', monospace`;
                ctx.textAlign = 'center';
                ctx.shadowColor = '#1b9dff';
                ctx.shadowBlur = 20;
                ctx.fillText('КОСМИЧЕСКИЕ ЖУКИ', canvas.width / 2, canvas.height / 2 - titleSize * 1.8);
                ctx.shadowBlur = 0;
                if (hadRecord) {
                    ctx.fillStyle = '#ffd166';
                    ctx.font = `${Math.round(titleSize * 0.42)}px 'Press Start 2P', monospace`;
                    ctx.fillText(`Рекорд: ${bestScore} · уровень ${bestLevel}`, canvas.width / 2, canvas.height / 2 - titleSize * 0.7);
                }
                ctx.textAlign = 'left';
                return;
            }

            // Игрок
            if (player.width) drawShip(player);

            // Щит — пиксельный полукруг-«козырёк» над кораблём (в тон капсуле)
            if (shieldTimer > 0 && player.width) {
                const cell = Math.max(2, Math.min(player.width / 13, player.height / 10));
                const cx = player.x + player.width / 2;
                const cyc = player.y + player.height * 0.55;
                const R = player.width * 0.66;
                const pulse = 0.6 + Math.sin(performance.now() / 140) * 0.25;
                const steps = Math.max(10, Math.round(Math.PI * R / cell));
                ctx.save();
                ctx.shadowColor = '#3fd8ff';
                ctx.shadowBlur = 8;
                const seen = new Set();
                for (let s = 0; s <= steps; s++) {
                    const a = Math.PI + Math.PI * (s / steps);   // верхняя дуга π..2π
                    const bx = Math.round((cx + Math.cos(a) * R) / cell) * cell;
                    const by = Math.round((cyc + Math.sin(a) * R) / cell) * cell;
                    const key = bx + ',' + by;
                    if (seen.has(key)) continue;
                    seen.add(key);
                    const edge = Math.abs(s / steps - 0.5) * 2;  // 0 на гребне, 1 по краям
                    ctx.globalAlpha = pulse * (1 - edge * 0.35);
                    ctx.fillStyle = edge < 0.5 ? '#aef1ff' : '#3fd8ff';
                    ctx.fillRect(bx, by, cell + 0.5, cell + 0.5);
                }
                ctx.restore();
            }

            // Враги: босс или обычный строй
            if (isBoss) {
                if (boss) { drawBoss(boss); drawBossHpBar(); }
            } else {
                for (let i = 0; i < enemies.length; i++) {
                    if (enemies[i].alive) drawBug(enemies[i]);
                }
            }

            // Морозный налёт при заморозке жуков
            if (freezeTimer > 0) {
                ctx.save();
                ctx.fillStyle = 'rgba(140, 205, 255, 0.12)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
            }

            // Падающие призы
            for (let i = 0; i < powerups.length; i++) drawPowerup(powerups[i]);

            // Пули игрока (светящиеся)
            ctx.save();
            ctx.shadowColor = '#7cff6b';
            ctx.shadowBlur = 12;
            ctx.fillStyle = '#d6ffcf';
            for (let i = 0; i < bullets.length; i++) {
                const b = bullets[i];
                ctx.fillRect(b.x, b.y, bulletWidth, bulletHeight);
            }
            ctx.restore();

            // Пули врагов (светящиеся)
            ctx.save();
            ctx.shadowColor = '#ff6a3d';
            ctx.shadowBlur = 12;
            ctx.fillStyle = '#ffd27c';
            for (let i = 0; i < enemyBullets.length; i++) {
                const b = enemyBullets[i];
                ctx.fillRect(b.x, b.y, bulletWidth, bulletHeight);
            }
            ctx.restore();

            // Частицы взрывов
            drawParticles();

            // Всплывающие надписи («+1 ЖИЗНЬ» и т.п.)
            drawFloatTexts();

            // Индикаторы активных бонусов (стопкой сверху, правее кнопки паузы)
            if (!gameOver) {
                const buffs = [];
                if (tripleShotTimer > 0) buffs.push({ label: '> ТРОЙНОЙ ВЫСТРЕЛ', t: tripleShotTimer, color: '#ff5ed0' });
                if (shieldTimer > 0) buffs.push({ label: '> ЩИТ', t: shieldTimer, color: '#3fd8ff' });
                if (freezeTimer > 0) buffs.push({ label: '> ЗАМОРОЗКА', t: freezeTimer, color: '#7fc8ff' });
                if (rapidTimer > 0) buffs.push({ label: '> ОЧЕРЕДЬ', t: rapidTimer, color: '#ff9d2e' });
                if (doubleShotTimer > 0) buffs.push({ label: '> ДВОЙНОЙ', t: doubleShotTimer, color: '#b6ff5e' });
                if (buffs.length) {
                    const fs = Math.max(9, Math.round(canvas.width * 0.018));
                    // Кнопка паузы теперь справа — индикаторы у левого края
                    const xStart = fs * 0.6;
                    ctx.save();
                    ctx.font = `bold ${fs}px 'Press Start 2P', monospace`;
                    ctx.textAlign = 'left';
                    ctx.shadowBlur = 8;
                    buffs.forEach((b, i) => {
                        ctx.fillStyle = b.color;
                        ctx.shadowColor = b.color;
                        ctx.fillText(`${b.label} ${(b.t / 1000).toFixed(1)}`, xStart, fs * 1.6 + i * fs * 1.4);
                    });
                    ctx.restore();
                    ctx.textAlign = 'left';
                }
            }

            // Оверлей паузы
            if (paused && !gameOver) {
                const pSize = Math.round(canvas.width * 0.07);
                ctx.fillStyle = 'rgba(5, 5, 15, 0.55)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#7cf6ff';
                ctx.font = `bold ${pSize}px 'Press Start 2P', monospace`;
                ctx.textAlign = 'center';
                ctx.shadowColor = '#1b9dff';
                ctx.shadowBlur = 18;
                ctx.fillText('ПАУЗА', canvas.width / 2, canvas.height / 2 - pSize * 0.3);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#cfd3f5';
                ctx.font = `${Math.round(pSize * 0.4)}px 'Press Start 2P', monospace`;
                ctx.fillText('СВЕРХУ ИЛИ ESC', canvas.width / 2, canvas.height / 2 + pSize * 0.6);
                ctx.textAlign = 'left';
            }

            // Если игра окончена, показываем сообщение
            if (gameOver) {
                const bigSize = Math.round(canvas.width * 0.05);
                const smallSize = Math.round(canvas.width * 0.028);
                ctx.fillStyle = 'rgba(5, 5, 15, 0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff7c9c';
                ctx.font = `bold ${bigSize}px 'Press Start 2P', monospace`;
                ctx.textAlign = 'center';
                ctx.shadowColor = '#ff2b5e';
                ctx.shadowBlur = 18;
                ctx.fillText('ИГРА ОКОНЧЕНА', canvas.width / 2, canvas.height / 2 - bigSize * 2.2);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#e8e8ff';
                ctx.font = `${smallSize}px 'Press Start 2P', monospace`;
                ctx.fillText(`Ваш счёт: ${score}`, canvas.width / 2, canvas.height / 2 - bigSize * 0.6);
                ctx.fillStyle = '#ffd166';
                ctx.font = `${Math.round(smallSize * 0.82)}px 'Press Start 2P', monospace`;
                ctx.fillText(`Рекорд: ${bestScore} · уровень ${bestLevel}`, canvas.width / 2, canvas.height / 2 - bigSize * 0.6 + smallSize * 1.4);
                ctx.textAlign = 'left';
            }

            // Большая надпись «НОВЫЙ РЕКОРД!» поверх всего во время салюта
            if (celebrateTimer > 0) {
                const tt = performance.now();
                const size = Math.round(canvas.width * 0.058 * (1 + Math.sin(tt / 150) * 0.06));
                ctx.save();
                ctx.font = `bold ${size}px 'Press Start 2P', monospace`;
                ctx.textAlign = 'center';
                ctx.globalAlpha = Math.min(1, celebrateTimer / 400);
                ctx.fillStyle = '#ffd166';
                ctx.shadowColor = '#ff7c9c';
                ctx.shadowBlur = 26;
                ctx.fillText('НОВЫЙ РЕКОРД!', canvas.width / 2, canvas.height * 0.3);
                ctx.restore();
                ctx.globalAlpha = 1;
                ctx.textAlign = 'left';
            }

            // Надпись «БОСС ПОВЕРЖЕН!» в паузе после победы над боссом
            if (bossVictoryTimer > 0) {
                const size = Math.round(canvas.width * 0.052);
                ctx.save();
                ctx.font = `bold ${size}px 'Press Start 2P', monospace`;
                ctx.textAlign = 'center';
                ctx.globalAlpha = Math.min(1, bossVictoryTimer / 350);
                ctx.fillStyle = '#9dff5a';
                ctx.shadowColor = '#3aff7a';
                ctx.shadowBlur = 22;
                ctx.fillText('БОСС ПОВЕРЖЕН!', canvas.width / 2, canvas.height / 2);
                ctx.restore();
                ctx.globalAlpha = 1;
                ctx.textAlign = 'left';
            }
        }

        // Конец игры
        function showGameOver() {
            gameRunning = false;
            paused = false;
            stopFire();
            startButton.textContent = 'Играть заново';
            setUIState('over');
        }

        // Обработчик нажатия клавиш
        const keys = {
            left: false,
            right: false,
            space: false
        };

        document.addEventListener('keydown', function(e) {
            switch (e.key) {
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    keys.left = true;
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    keys.right = true;
                    break;
                case ' ':
                    startFire();
                    e.preventDefault();
                    break;
                case 'Escape':
                case 'p':
                case 'P':
                case 'з':
                case 'З':
                    togglePause();
                    break;
            }
        });

        document.addEventListener('keyup', function(e) {
            switch (e.key) {
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    keys.left = false;
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    keys.right = false;
                    break;
                case ' ':
                    stopFire();
                    break;
            }
        });

        // ===== Управление мышкой =====
        // Корабль следует за курсором по горизонтали (с учётом масштаба канваса)
        canvas.addEventListener('mousemove', function(e) {
            if (!gameRunning || gameOver || paused || !player.width) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const mouseX = (e.clientX - rect.left) * scaleX;
            player.x = mouseX - player.width / 2;
            // Не выходим за границы поля
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
        });

        // Выстрел по зажатию левой кнопки (удержание — автоматическая стрельба)
        canvas.addEventListener('mousedown', function(e) {
            if (e.button === 0) startFire();
        });
        window.addEventListener('mouseup', function(e) {
            if (e.button === 0) stopFire();
        });

        // ===== Сенсорные контролы (телефон) =====
        // Трек-полоса слева: относительный свайп с ускорением — короткого
        // движения хватает, чтобы пройти всё поле.
        const MOVE_GAIN = 1.9;
        let padTouchId = null, padLastX = 0;
        movePad.addEventListener('touchstart', function(e) {
            initAudio();
            const t = e.changedTouches[0];
            padTouchId = t.identifier;
            padLastX = t.clientX;
            e.preventDefault();
        }, { passive: false });
        movePad.addEventListener('touchmove', function(e) {
            if (padTouchId === null || !player.width) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            for (const t of e.changedTouches) {
                if (t.identifier !== padTouchId) continue;
                const dx = (t.clientX - padLastX) * scaleX * MOVE_GAIN;
                padLastX = t.clientX;
                player.x += dx;
                if (player.x < 0) player.x = 0;
                if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
                e.preventDefault();
            }
        }, { passive: false });
        function endPad(e) {
            for (const t of e.changedTouches) {
                if (t.identifier === padTouchId) padTouchId = null;
            }
        }
        movePad.addEventListener('touchend', endPad);
        movePad.addEventListener('touchcancel', endPad);

        // Единое удержание огня для всех способов ввода (пробел / мышь / «Огонь»).
        // Мгновенный первый выстрел, дальше — автострельба в update(): обычный
        // темп, а при активной «очереди» — частый.
        function startFire() {
            if (fireHeld) return;          // игнорируем авто-повтор клавиши и лишние касания
            initAudio();
            fireHeld = true;
            fireCooldown = rapidTimer > 0 ? RAPID_INTERVAL : HOLD_INTERVAL;
            shootPlayerBullet();
        }
        function stopFire() {
            fireHeld = false;
        }
        fireButton.addEventListener('touchstart', function(e) { startFire(); e.preventDefault(); }, { passive: false });
        fireButton.addEventListener('touchend', function(e) { stopFire(); e.preventDefault(); }, { passive: false });
        fireButton.addEventListener('touchcancel', stopFire);
        fireButton.addEventListener('mousedown', startFire);
        fireButton.addEventListener('mouseup', stopFire);
        fireButton.addEventListener('mouseleave', stopFire);

        // Пауза / продолжение
        function togglePause() {
            if (!gameRunning || gameOver) return;
            paused = !paused;
            pauseButton.classList.toggle('paused', paused);
            if (paused) stopFire();
        }

        // Кнопка паузы (кружок слева сверху)
        pauseButton.addEventListener('click', togglePause);

        // Центральная кнопка — старт новой игры / рестарт
        startButton.addEventListener('click', function() {
            initAudio();
            startGame();
        });

        // Перестройка холста при изменении размера/повороте экрана
        window.addEventListener('resize', fitCanvas);
        window.addEventListener('orientationchange', function() { setTimeout(fitCanvas, 200); });

        // Запуск единого цикла анимации
        loadBest();
        setUIState('menu');
        fitCanvas();
        lastTime = performance.now();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
