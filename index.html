<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Космические жуки</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            margin: 0;
            background: radial-gradient(circle at 50% 0%, #16163a 0%, #05050f 70%);
            font-family: 'Comfortaa', 'Segoe UI', system-ui, sans-serif;
            color: #e8e8ff;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100dvh;
            box-sizing: border-box;
        }
        /* Счёт/жизни/уровень — наверху вместо заголовка, с отступом под «чёлку» */
        .hud {
            width: 100%;
            box-sizing: border-box;
            padding: calc(env(safe-area-inset-top) + 6px) 10px 6px;
            text-align: center;
            font-size: clamp(14px, 4vw, 22px);
            font-weight: bold;
            text-shadow: 0 0 8px rgba(124, 246, 255, 0.6);
        }
        .hud span { color: #7cffa1; }
        .hud .lives { color: #ff7c9c; display: inline-block; }
        .hud .level { color: #ffd166; }
        /* Вспышка счётчика жизней при подборе сердечка */
        .hud .lives.flash { animation: lifeFlash 0.7s ease; }
        @keyframes lifeFlash {
            0%   { transform: scale(1);   color: #ff7c9c; text-shadow: 0 0 8px rgba(255,124,156,0.6); }
            30%  { transform: scale(1.6); color: #ff4d6d; text-shadow: 0 0 16px rgba(255,77,109,0.95); }
            100% { transform: scale(1);   color: #ff7c9c; text-shadow: 0 0 8px rgba(255,124,156,0.6); }
        }
        .hud .sep { color: #5a6090; margin: 0 4px; }
        /* Игровое поле — занимает всё оставшееся место */
        .stage {
            position: relative;
            flex: 1;
            min-height: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            border: 2px solid #2bd1ff;
            border-radius: 8px;
            background-color: #05050f;
            box-shadow: 0 0 25px rgba(43, 209, 255, 0.45), inset 0 0 40px rgba(20, 20, 60, 0.6);
            touch-action: none;
            display: block;
        }
        /* На телефоне голубая рамка и свечение не нужны */
        @media (pointer: coarse) {
            canvas {
                border: none;
                border-radius: 0;
                box-shadow: none;
            }
        }

        /* Единый «прозрачный» стиль для оверлей-контролов */
        .ctrl {
            position: absolute;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(220, 232, 255, 0.10);
            border: 1.5px solid rgba(220, 232, 255, 0.30);
            color: rgba(230, 240, 255, 0.75);
            box-shadow: 0 0 12px rgba(120, 160, 220, 0.15);
            -webkit-backdrop-filter: blur(2px);
            backdrop-filter: blur(2px);
            cursor: pointer;
            padding: 0;
            touch-action: none;
        }
        .ctrl:active { background: rgba(220, 232, 255, 0.20); }

        /* Кнопка паузы — кружок слева сверху, виден только в игре */
        .pause-btn {
            display: none;
            top: 10px;          /* стартовое значение; точная привязка к холсту — в JS */
            right: 10px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            gap: 4px;
        }
        body.state-playing .pause-btn { display: flex; }
        .pause-btn::before, .pause-btn::after {
            content: '';
            width: 5px;
            height: 16px;
            border-radius: 1.5px;
            background: rgba(230, 240, 255, 0.8);
        }
        /* В паузе значок превращается в «play» (треугольник) */
        .pause-btn.paused::before {
            width: 0; height: 0;
            border-radius: 0;
            background: transparent;
            border-left: 14px solid rgba(230, 240, 255, 0.8);
            border-top: 9px solid transparent;
            border-bottom: 9px solid transparent;
        }
        .pause-btn.paused::after { display: none; }

        /* Мобильные контролы — низ экрана, только на сенсорных устройствах */
        .touch-controls { display: none; }
        @media (pointer: coarse) {
            body.state-playing .touch-controls { display: block; }
        }
        .move-pad {
            position: absolute;
            z-index: 5;
            left: 10px;
            bottom: calc(env(safe-area-inset-bottom) + 12px);
            width: 80%;
            max-width: calc(100% - 115px);   /* оставляем место под кнопку «Огонь» */
            height: 58px;
            border-radius: 29px;
            background: rgba(220, 232, 255, 0.08);
            border: 1.5px solid rgba(220, 232, 255, 0.28);
            -webkit-backdrop-filter: blur(2px);
            backdrop-filter: blur(2px);
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(230, 240, 255, 0.45);
            font-size: 20px;
            letter-spacing: 8px;
        }
        .fire-btn {
            right: 14px;
            bottom: calc(env(safe-area-inset-bottom) + 4px);
            width: 74px;
            height: 74px;
            border-radius: 50%;
            font-size: 13px;
            letter-spacing: 1px;
            font-weight: bold;
            flex-direction: column;
        }
        .fire-btn::before {
            content: '';
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(230, 240, 255, 0.75);
            box-shadow: 0 0 8px rgba(230, 240, 255, 0.5);
            margin-bottom: 3px;
        }

        /* Центральная кнопка старт/заново — в меню и после проигрыша */
        .center-btn {
            display: none;
            position: absolute;
            z-index: 6;
            top: 56%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 14px 30px;
            font-size: 17px;
            cursor: pointer;
            color: #05050f;
            font-weight: bold;
            letter-spacing: 1px;
            font-family: inherit;
            background: linear-gradient(180deg, #7cf6ff, #2bd1ff);
            border: none;
            border-radius: 8px;
            box-shadow: 0 0 16px rgba(43, 209, 255, 0.6);
            transition: transform 0.08s ease, box-shadow 0.2s ease;
        }
        body.state-menu .center-btn,
        body.state-over .center-btn { display: block; }
        .center-btn:hover { box-shadow: 0 0 26px rgba(43, 209, 255, 0.9); }
        .center-btn:active { transform: translate(-50%, -50%) translateY(1px); }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="hud">Счёт: <span id="score">0</span><span class="sep">·</span>Жизни: <span id="lives" class="lives">3</span><span class="sep">·</span>Уровень: <span id="level" class="level">1</span></div>
        <div class="stage">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            <button class="ctrl pause-btn" id="pauseButton" aria-label="Пауза"></button>
            <div class="touch-controls">
                <div class="move-pad" id="movePad">‹ ›</div>
                <button class="ctrl fire-btn" id="fireButton" aria-label="Выстрел">ОГОНЬ</button>
            </div>
            <button class="center-btn" id="startButton">Начать игру</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const levelElement = document.getElementById('level');
        const startButton = document.getElementById('startButton');
        const pauseButton = document.getElementById('pauseButton');
        const movePad = document.getElementById('movePad');
        const fireButton = document.getElementById('fireButton');
        const stageElement = document.querySelector('.stage');

        // Сенсорное устройство — показываем тач-контролы и приподнимаем корабль над ними
        const isTouch = window.matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);

        // Переключение состояния интерфейса: menu | playing | over
        function setUIState(state) {
            document.body.className = 'state-' + state;
        }

        // Привязка кнопки паузы к углу холста (а не к краю широкой сцены).
        // На телефоне — справа сверху, на десктопе — слева сверху, у самого поля.
        function positionPauseButton() {
            const top = canvas.offsetTop + 10;
            pauseButton.style.top = top + 'px';
            if (isTouch) {
                pauseButton.style.left = 'auto';
                const fromRight = stageElement.clientWidth - (canvas.offsetLeft + canvas.offsetWidth) + 10;
                pauseButton.style.right = fromRight + 'px';
            } else {
                pauseButton.style.right = 'auto';
                pauseButton.style.left = (canvas.offsetLeft + 10) + 'px';
            }
        }

        // Отступ корабля от низа: на сенсорных экранах оставляем место под
        // нижние контролы (трек движения и кнопку «Огонь»), чтобы он не прятался.
        function shipBottomInset() {
            const base = Math.round(canvas.height * 0.04);
            if (!isTouch) return base;
            const sclY = canvas.height / (parseFloat(canvas.style.height) || canvas.height);
            return base + Math.round(96 * sclY);   // ~96px CSS под контролы + safe-area
        }

        // Игровые параметры — пересчитываются под размер холста (см. computeLayout)
        let playerWidth = 50;
        let playerHeight = 30;
        let enemyWidth = 40;
        let enemyHeight = 30;
        let bulletWidth = 4;
        let bulletHeight = 15;
        let enemyRows = 5;
        let enemyCols = 10;
        let enemySpacing = 10;
        let enemyStep = 20;   // шаг строя вниз
        let unit = 1;         // масштаб скоростей относительно эталона (высота 600)

        let player = {};
        let enemies = [];
        let bullets = [];
        let enemyBullets = [];
        let score = 0;
        let lives = 3;
        let level = 1;
        let gameRunning = false;
        let gameOver = false;
        let paused = false;
        let enemyDirection = 1; // 1 - вправо, -1 - влево
        let enemySpeed = 1;
        let enemyMoveDownTimer = 0;
        let lastTime = 0;
        let enemyShootTimer = 0;
        let enemyShootInterval = 1000; // Миллисекунды

        // Декоративные слои
        let stars = [];
        let particles = [];

        // Призы (падают с убитых жуков) и активные бонусы
        let powerups = [];
        let tripleShotTimer = 0;              // мс оставшегося действия тройного выстрела
        let shieldTimer = 0;                  // мс действия щита
        let freezeTimer = 0;                  // мс заморозки жуков
        const POWERUP_DROP_CHANCE = 0.14;     // шанс выпадения приза с жука
        const TRIPLE_SHOT_DURATION = 3000;    // тройной выстрел, мс
        const SHIELD_DURATION = 5000;         // щит, мс
        const FREEZE_DURATION = 3000;         // заморозка жуков, мс
        const POWERUP_TYPES = ['triple', 'shield', 'freeze'];

        // Всплывающие надписи (например, «+1 ЖИЗНЬ» при подборе сердечка)
        let floatTexts = [];

        // Цвета жуков по рядам
        const bugColors = ['#ff5e7e', '#ff9f45', '#ffe14a', '#7cff6b', '#6bd5ff'];

        // Пиксельные спрайты жуков, 2 кадра анимации (мельче клетки + детали).
        // Символы: X тело, D тень, L блик, e глаз, '.' прозрачно. Цвет тела — по ряду.
        const bugFrames = [
            [
                '....X...X....',
                '.....X.X.....',
                '....XXXXX....',
                '....eXXXe....',
                '...XXXXXXX...',
                '...XXXXXXX...',
                '...XDDDDDX...',
                '...XLLLLLX...',
                '...XXXXXXX...',
                '..X..X.X..X..',
                '.X...X.X...X.'
            ],
            [
                '....X...X....',
                '.....X.X.....',
                '....XXXXX....',
                '....eXXXe....',
                '...XXXXXXX...',
                '...XXXXXXX...',
                '...XDDDDDX...',
                '...XLLLLLX...',
                '...XXXXXXX...',
                '..X.X...X.X..',
                '..X..X.X..X..'
            ]
        ];

        // Пиксельный спрайт корабля (квадратный, в тон жукам).
        // H корпус, C кабина, F дюза, '.' прозрачно.
        const shipFrame = [
            '......H......',
            '.....HHH.....',
            '....HHHHH....',
            '....HCCCH....',
            '...HHCCCHH...',
            '..HHHHHHHHH..',
            '.HHHHHHHHHHH.',
            'HHH.HHHHH.HHH',
            'HH...HHH...HH',
            '.....F.F.....'
        ];
        const shipPalette = { 'H': '#c2c8e0', 'C': '#1b9dff', 'F': '#ff9d00', '.': null };

        // Капсулы-призы: P корпус, X символ, '.' прозрачно. Свой цвет и иконка у каждого типа.
        const powerupDefs = {
            // тройной выстрел — три патрона
            triple: {
                color: '#ff5ed0',
                frame: [
                    '.PPPPPPP.',
                    'PP.....PP',
                    'P.X.X.X.P',
                    'P.X.X.X.P',
                    'P.X.X.X.P',
                    'PP.....PP',
                    '.PPPPPPP.'
                ],
                palette: { 'P': '#ff5ed0', 'X': '#fff59a', '.': null }
            },
            // щит — крест-герб
            shield: {
                color: '#3fd8ff',
                frame: [
                    '.PPPPPPP.',
                    'PPXXXXXPP',
                    'P.XXXXX.P',
                    'P.XXXXX.P',
                    'P..XXX..P',
                    'PP..X..PP',
                    '.PPPPPPP.'
                ],
                palette: { 'P': '#3fd8ff', 'X': '#eaffff', '.': null }
            },
            // заморозка — снежинка
            freeze: {
                color: '#7fc8ff',
                frame: [
                    '.PPPPPPP.',
                    'PPX.X.XPP',
                    'P..XXX..P',
                    'P.XXXXX.P',
                    'P..XXX..P',
                    'PPX.X.XPP',
                    '.PPPPPPP.'
                ],
                palette: { 'P': '#7fc8ff', 'X': '#ffffff', '.': null }
            },
            // доп. жизнь — сердечко (без капсулы); выпадает реже и только при <3 жизнях
            heart: {
                color: '#ff4d6d',
                frame: [
                    '.XX...XX.',
                    'XLXX.XXXX',
                    'XLXXXXXXX',
                    'XXXXXXXXX',
                    '.XXXXXXX.',
                    '..XXXXX..',
                    '...XXX...'
                ],
                palette: { 'X': '#ff4d6d', 'L': '#ffd0db', '.': null }
            }
        };

        // ===== Звук (Web Audio, синтез без файлов) =====
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) audioCtx = new AC();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }
        function sndShoot() {
            if (!audioCtx) return;
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'square';
            const t = audioCtx.currentTime;
            o.frequency.setValueAtTime(900, t);
            o.frequency.exponentialRampToValueAtTime(240, t + 0.14);
            g.gain.setValueAtTime(0.05, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(t); o.stop(t + 0.14);
        }
        function sndExplosion() {
            if (!audioCtx) return;
            const dur = 0.32;
            const buffer = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
            const src = audioCtx.createBufferSource();
            src.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 1200;
            const g = audioCtx.createGain();
            g.gain.value = 0.13;
            src.connect(filter); filter.connect(g); g.connect(audioCtx.destination);
            src.start();
        }
        function sndHit() {
            if (!audioCtx) return;
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'sawtooth';
            const t = audioCtx.currentTime;
            o.frequency.setValueAtTime(320, t);
            o.frequency.exponentialRampToValueAtTime(60, t + 0.3);
            g.gain.setValueAtTime(0.12, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(t); o.stop(t + 0.3);
        }
        function sndPowerup() {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            [523, 659, 784, 1047].forEach((f, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'square';
                const st = t + i * 0.06;
                o.frequency.setValueAtTime(f, st);
                g.gain.setValueAtTime(0.06, st);
                g.gain.exponentialRampToValueAtTime(0.0001, st + 0.13);
                o.connect(g); g.connect(audioCtx.destination);
                o.start(st); o.stop(st + 0.13);
            });
        }

        // ===== Адаптация под размер экрана (в т.ч. портрет iPhone) =====
        // Пересчёт игровых размеров от текущего холста
        function computeLayout() {
            const W = canvas.width, H = canvas.height;
            unit = H / 600;
            const portrait = H > W;
            enemyRows = 5;
            enemyCols = portrait ? 6 : 10;           // в портрете строй уже
            enemySpacing = Math.max(6, Math.round(W * 0.014));
            // Строй занимает ~72% ширины — остаётся место для движения вбок,
            // иначе он отскакивает от стенок каждый кадр и слишком быстро падает вниз
            const usableW = W * 0.72;
            enemyWidth = Math.floor((usableW - enemySpacing * (enemyCols - 1)) / enemyCols);
            enemyHeight = Math.round(enemyWidth * 0.78);
            playerWidth = Math.round(enemyWidth * 1.25);
            playerHeight = Math.round(playerWidth * 0.6);
            bulletWidth = Math.max(3, Math.round(W * 0.006));
            bulletHeight = Math.max(10, Math.round(H * 0.025));
            enemyStep = Math.round(enemyHeight * 0.35);
        }

        // Пропорциональный перенос объектов при изменении размера холста
        function rescaleEntities(oldW, oldH) {
            if (!oldW || !oldH) { initStars(); return; }
            const sx = canvas.width / oldW, sy = canvas.height / oldH;
            if (player && player.width) {
                player.x *= sx;
                player.width = playerWidth;
                player.height = playerHeight;
                player.y = canvas.height - playerHeight - shipBottomInset();
                player.speed = 5 * unit;
                player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            }
            for (const e of enemies) { e.x *= sx; e.y *= sy; e.width = enemyWidth; e.height = enemyHeight; }
            for (const b of bullets) { b.x *= sx; b.y *= sy; }
            for (const b of enemyBullets) { b.x *= sx; b.y *= sy; }
            for (const pu of powerups) { pu.x *= sx; pu.y *= sy; pu.width = Math.round(enemyWidth * 0.7); pu.height = pu.width; }
            initStars();
        }

        // Подгонка холста под доступное место сцены (с учётом плотности пикселей)
        function fitCanvas() {
            const oldW = canvas.width, oldH = canvas.height;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            // Сцена флексом занимает всё под HUD — меряем её, а не окно целиком
            const availW = Math.max(240, (stageElement.clientWidth || window.innerWidth) - 8);
            const availH = Math.max(320, (stageElement.clientHeight || window.innerHeight) - 8);
            const portrait = availH > availW;
            let cssW, cssH;
            if (portrait) {
                cssW = availW;
                cssH = availH;
            } else {
                cssW = Math.min(availW, 900);   // на десктопе не растягиваем на весь монитор
                cssH = Math.min(availH, 680);
            }
            canvas.style.width = cssW + 'px';
            canvas.style.height = cssH + 'px';
            canvas.width = Math.round(cssW * dpr);
            canvas.height = Math.round(cssH * dpr);
            computeLayout();
            rescaleEntities(oldW, oldH);
            positionPauseButton();
        }

        // ===== Звёздное небо =====
        function initStars() {
            stars = [];
            for (let i = 0; i < 110; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 1.6 + 0.3,
                    speed: Math.random() * 1.1 + 0.2
                });
            }
        }
        function updateStars(dt) {
            for (const s of stars) {
                s.y += s.speed * dt;
                if (s.y > canvas.height) {
                    s.y = 0;
                    s.x = Math.random() * canvas.width;
                }
            }
        }

        // ===== Частицы взрыва =====
        function spawnExplosion(x, y, color) {
            for (let i = 0; i < 18; i++) {
                const a = Math.random() * Math.PI * 2;
                const sp = Math.random() * 4 + 1;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(a) * sp,
                    vy: Math.sin(a) * sp,
                    life: 1,
                    color: color
                });
            }
        }
        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += 0.06 * dt;
                p.life -= 0.03 * dt;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        // ===== Всплывающие надписи =====
        function spawnFloatText(x, y, text, color) {
            floatTexts.push({ x: x, y: y, text: text, color: color, life: 1 });
        }
        function updateFloatTexts(dt) {
            for (let i = floatTexts.length - 1; i >= 0; i--) {
                const f = floatTexts[i];
                f.y -= 0.7 * unit * dt;     // плывёт вверх
                f.life -= 0.012 * dt;       // и затухает
                if (f.life <= 0) floatTexts.splice(i, 1);
            }
        }
        function drawFloatTexts() {
            const fs = Math.max(14, Math.round(canvas.width * 0.034));
            ctx.save();
            ctx.font = `bold ${fs}px 'Comfortaa', sans-serif`;
            ctx.textAlign = 'center';
            for (const f of floatTexts) {
                ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
                ctx.fillStyle = f.color;
                ctx.shadowColor = f.color;
                ctx.shadowBlur = 12;
                ctx.fillText(f.text, f.x, f.y);
            }
            ctx.restore();
            ctx.globalAlpha = 1;
            ctx.textAlign = 'left';
        }

        // Создание уровня (игрок + строй врагов). Счёт и жизни НЕ сбрасываются.
        function spawnLevel() {
            // Создаем игрока
            player = {
                x: canvas.width / 2 - playerWidth / 2,
                y: canvas.height - playerHeight - shipBottomInset(),
                width: playerWidth,
                height: playerHeight,
                speed: 5 * unit
            };

            // Создаем врагов (строй центрируется по ширине холста)
            const formationW = enemyCols * enemyWidth + (enemyCols - 1) * enemySpacing;
            const startX = (canvas.width - formationW) / 2;
            const startY = Math.round(canvas.height * 0.08);
            enemies = [];
            for (let row = 0; row < enemyRows; row++) {
                for (let col = 0; col < enemyCols; col++) {
                    enemies.push({
                        x: startX + col * (enemyWidth + enemySpacing),
                        y: startY + row * (enemyHeight + enemySpacing),
                        width: enemyWidth,
                        height: enemyHeight,
                        alive: true,
                        row: row
                    });
                }
            }

            // Очищаем пули, частицы и падающие призы (бонус по времени сохраняется)
            bullets = [];
            enemyBullets = [];
            particles = [];
            powerups = [];
            floatTexts = [];

            // Скорость задаётся так, чтобы строй пересекал свободное поле за фиксированное
            // время — тогда темп одинаков и в широком альбомном, и в узком портретном холсте.
            // С уровнем поле пересекается быстрее.
            const margin = 10 * unit;
            const travelRoom = Math.max(40, canvas.width - formationW - 2 * margin);
            const traverseSec = Math.max(0.7, 1.6 - (level - 1) * 0.18);
            enemySpeed = travelRoom / (traverseSec * 60);   // px за кадр (при 60 fps), далее * dt

            // Шаг спуска привязан к расстоянию до игрока: фиксированное число «ступеней»,
            // поэтому время до игрока одинаково на коротком и высоком холсте.
            const formationBottom = startY + enemyRows * (enemyHeight + enemySpacing) - enemySpacing;
            const desiredSteps = Math.max(10, 22 - (level - 1) * 2);
            enemyStep = Math.max(6, Math.round((player.y - formationBottom) / desiredSteps));

            enemyShootInterval = Math.max(350, 1000 - (level - 1) * 90);

            // Сбрасываем флаги уровня
            gameRunning = true;
            gameOver = false;
            enemyDirection = 1;
            enemyMoveDownTimer = 0;
            enemyShootTimer = 0;
        }

        // Новая игра с первого уровня
        function startGame() {
            score = 0;
            lives = 3;
            level = 1;
            tripleShotTimer = 0;
            shieldTimer = 0;
            freezeTimer = 0;
            paused = false;
            pauseButton.classList.remove('paused');
            updateScore();
            spawnLevel();
            setUIState('playing');
        }

        // Следующий уровень — ускорение, счёт и жизни сохраняются
        function nextLevel() {
            level++;
            spawnLevel();
            updateScore();
        }

        // Обновление счета
        function updateScore() {
            scoreElement.textContent = score;
            livesElement.textContent = lives;
            levelElement.textContent = level;
        }

        // Кратко подсветить счётчик жизней (при подборе сердечка)
        function flashLives() {
            livesElement.classList.remove('flash');
            void livesElement.offsetWidth;   // перезапуск анимации
            livesElement.classList.add('flash');
        }

        // Единый цикл: звёзды и частицы живут всегда, логика — только в игре
        function loop(currentTime) {
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;
            // Нормировка к 60 fps: на 120 Гц экранах (iPhone Pro) кадров вдвое больше,
            // поэтому движение считаем по времени, а не по числу кадров
            const dt = Math.min(deltaTime / 16.6667, 3);

            updateStars(dt);
            updateParticles(dt);
            updateFloatTexts(dt);

            if (gameRunning && !gameOver && !paused) {
                update(deltaTime, dt);
            }

            draw();
            requestAnimationFrame(loop);
        }

        // Обновление состояния игры
        function update(deltaTime, dt) {
            // Обработка движения игрока
            if (keys.left && player.x > 0) {
                player.x -= player.speed * dt;
            }
            if (keys.right && player.x < canvas.width - player.width) {
                player.x += player.speed * dt;
            }

            // Таймеры бонусов тают (пауза замораживает их — сюда мы не заходим)
            if (tripleShotTimer > 0) tripleShotTimer = Math.max(0, tripleShotTimer - deltaTime);
            if (shieldTimer > 0) shieldTimer = Math.max(0, shieldTimer - deltaTime);
            if (freezeTimer > 0) freezeTimer = Math.max(0, freezeTimer - deltaTime);

            // Обновление пуль игрока
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= 7 * unit * dt;
                bullets[i].x += (bullets[i].vx || 0) * dt;

                // Удаляем пули, вышедшие за границы (верх или бока — для угловых)
                if (bullets[i].y < 0 || bullets[i].x < -bulletWidth || bullets[i].x > canvas.width) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Проверка столкновения с врагами
                for (let j = 0; j < enemies.length; j++) {
                    if (enemies[j].alive &&
                        bullets[i].x < enemies[j].x + enemies[j].width &&
                        bullets[i].x + bulletWidth > enemies[j].x &&
                        bullets[i].y < enemies[j].y + enemies[j].height &&
                        bullets[i].y + bulletHeight > enemies[j].y) {

                        enemies[j].alive = false;
                        const cx = enemies[j].x + enemies[j].width / 2;
                        const cy = enemies[j].y + enemies[j].height / 2;
                        spawnExplosion(cx, cy, bugColors[enemies[j].row % bugColors.length]);
                        // Сердечко — втрое реже и только если жизней меньше 3; иначе обычный приз
                        if (lives < 3 && Math.random() < POWERUP_DROP_CHANCE / 3) {
                            spawnPowerup(cx, cy, 'heart');
                        } else if (Math.random() < POWERUP_DROP_CHANCE) {
                            spawnPowerup(cx, cy);
                        }
                        sndExplosion();
                        bullets.splice(i, 1);
                        score += 10;
                        updateScore();
                        break;
                    }
                }
            }

            // Падающие призы: летят вниз, при касании корабля включают тройной выстрел
            for (let i = powerups.length - 1; i >= 0; i--) {
                const pu = powerups[i];
                pu.y += pu.vy * dt;
                if (pu.y > canvas.height) { powerups.splice(i, 1); continue; }
                if (pu.x < player.x + player.width &&
                    pu.x + pu.width > player.x &&
                    pu.y < player.y + player.height &&
                    pu.y + pu.height > player.y) {
                    if (pu.type === 'shield') shieldTimer = SHIELD_DURATION;
                    else if (pu.type === 'freeze') freezeTimer = FREEZE_DURATION;
                    else if (pu.type === 'heart') {
                        lives++;
                        updateScore();
                        spawnFloatText(player.x + player.width / 2, player.y - player.height * 0.4, '+1 ЖИЗНЬ', '#ff6b86');
                        flashLives();
                    }
                    else tripleShotTimer = TRIPLE_SHOT_DURATION;
                    spawnExplosion(player.x + player.width / 2, player.y, powerupDefs[pu.type].color);
                    sndPowerup();
                    powerups.splice(i, 1);
                }
            }

            // Обновление врагов — при заморозке строй стоит на месте
            if (freezeTimer <= 0) {
                const margin = 10 * unit;
                let leftmost = canvas.width;
                let rightmost = 0;

                // Находим крайних врагов
                for (let i = 0; i < enemies.length; i++) {
                    if (enemies[i].alive) {
                        leftmost = Math.min(leftmost, enemies[i].x);
                        rightmost = Math.max(rightmost, enemies[i].x + enemies[i].width);
                    }
                }

                // Разворот вниз только если строй реально упирается в стену
                // ПО ХОДУ движения. Без проверки направления строй, оказавшийся
                // за линией стены (например, после заморозки), разворачивался бы
                // каждый кадр и моментально сыпался вниз.
                let moveDown = false;
                if ((enemyDirection > 0 && rightmost >= canvas.width - margin) ||
                    (enemyDirection < 0 && leftmost <= margin)) {
                    enemyDirection *= -1;
                    moveDown = true;
                }

                // Двигаем врагов
                const dx = enemyDirection * enemySpeed * dt;
                for (let i = 0; i < enemies.length; i++) {
                    if (enemies[i].alive) {
                        enemies[i].x += dx;
                        if (moveDown) enemies[i].y += enemyStep;
                    }
                }

                // Прижимаем строй внутрь поля, чтобы он не «застревал» за стеной
                leftmost += dx; rightmost += dx;
                let clamp = 0;
                if (rightmost > canvas.width - margin) clamp = (canvas.width - margin) - rightmost;
                else if (leftmost < margin) clamp = margin - leftmost;
                if (clamp !== 0) {
                    for (let i = 0; i < enemies.length; i++) {
                        if (enemies[i].alive) enemies[i].x += clamp;
                    }
                }
            }

            // Проверка на победу
            let allDead = true;
            for (let i = 0; i < enemies.length; i++) {
                if (enemies[i].alive) {
                    allDead = false;
                    break;
                }
            }

            if (allDead) {
                // Следующий уровень — ускорение и более частая стрельба
                nextLevel();
                return;
            }

            // Проверка на проигрыш (враги достигли дна)
            for (let i = 0; i < enemies.length; i++) {
                if (enemies[i].alive && enemies[i].y + enemies[i].height >= player.y) {
                    gameOver = true;
                    showGameOver();
                    return;
                }
            }

            // Враги стреляют (замороженные молчат)
            if (freezeTimer <= 0) {
                enemyShootTimer += deltaTime;
                if (enemyShootTimer >= enemyShootInterval) {
                    enemyShootTimer = 0;
                    shootEnemyBullet();
                }
            }

            // Обновление пуль врагов
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                enemyBullets[i].y += 5 * unit * dt;

                // Удаляем пули, вышедшие за границы
                if (enemyBullets[i].y > canvas.height) {
                    enemyBullets.splice(i, 1);
                    continue;
                }

                // Проверка столкновения с игроком
                if (enemyBullets[i].x < player.x + player.width &&
                    enemyBullets[i].x + bulletWidth > player.x &&
                    enemyBullets[i].y < player.y + player.height &&
                    enemyBullets[i].y + bulletHeight > player.y) {

                    enemyBullets.splice(i, 1);

                    // Щит поглощает попадание — жизнь не теряется
                    if (shieldTimer > 0) {
                        spawnExplosion(player.x + player.width / 2, player.y + player.height / 2, '#3fd8ff');
                        continue;
                    }

                    lives--;
                    sndHit();
                    spawnExplosion(player.x + player.width / 2, player.y + player.height / 2, '#7cf6ff');
                    updateScore();

                    if (lives <= 0) {
                        gameOver = true;
                        showGameOver();
                        return;
                    }
                }
            }
        }

        // Создание падающего приза в точке (cx, cy). Тип можно задать явно
        // (forced), иначе берётся случайный из POWERUP_TYPES (без сердечка).
        function spawnPowerup(cx, cy, forced) {
            const size = Math.round(enemyWidth * 0.7);
            const type = forced || POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
            powerups.push({
                x: cx - size / 2,
                y: cy - size / 2,
                width: size,
                height: size,
                vy: 1.7 * unit,
                type: type
            });
        }

        // Выстрел игрока. При активном бонусе — три пули: прямо + две под углом
        function shootPlayerBullet() {
            if (!gameRunning || gameOver || paused || !player.width) return;
            const cx = player.x + player.width / 2 - bulletWidth / 2;
            const top = player.y - bulletHeight;
            if (tripleShotTimer > 0) {
                bullets.push({ x: cx, y: top, width: bulletWidth, height: bulletHeight, vx: 0 });
                bullets.push({ x: cx, y: top, width: bulletWidth, height: bulletHeight, vx: -2.6 * unit });
                bullets.push({ x: cx, y: top, width: bulletWidth, height: bulletHeight, vx: 2.6 * unit });
            } else {
                bullets.push({ x: cx, y: top, width: bulletWidth, height: bulletHeight, vx: 0 });
            }
            sndShoot();
        }

        // Стрельба врагов
        function shootEnemyBullet() {
            // Выбираем случайного живого врага
            const aliveEnemies = enemies.filter(enemy => enemy.alive);
            if (aliveEnemies.length > 0) {
                const randomEnemy = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
                enemyBullets.push({
                    x: randomEnemy.x + randomEnemy.width / 2 - bulletWidth / 2,
                    y: randomEnemy.y + randomEnemy.height,
                    width: bulletWidth,
                    height: bulletHeight
                });
            }
        }

        // ===== Рисование объектов =====

        // Затемнение / осветление hex-цвета (f<1 темнее, f>1 светлее)
        function shade(hex, f) {
            const n = parseInt(hex.slice(1), 16);
            const r = Math.max(0, Math.min(255, Math.round(((n >> 16) & 255) * f)));
            const g = Math.max(0, Math.min(255, Math.round(((n >> 8) & 255) * f)));
            const b = Math.max(0, Math.min(255, Math.round((n & 255) * f)));
            return `rgb(${r},${g},${b})`;
        }

        // Универсальный рендер пиксельного спрайта по сетке символов и палитре
        function drawSprite(grid, palette, x, y, w, h, glow) {
            const cols = grid[0].length;
            const rows = grid.length;
            const cell = Math.min(w / cols, h / rows);
            const ox = x + (w - cell * cols) / 2;
            const oy = y + (h - cell * rows) / 2;
            ctx.save();
            if (glow) {
                ctx.shadowColor = glow.color;
                ctx.shadowBlur = glow.blur;
            }
            for (let r = 0; r < rows; r++) {
                const line = grid[r];
                for (let c = 0; c < cols; c++) {
                    const color = palette[line[c]];
                    if (color) {
                        ctx.fillStyle = color;
                        // +0.5 убирает зазоры между клетками при дробном масштабе
                        ctx.fillRect(ox + c * cell, oy + r * cell, cell + 0.5, cell + 0.5);
                    }
                }
            }
            ctx.restore();
            return { cell, ox, oy, cols, rows };
        }

        // Космический корабль игрока — квадратный пиксельный спрайт
        function drawShip(p) {
            const s = drawSprite(shipFrame, shipPalette, p.x, p.y, p.width, p.height, null);

            // Пламя из дюз — мигающие пиксельные блоки под двигателями
            ctx.save();
            ctx.shadowColor = '#ff9d00';
            ctx.shadowBlur = 6;
            const flick = Math.floor(performance.now() / 90) % 2;
            for (const col of [5, 7]) {
                const len = 1 + flick + (Math.random() < 0.5 ? 1 : 0);
                for (let k = 0; k < len; k++) {
                    ctx.fillStyle = k === 0 ? '#ffd27c' : '#ff6a00';
                    ctx.fillRect(s.ox + col * s.cell, s.oy + (s.rows + k) * s.cell, s.cell + 0.5, s.cell + 0.5);
                }
            }
            ctx.restore();
        }

        // Жук-враг — детальный пиксельный спрайт, цвет по ряду, без яркого свечения
        function drawBug(e) {
            const frame = bugFrames[Math.floor(performance.now() / 450) % bugFrames.length];
            const base = bugColors[e.row % bugColors.length];
            const palette = {
                'X': base,
                'D': shade(base, 0.55),   // тень
                'L': shade(base, 1.35),   // блик
                'e': '#ffffff',           // глаз
                '.': null
            };
            drawSprite(frame, palette, e.x, e.y, e.width, e.height, null);
        }

        // Капсула-приз с пульсирующим свечением своего цвета
        function drawPowerup(pu) {
            const def = powerupDefs[pu.type];
            const blur = 10 + Math.sin(performance.now() / 150) * 5;
            drawSprite(def.frame, def.palette, pu.x, pu.y, pu.width, pu.height, { color: def.color, blur });
        }

        function drawBackground() {
            const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bg.addColorStop(0, '#0a0a2a');
            bg.addColorStop(1, '#160a26');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Звёзды
            for (const s of stars) {
                ctx.globalAlpha = 0.4 + s.r / 2;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function drawParticles() {
            for (const p of particles) {
                ctx.globalAlpha = Math.max(p.life, 0);
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3 * p.life + 1, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        // Отрисовка игры
        function draw() {
            drawBackground();

            // Экран меню (до старта)
            if (!gameRunning && !gameOver) {
                drawParticles();
                const titleSize = Math.round(canvas.width * 0.06);
                ctx.fillStyle = '#7cf6ff';
                ctx.font = `bold ${titleSize}px 'Comfortaa', sans-serif`;
                ctx.textAlign = 'center';
                ctx.shadowColor = '#1b9dff';
                ctx.shadowBlur = 20;
                ctx.fillText('КОСМИЧЕСКИЕ ЖУКИ', canvas.width / 2, canvas.height / 2 - titleSize * 1.8);
                ctx.shadowBlur = 0;
                ctx.textAlign = 'left';
                return;
            }

            // Игрок
            if (player.width) drawShip(player);

            // Щит — пиксельный полукруг-«козырёк» над кораблём (в тон капсуле)
            if (shieldTimer > 0 && player.width) {
                const cell = Math.max(2, Math.min(player.width / 13, player.height / 10));
                const cx = player.x + player.width / 2;
                const cyc = player.y + player.height * 0.55;
                const R = player.width * 0.66;
                const pulse = 0.6 + Math.sin(performance.now() / 140) * 0.25;
                const steps = Math.max(10, Math.round(Math.PI * R / cell));
                ctx.save();
                ctx.shadowColor = '#3fd8ff';
                ctx.shadowBlur = 8;
                const seen = new Set();
                for (let s = 0; s <= steps; s++) {
                    const a = Math.PI + Math.PI * (s / steps);   // верхняя дуга π..2π
                    const bx = Math.round((cx + Math.cos(a) * R) / cell) * cell;
                    const by = Math.round((cyc + Math.sin(a) * R) / cell) * cell;
                    const key = bx + ',' + by;
                    if (seen.has(key)) continue;
                    seen.add(key);
                    const edge = Math.abs(s / steps - 0.5) * 2;  // 0 на гребне, 1 по краям
                    ctx.globalAlpha = pulse * (1 - edge * 0.35);
                    ctx.fillStyle = edge < 0.5 ? '#aef1ff' : '#3fd8ff';
                    ctx.fillRect(bx, by, cell + 0.5, cell + 0.5);
                }
                ctx.restore();
            }

            // Враги
            for (let i = 0; i < enemies.length; i++) {
                if (enemies[i].alive) drawBug(enemies[i]);
            }

            // Морозный налёт при заморозке жуков
            if (freezeTimer > 0) {
                ctx.save();
                ctx.fillStyle = 'rgba(140, 205, 255, 0.12)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
            }

            // Падающие призы
            for (let i = 0; i < powerups.length; i++) drawPowerup(powerups[i]);

            // Пули игрока (светящиеся)
            ctx.save();
            ctx.shadowColor = '#7cff6b';
            ctx.shadowBlur = 12;
            ctx.fillStyle = '#d6ffcf';
            for (let i = 0; i < bullets.length; i++) {
                const b = bullets[i];
                ctx.fillRect(b.x, b.y, bulletWidth, bulletHeight);
            }
            ctx.restore();

            // Пули врагов (светящиеся)
            ctx.save();
            ctx.shadowColor = '#ff6a3d';
            ctx.shadowBlur = 12;
            ctx.fillStyle = '#ffd27c';
            for (let i = 0; i < enemyBullets.length; i++) {
                const b = enemyBullets[i];
                ctx.fillRect(b.x, b.y, bulletWidth, bulletHeight);
            }
            ctx.restore();

            // Частицы взрывов
            drawParticles();

            // Всплывающие надписи («+1 ЖИЗНЬ» и т.п.)
            drawFloatTexts();

            // Индикаторы активных бонусов (стопкой сверху, правее кнопки паузы)
            if (!gameOver) {
                const buffs = [];
                if (tripleShotTimer > 0) buffs.push({ label: '✦ ТРОЙНОЙ ВЫСТРЕЛ', t: tripleShotTimer, color: '#ff5ed0' });
                if (shieldTimer > 0) buffs.push({ label: '◆ ЩИТ', t: shieldTimer, color: '#3fd8ff' });
                if (freezeTimer > 0) buffs.push({ label: '❄ ЗАМОРОЗКА', t: freezeTimer, color: '#7fc8ff' });
                if (buffs.length) {
                    const fs = Math.max(11, Math.round(canvas.width * 0.026));
                    // На десктопе кнопка паузы слева — сдвигаем индикаторы правее неё.
                    // На телефоне пауза справа, индикаторы остаются у левого края.
                    const scl = canvas.width / (parseFloat(canvas.style.width) || canvas.width);
                    const xStart = isTouch ? fs * 0.6 : 72 * scl;
                    ctx.save();
                    ctx.font = `bold ${fs}px 'Comfortaa', sans-serif`;
                    ctx.textAlign = 'left';
                    ctx.shadowBlur = 8;
                    buffs.forEach((b, i) => {
                        ctx.fillStyle = b.color;
                        ctx.shadowColor = b.color;
                        ctx.fillText(`${b.label} ${(b.t / 1000).toFixed(1)}`, xStart, fs * 1.6 + i * fs * 1.4);
                    });
                    ctx.restore();
                    ctx.textAlign = 'left';
                }
            }

            // Оверлей паузы
            if (paused && !gameOver) {
                const pSize = Math.round(canvas.width * 0.07);
                ctx.fillStyle = 'rgba(5, 5, 15, 0.55)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#7cf6ff';
                ctx.font = `bold ${pSize}px 'Comfortaa', sans-serif`;
                ctx.textAlign = 'center';
                ctx.shadowColor = '#1b9dff';
                ctx.shadowBlur = 18;
                ctx.fillText('ПАУЗА', canvas.width / 2, canvas.height / 2 - pSize * 0.3);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#cfd3f5';
                ctx.font = `${Math.round(pSize * 0.4)}px 'Comfortaa', sans-serif`;
                ctx.fillText('▷ сверху или Esc', canvas.width / 2, canvas.height / 2 + pSize * 0.6);
                ctx.textAlign = 'left';
            }

            // Если игра окончена, показываем сообщение
            if (gameOver) {
                const bigSize = Math.round(canvas.width * 0.065);
                const smallSize = Math.round(canvas.width * 0.032);
                ctx.fillStyle = 'rgba(5, 5, 15, 0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff7c9c';
                ctx.font = `bold ${bigSize}px 'Comfortaa', sans-serif`;
                ctx.textAlign = 'center';
                ctx.shadowColor = '#ff2b5e';
                ctx.shadowBlur = 18;
                ctx.fillText('ИГРА ОКОНЧЕНА', canvas.width / 2, canvas.height / 2 - bigSize * 2.2);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#e8e8ff';
                ctx.font = `${smallSize}px 'Comfortaa', sans-serif`;
                ctx.fillText(`Ваш счёт: ${score}`, canvas.width / 2, canvas.height / 2 - bigSize * 0.6);
                ctx.textAlign = 'left';
            }
        }

        // Конец игры
        function showGameOver() {
            gameRunning = false;
            paused = false;
            stopFire();
            startButton.textContent = 'Играть заново';
            setUIState('over');
        }

        // Обработчик нажатия клавиш
        const keys = {
            left: false,
            right: false,
            space: false
        };

        document.addEventListener('keydown', function(e) {
            switch (e.key) {
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    keys.left = true;
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    keys.right = true;
                    break;
                case ' ':
                    shootPlayerBullet();
                    e.preventDefault();
                    break;
                case 'Escape':
                case 'p':
                case 'P':
                case 'з':
                case 'З':
                    togglePause();
                    break;
            }
        });

        document.addEventListener('keyup', function(e) {
            switch (e.key) {
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    keys.left = false;
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    keys.right = false;
                    break;
            }
        });

        // ===== Управление мышкой =====
        // Корабль следует за курсором по горизонтали (с учётом масштаба канваса)
        canvas.addEventListener('mousemove', function(e) {
            if (!gameRunning || gameOver || paused || !player.width) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const mouseX = (e.clientX - rect.left) * scaleX;
            player.x = mouseX - player.width / 2;
            // Не выходим за границы поля
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
        });

        // Выстрел по клику (левая кнопка)
        canvas.addEventListener('mousedown', function(e) {
            if (e.button === 0) {
                initAudio();
                shootPlayerBullet();
            }
        });

        // ===== Сенсорные контролы (телефон) =====
        // Трек-полоса слева: относительный свайп с ускорением — короткого
        // движения хватает, чтобы пройти всё поле.
        const MOVE_GAIN = 1.9;
        let padTouchId = null, padLastX = 0;
        movePad.addEventListener('touchstart', function(e) {
            initAudio();
            const t = e.changedTouches[0];
            padTouchId = t.identifier;
            padLastX = t.clientX;
            e.preventDefault();
        }, { passive: false });
        movePad.addEventListener('touchmove', function(e) {
            if (padTouchId === null || !player.width) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            for (const t of e.changedTouches) {
                if (t.identifier !== padTouchId) continue;
                const dx = (t.clientX - padLastX) * scaleX * MOVE_GAIN;
                padLastX = t.clientX;
                player.x += dx;
                if (player.x < 0) player.x = 0;
                if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
                e.preventDefault();
            }
        }, { passive: false });
        function endPad(e) {
            for (const t of e.changedTouches) {
                if (t.identifier === padTouchId) padTouchId = null;
            }
        }
        movePad.addEventListener('touchend', endPad);
        movePad.addEventListener('touchcancel', endPad);

        // Кнопка выстрела справа: тап стреляет, удержание — автоогонь
        let fireTimer = null;
        function startFire() {
            if (fireTimer !== null) return;
            initAudio();
            shootPlayerBullet();
            fireTimer = setInterval(shootPlayerBullet, 280);
        }
        function stopFire() {
            if (fireTimer !== null) { clearInterval(fireTimer); fireTimer = null; }
        }
        fireButton.addEventListener('touchstart', function(e) { startFire(); e.preventDefault(); }, { passive: false });
        fireButton.addEventListener('touchend', function(e) { stopFire(); e.preventDefault(); }, { passive: false });
        fireButton.addEventListener('touchcancel', stopFire);
        fireButton.addEventListener('mousedown', startFire);
        fireButton.addEventListener('mouseup', stopFire);
        fireButton.addEventListener('mouseleave', stopFire);

        // Пауза / продолжение
        function togglePause() {
            if (!gameRunning || gameOver) return;
            paused = !paused;
            pauseButton.classList.toggle('paused', paused);
            if (paused) stopFire();
        }

        // Кнопка паузы (кружок слева сверху)
        pauseButton.addEventListener('click', togglePause);

        // Центральная кнопка — старт новой игры / рестарт
        startButton.addEventListener('click', function() {
            initAudio();
            startGame();
        });

        // Перестройка холста при изменении размера/повороте экрана
        window.addEventListener('resize', fitCanvas);
        window.addEventListener('orientationchange', function() { setTimeout(fitCanvas, 200); });

        // Запуск единого цикла анимации
        setUIState('menu');
        fitCanvas();
        lastTime = performance.now();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
