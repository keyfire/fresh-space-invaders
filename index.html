            --sab-env: env(safe-area-inset-bottom, 0px);
            --sab: var(--sab-env);   /* нижний inset; JS поднимает его под блок Telegram */
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        /* Фон на корневом элементе заполняет весь экран, включая зоны под
           «чёлкой» и индикатором; иначе в standalone снизу белая полоса. */
        html {
            background: #170A24;
        }
        body {
            margin: 0;
            background: radial-gradient(circle at 50% 0%, #16163a 0%, #05050f 70%);
            font-family: 'Press Start 2P', 'Segoe UI', system-ui, monospace;
            color: #e8e8ff;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100dvh;
            box-sizing: border-box;
        }
        /* Счёт/жизни/уровень — наверху вместо заголовка */
        .hud {
            text-align: center;
            font-size: clamp(8px, 2.3vw, 13px);
            padding: 0 8px 8px;
            line-height: 1.5;
            text-shadow: 0 0 2px rgba(124, 246, 255, 0.6);
            white-space: nowrap;
        }
        .hud span { color: #7cffa1; }
        .hud .lives { color: #ff7c9c; display: inline-block; }
        .hud .level { color: #ffd166; }
        /* Вспышка счётчика жизней при подборе сердечка */
        .hud .lives.flash { animation: lifeFlash 0.7s ease; }
        @keyframes lifeFlash {
            0%   { transform: scale(1);   color: #ff7c9c; text-shadow: 0 0 2px rgba(255,124,156,0.6); }
            30%  { transform: scale(1.6); color: #ff4d6d; text-shadow: 0 0 4px rgba(255,77,109,0.95); }
            100% { transform: scale(1);   color: #ff7c9c; text-shadow: 0 0 2px rgba(255,124,156,0.6); }
        }
        .hud .sep { color: #5a6090; margin: 0 4px; }
        /* Игровое поле — занимает всё оставшееся место */
        .stage {
            position: relative;
            flex: 1;
            min-height: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #05050f;
        }
        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .canvas-wrap {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            border: 2px solid #2bd1ff;
            border-radius: 8px;
            background-color: #05050f;
            box-shadow: 0 0 25px rgba(43, 209, 255, 0.45), inset 0 0 40px rgba(20, 20, 60, 0.6);
            touch-action: none;
            display: block;
        }
        /* На телефоне голубая рамка и свечение не нужны */
        @media (pointer: coarse) {
            canvas {
                border: none;
                border-radius: 0;
                box-shadow: none;
            }
        }

        /* Единый «прозрачный» пиксельный стиль для оверлей-контролов:
           прямые углы со ступенчатым срезом, чёткая рамка, без размытий */
        .ctrl {
            position: absolute;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(220, 232, 255, 0.10);
            border: 2px solid rgba(220, 232, 255, 0.35);
            /* угловые пиксели рамки — clip-path срезает border на ступеньках */
            background-image:
                linear-gradient(rgba(220,232,255,0.35), rgba(220,232,255,0.35)),
                linear-gradient(rgba(220,232,255,0.35), rgba(220,232,255,0.35)),
                linear-gradient(rgba(220,232,255,0.35), rgba(220,232,255,0.35)),
                linear-gradient(rgba(220,232,255,0.35), rgba(220,232,255,0.35));
            background-size: 4px 4px;
            background-repeat: no-repeat;
            background-position: 2px 2px, calc(100% - 2px) 2px, 2px calc(100% - 2px), calc(100% - 2px) calc(100% - 2px);
            color: rgba(230, 240, 255, 0.75);
            cursor: pointer;
            padding: 0;
            touch-action: none;
            border-radius: 0;
            clip-path: polygon(
                0 8px, 4px 8px, 4px 4px, 8px 4px, 8px 0,
                calc(100% - 8px) 0, calc(100% - 8px) 4px, calc(100% - 4px) 4px, calc(100% - 4px) 8px, 100% 8px,
                100% calc(100% - 8px), calc(100% - 4px) calc(100% - 8px), calc(100% - 4px) calc(100% - 4px), calc(100% - 8px) calc(100% - 4px), calc(100% - 8px) 100%,
                8px 100%, 8px calc(100% - 4px), 4px calc(100% - 4px), 4px calc(100% - 8px), 0 calc(100% - 8px)
            );
        }
        .ctrl:active { background-color: rgba(220, 232, 255, 0.20); }

        /* Кнопка паузы — пиксельный квадрат справа сверху, видна только в игре */
        .pause-btn {
            display: none;
            top: 10px;          /* стартовое значение; точная привязка к холсту — в JS */
            right: 10px;
            width: 44px;
            height: 44px;
            gap: 5px;
        }
        body.state-playing .pause-btn { display: flex; }
        .pause-btn::before, .pause-btn::after {
            content: '';
            width: 6px;
            height: 18px;
            background: rgba(230, 240, 255, 0.8);
        }
        /* В паузе значок превращается в ступенчатый пиксельный «play» */
        .pause-btn.paused::before {
            width: 15px;
            height: 21px;
            background: rgba(230, 240, 255, 0.8);
            clip-path: polygon(
                0 0, 33.4% 0, 33.4% 14.3%, 66.7% 14.3%, 66.7% 28.6%, 100% 28.6%,
                100% 71.4%, 66.7% 71.4%, 66.7% 85.7%, 33.4% 85.7%, 33.4% 100%, 0 100%
            );
        }
        .pause-btn.paused::after { display: none; }

        /* Мобильные контролы — низ экрана, только на сенсорных устройствах */
        .touch-controls { display: none; }
        @media (pointer: coarse) {
            body.state-playing .touch-controls { display: block; }
            .hud {
                position: absolute;
                top: 0; left: 0; right: 0;
                z-index: 2;
                pointer-events: none;
                background: linear-gradient(180deg, rgba(5,5,15,0.55) 0%, rgba(5,5,15,0) 100%);
                padding-top: env(safe-area-inset-top, 0px);
            }
            .game-area { position: relative; }
            .stage { align-items: flex-start; }
            .pause-btn {
                top: calc(10px + env(safe-area-inset-top, 0px));
            }
        }
        .move-pad {
            left: 10px;
            bottom: calc(8px + var(--sab, 0px));
            width: 80%;
            max-width: calc(100% - 115px);   /* оставляем место под кнопку «Огонь» */
            height: 58px;
            color: rgba(230, 240, 255, 0.45);
            font-size: 14px;
            letter-spacing: 8px;
        }
        .fire-btn {
            right: 14px;
            bottom: calc(4px + var(--sab, 0px));
            width: 74px;
            height: 70px;
            font-size: 10px;
            letter-spacing: 0;
            flex-direction: column;
        }
        .fire-btn::before {
            content: '';
            width: 12px;
            height: 12px;
            background: rgba(230, 240, 255, 0.75);
            margin-bottom: 6px;
        }

        /* Центральная кнопка старт/заново — в меню и после проигрыша */
        .center-btn {
            display: none;
            position: absolute;
            z-index: 6;
            top: 56%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 14px 22px;
            font-size: clamp(10px, 2.6vw, 13px);
            white-space: nowrap;
            cursor: pointer;
            color: #05050f;
            letter-spacing: 0;
            font-family: inherit;
            background: linear-gradient(180deg, #7cf6ff, #2bd1ff);
            border: none;
            border-radius: 8px;
            box-shadow: 0 0 16px rgba(43, 209, 255, 0.6);
            transition: transform 0.08s ease, box-shadow 0.2s ease;
        }
        body.state-menu .center-btn { display: block; }
        .center-btn:hover { box-shadow: 0 0 26px rgba(43, 209, 255, 0.9); }
        .center-btn:active { transform: translate(-50%, -50%) translateY(1px); }

        /* Экран проигрыша — колонка кнопок (продолжить/×2/заново) */
        .over-actions {
            display: none;
            position: absolute;
            z-index: 6;
            top: 54%;
            left: 50%;
            transform: translate(-50%, -50%);
            flex-direction: column;
            align-items: center;
            gap: 9px;
            width: max-content;
        }
        body.state-over .over-actions { display: flex; }
        .over-actions button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            color: #05050f;
            padding: 11px 16px;
            font-size: clamp(9px, 2.4vw, 12px);
            line-height: 1.5;
            white-space: nowrap;
            transition: transform 0.08s ease, box-shadow 0.2s ease;
        }
        .over-actions button:active { transform: translateY(1px); }
        /* Кнопки за рекламу — зелёные, со «значком» рекламы */
        .ad-btn {
            background: linear-gradient(180deg, #9dff5a, #4fce2a);
            box-shadow: 0 0 14px rgba(120, 255, 90, 0.5);
        }
        .ad-btn .adtag {
            display: block;
            font-size: 0.72em;
            color: #16300a;
            opacity: 0.85;
        }
        .restart-btn {
            background: linear-gradient(180deg, #7cf6ff, #2bd1ff);
            box-shadow: 0 0 14px rgba(43, 209, 255, 0.5);
        }
        /* Поделиться результатом (Telegram / системный share) */
        .share-btn {
            background: linear-gradient(180deg, #6cc9ff, #2aabee);
            box-shadow: 0 0 14px rgba(42, 171, 238, 0.5);
        }

        /* Оверлей-заглушка rewarded-рекламы (заменяется реальным SDK) */
        .ad-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: rgba(3, 3, 10, 0.92);
            color: #e8e8ff;
            font-family: inherit;
            text-align: center;
            padding: 20px;
        }
        .ad-overlay .adlabel { font-size: clamp(10px, 3vw, 15px); color: #9dff5a; }
        .ad-overlay .adcount { font-size: clamp(22px, 8vw, 44px); color: #ffd166; }
        .ad-overlay .adhint { font-size: clamp(8px, 2.4vw, 11px); color: #6a7090; }

        /* Кнопка рейтинга — золотая (в меню и на экране проигрыша) */
        .lb-btn-menu {
            top: 67%;
            padding: 11px 18px;
            font-size: clamp(9px, 2.2vw, 12px);
            background: linear-gradient(180deg, #ffd98a, #f0a93a);
            box-shadow: 0 0 14px rgba(240, 169, 58, 0.5);
        }
        .lb-btn {
            background: linear-gradient(180deg, #ffd98a, #f0a93a);
            box-shadow: 0 0 14px rgba(240, 169, 58, 0.5);
        }

        /* Оверлей глобального рейтинга */
        .lb-overlay {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(3, 3, 10, 0.9);
            padding: 16px;
            font-family: inherit;
        }
        .lb-overlay.open { display: flex; }
        .lb-panel {
            width: min(440px, 94vw);
            max-height: 86vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #0b0b1e, #05050f);
            border: 2px solid #2bd1ff;
            border-radius: 10px;
            box-shadow: 0 0 24px rgba(43, 209, 255, 0.35);
            overflow: hidden;
        }
        .lb-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border-bottom: 1px solid rgba(43, 209, 255, 0.3);
        }
        .lb-title { color: #ffd166; font-size: clamp(11px, 3vw, 15px); text-shadow: 0 0 6px rgba(255, 157, 46, 0.6); }
        .lb-close { background: none; border: none; color: #ff7c9c; font-family: inherit; font-size: 15px; cursor: pointer; padding: 4px 6px; }
        .lb-list { overflow-y: auto; padding: 6px 0; -webkit-overflow-scrolling: touch; }
        .lb-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            font-size: clamp(8px, 2.3vw, 11px);
            color: #e8e8ff;
            line-height: 1.4;
        }
        .lb-row .lb-rank { width: 2.6em; color: #6bd5ff; text-align: right; flex: none; }
        .lb-row .lb-name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lb-row .lb-score { flex: none; color: #ffd166; }
        .lb-row.me { background: rgba(43, 209, 255, 0.14); }
        .lb-row.top1 .lb-rank { color: #ffd700; }
        .lb-row.top2 .lb-rank { color: #cfd6e6; }
        .lb-row.top3 .lb-rank { color: #e0a24a; }
        .lb-msg { padding: 20px 14px; text-align: center; color: #8a90b0; font-size: clamp(9px, 2.5vw, 12px); line-height: 1.6; }
        .lb-foot {
            padding: 10px 14px;
            border-top: 1px solid rgba(43, 209, 255, 0.3);
            text-align: center;
            color: #9dff5a;
            font-size: clamp(8px, 2.4vw, 11px);
            min-height: 1em;
        }

        /* Ежедневный бонус — кнопка меню (пульсирует, когда доступен) */
        .daily-btn-menu {
            top: 78%;
            padding: 11px 18px;
            font-size: clamp(9px, 2.2vw, 12px);
            background: linear-gradient(180deg, #ff9ecb, #ff5ea8);
            box-shadow: 0 0 14px rgba(255, 94, 168, 0.5);
        }
        .daily-btn-menu.avail { animation: dailyPulse 1.2s ease-in-out infinite; }
        @keyframes dailyPulse {
            0%, 100% { box-shadow: 0 0 12px rgba(255, 94, 168, 0.5); transform: translate(-50%, -50%) scale(1); }
            50% { box-shadow: 0 0 26px rgba(255, 94, 168, 0.95); transform: translate(-50%, -50%) scale(1.05); }
        }
        /* Оверлей бонуса */
        .daily-body { padding: 20px 16px; text-align: center; }
        .daily-body .daily-got { color: #9dff5a; font-size: clamp(10px, 3vw, 14px); margin-bottom: 12px; text-shadow: 0 0 6px rgba(120, 255, 90, 0.6); }
        .daily-body .daily-streak { color: #ffd166; font-size: clamp(11px, 3.4vw, 16px); margin-bottom: 14px; }
        .daily-body .daily-reward-label { color: #8fb7ff; font-size: clamp(8px, 2.4vw, 11px); margin-bottom: 6px; }
        .daily-body .daily-reward { color: #7cf6ff; font-size: clamp(9px, 2.8vw, 13px); line-height: 1.6; margin-bottom: 18px; }
        .daily-body .daily-claim {
            font-family: inherit;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            color: #05050f;
            padding: 12px 26px;
            font-size: clamp(10px, 3vw, 14px);
            background: linear-gradient(180deg, #9dff5a, #4fce2a);
            box-shadow: 0 0 16px rgba(120, 255, 90, 0.6);
            transition: transform 0.08s ease;
        }
        .daily-body .daily-claim:active { transform: translateY(1px); }
        .daily-body .daily-done { color: #8a90b0; font-size: clamp(9px, 2.6vw, 12px); }
    </style>
</head>
<body>
    <div class="game-container">

                <button class="ad-btn" id="doubleBtn">×2 ОЧКИ<span class="adtag">[ РЕКЛАМА ]</span></button>

    <!-- Оверлей глобального рейтинга -->

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const levelElement = document.getElementById('level');
        const startButton = document.getElementById('startButton');
        const pauseButton = document.getElementById('pauseButton');
        const movePad = document.getElementById('movePad');
        const fireButton = document.getElementById('fireButton');
        const stageElement = document.querySelector('.stage');
        const hudElement = document.querySelector('.hud');
        const reviveBtn = document.getElementById('reviveBtn');
        const doubleBtn = document.getElementById('doubleBtn');
        const restartButton = document.getElementById('restartButton');
        const shareBtn = document.getElementById('shareBtn');
        const lbBtnMenu = document.getElementById('lbBtnMenu');
        const lbBtnOver = document.getElementById('lbBtnOver');
        const lbOverlay = document.getElementById('lbOverlay');
        const lbList = document.getElementById('lbList');
        const lbFoot = document.getElementById('lbFoot');
        const lbClose = document.getElementById('lbClose');
        let myRank = null, myTotal = 0;   // моё место в мире (после submit/me)
        const dailyBtn = document.getElementById('dailyBtn');
        const dailyOverlay = document.getElementById('dailyOverlay');
        const dailyBody = document.getElementById('dailyBody');
        const dailyClose = document.getElementById('dailyClose');

        // Сенсорное устройство — показываем тач-контролы и приподнимаем корабль над ними
        const isTouch = window.matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);
        const FONT_FAMILY = "'Press Start 2P', monospace";

        // ===== Telegram Mini App =====
        // Вне Telegram tg.platform === 'unknown' — все фичи тихо выключены.
        const tg = window.Telegram && window.Telegram.WebApp;
        const isTelegram = !!(tg && tg.platform && tg.platform !== 'unknown');
        // Ссылка для «Поделиться» — открывает Mini App в Telegram
        const SHARE_URL = 'https://t.me/kosmozhuki_bot/play';
        // Adsgram: вписать blockId из кабинета (и раскомментировать SDK в <head>)
        const ADSGRAM_BLOCK_ID = '37189';
        // Глобальный лидерборд (Cloudflare Worker + D1). Вписать URL после деплоя
        // (см. leaderboard/README.md). Пусто = топ и медиа-шаринг тихо выключены.
        const LEADERBOARD_URL = 'https://kosmozhuki-leaderboard.keyfire.workers.dev';

        // ===== Локализация (i18n) — язык по локали пользователя =====
        // Поддержка RU/EN/ES/PT (языки каталога FindMini). Прочие локали → EN.
        const SUPPORTED_LANGS = ['ru', 'en', 'es', 'pt', 'tr'];
        function detectLang() {
            let code = '';
            try {
                if (isTelegram && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) {
                    code = tg.initDataUnsafe.user.language_code;   // напр. 'ru', 'en', 'pt-br'
                } else {
                    code = navigator.language || navigator.userLanguage || 'en';
                }
            } catch (e) { code = 'en'; }
            code = (code || 'en').toLowerCase().split('-')[0];
            return SUPPORTED_LANGS.indexOf(code) >= 0 ? code : 'en';
        }
        let LANG = detectLang();
        const I18N = {
            ru: {
                doc_title: 'Космические жуки', title: 'КОСМИЧЕСКИЕ ЖУКИ',
                recordLine: (s, l) => `Рекорд: ${s} · уровень ${l}`,
                pause: 'ПАУЗА', pauseHint: 'СВЕРХУ ИЛИ ESC', gameOver: 'ИГРА ОКОНЧЕНА',
                yourScore: (s) => `Ваш счёт: ${s}`,
                newRecord: 'НОВЫЙ РЕКОРД!', bossDefeated: 'БОСС ПОВЕРЖЕН!',

        // ===== Звук (Web Audio, синтез без файлов) =====
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) audioCtx = new AC();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }
        // Универсальная нота: осциллятор с указанной формой, частотой (и конечной частотой),
        // громкостью и длительностью. offset — смещение старта (для арпеджио).
        function sndNote(type, freqStart, freqEnd, gain, dur, offset) {
            if (!audioCtx) return;
            const t = audioCtx.currentTime + (offset || 0);
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = type;
            o.frequency.setValueAtTime(freqStart, t);
            if (freqEnd !== undefined) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
            g.gain.setValueAtTime(gain, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(t); o.stop(t + dur);
        }
        function sndSequence(type, notes, gain, dur, gap) {
            if (!audioCtx) return;
            notes.forEach((f, i) => sndNote(type, f, undefined, gain, dur, i * gap));
        }
        function sndShoot() { sndNote('square', 900, 240, 0.05, 0.14); }
        function sndExplosion() {
            if (!audioCtx) return;
            const dur = 0.32;
            const buffer = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
            const src = audioCtx.createBufferSource();
            src.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 1200;
            const g = audioCtx.createGain();
            g.gain.value = 0.13;
            src.connect(filter); filter.connect(g); g.connect(audioCtx.destination);
            src.start();
        }
        function sndHit() { sndNote('sawtooth', 320, 60, 0.12, 0.3); }
        function sndPowerup() { sndSequence('square', [523, 659, 784, 1047], 0.06, 0.13, 0.06); }

        function spawnFirework() {
            const x = canvas.width * (0.15 + Math.random() * 0.7);
            const y = canvas.height * (0.12 + Math.random() * 0.4);
            const colors = ['#ff5e7e', '#ffd166', '#7cffa1', '#6bd5ff', '#c13ae0', '#ff9d2e', '#ffffff'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const n = 30;
            for (let i = 0; i < n; i++) {
                const a = (Math.PI * 2) * i / n + Math.random() * 0.12;
                const sp = Math.random() * 3.5 + 2;
                particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color: color });

            sndExplosion();

        // ===== Адаптация под размер экрана (в т.ч. портрет iPhone) =====
        // Пересчёт игровых размеров от текущего холста
        function computeLayout() {
            const W = canvas.width, H = canvas.height;
            unit = H / 600;
            const portrait = H > W;
            enemyRows = 5;
            enemyCols = portrait ? 6 : 10;           // в портрете строй уже
            enemySpacing = Math.max(6, Math.round(W * 0.014));
            // Строй занимает ~72% ширины — остаётся место для движения вбок,
            // иначе он отскакивает от стенок каждый кадр и слишком быстро падает вниз
            const usableW = W * 0.72;
            enemyWidth = Math.floor((usableW - enemySpacing * (enemyCols - 1)) / enemyCols);
            enemyHeight = Math.round(enemyWidth * 0.78);
            playerWidth = Math.round(enemyWidth * 1.25);
            playerHeight = Math.round(playerWidth * 0.6);
            bulletWidth = Math.max(3, Math.round(W * 0.006));
            bulletHeight = Math.max(10, Math.round(H * 0.025));
            enemyStep = Math.round(enemyHeight * 0.35);
        }

        // Пропорциональный перенос объектов при изменении размера холста
        function rescaleEntities(oldW, oldH) {
            if (!oldW || !oldH) { initStars(); return; }
            const sx = canvas.width / oldW, sy = canvas.height / oldH;
            if (player && player.width) {
                player.x *= sx;
                player.width = playerWidth;
                player.height = playerHeight;
                player.y = canvas.height - playerHeight - shipBottomInset();
                player.speed = 5 * unit;
                clampPlayerX();
            }
            for (const e of enemies) { e.x *= sx; e.y *= sy; e.width = enemyWidth; e.height = enemyHeight; }
            for (const b of bullets) { b.x *= sx; b.y *= sy; }
            for (const b of enemyBullets) { b.x *= sx; b.y *= sy; }
            for (const pu of powerups) { pu.x *= sx; pu.y *= sy; pu.width = Math.round(enemyWidth * 0.7); pu.height = pu.width; }
            if (boss) {
                const bf = bossDefs[boss.form || 0].frame;
                boss.x *= sx; boss.y *= sy;
                boss.width = Math.round(canvas.width * 0.3);
                boss.height = Math.round(boss.width * (bf.length / bf[0].length));
                boss.vx = Math.sign(boss.vx) * (canvas.width * 0.25) / 60;
                if (boss.vy !== 0) boss.vy = Math.sign(boss.vy) * (canvas.height * 0.16) / 60;
                boss.yMin *= sy; boss.yMax *= sy;
            }
            initStars();
        }

        // Подгонка холста под доступное место сцены (с учётом плотности пикселей)
        function fitCanvas() {
            const oldW = canvas.width, oldH = canvas.height;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            // Сцена флексом занимает всё доступное место
            const availW = Math.max(240, stageElement.clientWidth || window.innerWidth);
            let availH = Math.max(320, stageElement.clientHeight || window.innerHeight);
            // На десктопе HUD в потоке выше холста — вычитаем его высоту.
            // На touch он position: absolute и не занимает места.
            if (!isTouch) {
                const hudH = hudElement ? Math.max(0, hudElement.offsetHeight) : 0;
                availH = Math.max(320, availH - hudH);
            } else {
                readSafeArea(dpr);
                // Низ HUD в координатах canvas (HUD absolute, canvas absolute — оба top:0)
                hudBottom = Math.round((hudElement?.getBoundingClientRect().bottom - canvas.getBoundingClientRect().top) * dpr);
            }
            const portrait = availH > availW;
            let cssW, cssH;
            if (portrait) {
                cssW = availW;
                cssH = availH;
            } else {
                cssW = Math.min(availW, 900);   // на десктопе не растягиваем на весь монитор
                cssH = Math.min(availH, 748);
            }
            canvas.style.width = cssW + 'px';
            canvas.style.height = cssH + 'px';
            canvas.width = Math.round(cssW * dpr);
            canvas.height = Math.round(cssH * dpr);
            computeLayout();
            rescaleEntities(oldW, oldH);
        }

        // ===== Звёздное небо =====
        function initStars() {
            stars = [];
            for (let i = 0; i < 110; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 1.6 + 0.3,
                    speed: Math.random() * 1.1 + 0.2
                });
            }
        }
        function updateStars(dt) {
            for (const s of stars) {
                s.y += s.speed * dt;
                if (s.y > canvas.height) {
                    s.y = 0;
                    s.x = Math.random() * canvas.width;
                }
            }
        }

        // ===== Частицы взрыва =====
        function spawnExplosion(x, y, color) {
            for (let i = 0; i < 18; i++) {
                const a = Math.random() * Math.PI * 2;
                const sp = Math.random() * 4 + 1;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(a) * sp,
                    vy: Math.sin(a) * sp,
                    life: 1,
                    color: color
                });
            }
        }
        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += 0.06 * dt;
                p.life -= 0.03 * dt;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        // ===== Всплывающие надписи =====
        function spawnFloatText(x, y, text, color) {
            floatTexts.push({ x: x, y: y, text: text, color: color, life: 1 });
        }
        function updateFloatTexts(dt) {
            for (let i = floatTexts.length - 1; i >= 0; i--) {
                const f = floatTexts[i];
                f.y -= 0.7 * unit * dt;     // плывёт вверх
                f.life -= 0.012 * dt;       // и затухает
                if (f.life <= 0) floatTexts.splice(i, 1);
            }
        }
        function drawFloatTexts() {
            const fs = Math.max(14, Math.round(canvas.width * 0.034));
            ctx.save();
            ctx.font = `bold ${fs}px ${FONT_FAMILY}`;
            ctx.textAlign = 'center';
            for (const f of floatTexts) {
                ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
                ctx.fillStyle = f.color;
                ctx.shadowColor = f.color;
                ctx.shadowBlur = TEXT_GLOW_FLOAT;
                ctx.fillText(f.text, f.x, f.y);
            }
            ctx.restore();
            ctx.globalAlpha = 1;
            ctx.textAlign = 'left';
        }

        // Создание уровня (игрок + строй врагов). Счёт и жизни НЕ сбрасываются.
        // Создание объекта игрока в стандартной позиции
        function createPlayer() {
            player = {
                x: canvas.width / 2 - playerWidth / 2,
                y: canvas.height - playerHeight - shipBottomInset(),
                width: playerWidth,
                height: playerHeight,
                speed: 5 * unit
            };
        }

        // Очистка массивов игровых сущностей (кроме врагов/босса — они пересоздаются)
        function clearEntities() {
            bullets = [];
            enemyBullets = [];
            particles = [];
            powerups = [];
            floatTexts = [];
        }

        function spawnLevel() {
            createPlayer();
            clearEntities();

            // Создаем врагов (строй центрируется по ширине холста)
            const formationW = enemyCols * enemyWidth + (enemyCols - 1) * enemySpacing;
            const startX = (canvas.width - formationW) / 2;
            const startY = Math.round(canvas.height * 0.06) + safeAreaTop;
            // Бронирование: с ростом уровня жукам нужно больше попаданий.
            // Верхние ряды чуть прочнее нижних — строй не однородная «стена».
            const baseHp = Math.min(6, 1 + Math.floor((level - 1) / 4));
            enemies = [];
            for (let row = 0; row < enemyRows; row++) {
                const rowHp = baseHp + (level >= 8 && row < 2 ? 1 : 0);
                for (let col = 0; col < enemyCols; col++) {
                    enemies.push({
                        x: startX + col * (enemyWidth + enemySpacing),
                        y: startY + row * (enemyHeight + enemySpacing),
                        width: enemyWidth,
                        height: enemyHeight,
                        alive: true,
                        row: row,
                        hp: rowHp,
                        maxHp: rowHp
                    });
                }
            }

            // Сложность считается ВНУТРИ цикла из 5 раундов: после каждого босса
            // (нового цикла) она «сбрасывается» к началу, но каждый цикл чуть выше —
            // поэтому спуск замедляется после босса, но в целом игра ускоряется.
            const cycle = Math.floor((level - 1) / 5);    // 0,1,2,... (сколько боссов пройдено)
            const inCycle = (level - 1) % 5;              // 0..4 — номер раунда в цикле
            const diff = inCycle + cycle;                 // сбрасывается каждый цикл, +1 за цикл

            // Скорость задаётся так, чтобы строй пересекал свободное поле за фиксированное
            // время — тогда темп одинаков и в широком альбомном, и в узком портретном холсте.
            const margin = 10 * unit;
            const travelRoom = Math.max(40, canvas.width - formationW - 2 * margin);
            // Прирост скорости по уровням: 0.12 за ступень diff (раньше 0.18 — замедлено
            // на треть, т.к. у пола 0.7с скорость растёт гиперболически и на больших
            // уровнях разгон был слишком резким). Уровень 1 (diff=0) не меняется.
            const traverseSec = Math.max(0.7, 1.6 - diff * 0.12);
            enemySpeed = travelRoom / (traverseSec * 60);   // px за кадр (при 60 fps), далее * dt

            // Шаг спуска привязан к расстоянию до игрока: фиксированное число «ступеней»,
            // поэтому время до игрока одинаково на коротком и высоком холсте.
            const formationBottom = startY + enemyRows * (enemyHeight + enemySpacing) - enemySpacing;
            const desiredSteps = Math.max(10, 22 - diff * 2);
            enemyStep = Math.max(6, Math.round((player.y - formationBottom) / desiredSteps));

            enemyShootInterval = Math.max(350, 1000 - diff * 90);

            // Сбрасываем флаги уровня
            isBoss = false;
            boss = null;
            gameRunning = true;
            gameOver = false;
            enemyDirection = 1;
            enemyMoveDownTimer = 0;
            enemyShootTimer = 0;
        }

        // Бой с боссом: один большой пришелец, HP = числу пришельцев в строю
        function spawnBoss() {
            createPlayer();
            enemies = [];
            clearEntities();

            const form = currentFormIndex();   // форма предыдущих 5 раундов
            const def = bossDefs[form];
            const bw = Math.round(canvas.width * 0.3);
            const bh = Math.round(bw * (def.frame.length / def.frame[0].length));
            const bossNum = Math.max(1, Math.round(level / 5));  // 1,2,3,... номер босса
            // Ровные числа HP, +5 за каждого следующего: 30, 35, 40, 45, 50, ...
            const hp = 25 + 5 * bossNum;
            const spX = (canvas.width * 0.25) / 60;
            const spY = (canvas.height * 0.16) / 60;
            const yTop = Math.round(canvas.height * 0.06) + safeAreaTop;
            // со 2-го босса — диагональ (вертикальная скорость), с 3-го — больший
            // вертикальный размах (залетает ниже)
            const yBand = bossNum >= 3 ? 0.6 : (bossNum >= 2 ? 0.42 : 0.2);
            const bossCell = bw / def.frame[0].length;   // размер «субпикселя» босса
            boss = {
                form: form,
                x: canvas.width / 2 - bw / 2,
                y: yTop + (bossNum === 1 ? Math.round(1 + 2 * unit + 2 * bossCell) : 0),
                width: bw,
                height: bh,
                vx: spX * (Math.random() < 0.5 ? 1 : -1),
                vy: bossNum >= 2 ? spY * (Math.random() < 0.5 ? 1 : -1) : 0,
                yMin: yTop,
                yMax: Math.round(canvas.height * yBand),
                hp: hp,
                maxHp: hp,
                shootTimer: 0,
                shootInterval: Math.max(500, 900 - (level - 1) * 25)
            };

            isBoss = true;
            gameRunning = true;
            gameOver = false;
            enemyShootTimer = 0;
        }

        // Новая игра с первого уровня
        function startGame() {
            score = 0;
            lives = 3;
            level = 1;
            bonuses.triple = 0;
            bonuses.shield = 0;
            bonuses.freeze = 0;
            bonuses.rapid = 0;
            bonuses.double = 0;
            applyDailyBonus();      // ежедневный бонус: стартовые баффы на этот забег
            fireHeld = false;
            fireCooldown = 0;
            isBoss = false;
            boss = null;
            bossVictoryTimer = 0;
            // сброс апгрейдов
            upgrades.wings = upgrades.drones = upgrades.pierce = upgrades.armor = 0;
            drones = []; droneFireTimer = 0; armorReady = false; armorTimer = 0; lastUpgradeText = ''; lastUpgradeKey = '';
            usedRevive = 0; usedDouble = false;   // сброс монетизации на новую игру
            paused = false;
            // Новая игра — салют можно показать снова; рекорд берём актуальный
            recordCelebrated = false;
            celebrateTimer = 0;
            hadRecord = bestScore > 0 || bestLevel > 0;
            pauseButton.classList.remove('paused');
            updateScore();
            spawnLevel();
            setUIState('playing');
        }

        // Переход к следующему этапу: после каждого 5-го раунда — бой с боссом,
        // победа над боссом ведёт к следующему раунду (с новой формой пришельцев).
        function advanceStage() {
            if (isBoss) {
                level++;            // босс побеждён — следующий обычный раунд
                spawnLevel();
            } else if (level % 5 === 0) {
                spawnBoss();        // отыграли 5-й раунд — босс
            } else {
                level++;
                spawnLevel();
            }
            updateScore();
        }

        // Обновление счета
        function updateScore() {
            scoreElement.textContent = score;
            livesElement.textContent = lives;
            levelElement.textContent = level;
            checkRecord();
        }

        // Кратко подсветить счётчик жизней (при подборе сердечка)
        function flashLives() {
            livesElement.classList.remove('flash');
            void livesElement.offsetWidth;   // перезапуск анимации
            livesElement.classList.add('flash');
        }

        // Салют «Новый рекорд» — таймер и залпы
        function updateCelebration(deltaTime) {
            if (celebrateTimer <= 0) return;
            celebrateTimer = Math.max(0, celebrateTimer - deltaTime);
            fireworkTimer -= deltaTime;
            if (fireworkTimer <= 0 && celebrateTimer > 400) {
                spawnFirework();
                fireworkTimer = 300;
            }
        }

        // Пауза после победы над боссом: показываем надпись, затем продолжаем
        function updateBossVictory(deltaTime) {
            if (bossVictoryTimer <= 0) return;
            bossVictoryTimer = Math.max(0, bossVictoryTimer - deltaTime);
            if (bossVictoryTimer === 0) advanceStage();
        }

        // Единый цикл: звёзды и частицы живут всегда, логика — только в игре
        function loop(currentTime) {
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;
            // Нормировка к 60 fps: на 120 Гц экранах (iPhone Pro) кадров вдвое больше,
            // поэтому движение считаем по времени, а не по числу кадров
            const dt = Math.min(deltaTime / 16.6667, 3);

            updateStars(dt);
            updateParticles(dt);
            updateFloatTexts(dt);

            updateCelebration(deltaTime);
            updateBossVictory(deltaTime);

            // Игровая логика стоит на паузе во время «Босс повержен»
            if (gameRunning && !gameOver && !paused && bossVictoryTimer <= 0) {
                update(deltaTime, dt);
            }

            draw();
            requestAnimationFrame(loop);
        }

        // ===== Подфункции обновления =====

        function getFireInterval() { return bonuses.rapid > 0 ? RAPID_INTERVAL : HOLD_INTERVAL; }

        // Автострельба при удержании огня. При любом стреляющем призе (очередь,
        // тройной, двойной) удержание пальца на треке тоже даёт поток — чтобы
        // призы множественного выстрела работали при игре одним пальцем.
        function updateAutoFire(deltaTime) {
            const padAutoFire = padHeld && (bonuses.rapid > 0 || bonuses.triple > 0 || bonuses.double > 0);
            if (!fireHeld && !padAutoFire) return;
            fireCooldown -= deltaTime;
            if (fireCooldown <= 0) {
                shootPlayerBullet();
                fireCooldown = getFireInterval();
            }
        }

        // Движение пуль игрока и их коллизии
        function updatePlayerBullets(deltaTime, dt) {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.y -= 7 * unit * dt;
                b.x += (b.vx || 0) * dt;

                if (b.y < 0 || b.x < -bulletWidth || b.x > canvas.width) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Бой с боссом: пробивные пули бьют сильнее (1 + уровень pierce)
                if (isBoss) {
                    if (boss && rectsOverlap(
                        {x: b.x, y: b.y, w: bulletWidth, h: bulletHeight},
                        {x: boss.x, y: boss.y, w: boss.width, h: boss.height}
                    )) {
                        boss.hp -= 1 + (b.pierce || 0);
                        spawnExplosion(b.x, b.y, '#e89bff');
                        bullets.splice(i, 1);
                        score += 5;
                        updateScore();
                        if (boss.hp <= 0) { defeatBoss(); return true; }
                    }
                    continue;
                }

                // Проверка столкновения с врагами
                for (let j = 0; j < enemies.length; j++) {
                    const en = enemies[j];
                    if (en.alive && rectsOverlap(
                        {x: b.x, y: b.y, w: bulletWidth, h: bulletHeight},
                        {x: en.x, y: en.y, w: en.width, h: en.height}
                    )) {
                        en.hp--;
                        const cx = en.x + en.width / 2;
                        const cy = en.y + en.height / 2;
                        if (en.hp <= 0) {
                            en.alive = false;
                            spawnExplosion(cx, cy, bugColors[en.row % bugColors.length]);
                            if (lives < 3 && Math.random() < POWERUP_DROP_CHANCE / 3) {
                                spawnPowerup(cx, cy, 'heart');
                            } else if (Math.random() < POWERUP_DROP_CHANCE) {
                                spawnPowerup(cx, cy);
                            }
                            sndExplosion();
                            score += 10;
                            updateScore();
                        } else {
                            // повреждён, но жив — искра без звука взрыва
                            spawnExplosion(b.x, b.y, '#ffffff');
                        }
                        // Пробивные пули летят дальше: телепортируем над жуком,
                        // чтобы не бить того же на следующем кадре
                        if (b.pierce > 0) { b.pierce--; b.y = en.y - bulletHeight - 1; }
                        else { bullets.splice(i, 1); }
                        break;
                    }
                }
            }
            return false;
        }

        // Падающие призы: полёт и сбор
        function updatePowerups(dt) {
            for (let i = powerups.length - 1; i >= 0; i--) {
                const pu = powerups[i];
                pu.y += pu.vy * dt;
                if (pu.y > canvas.height) { powerups.splice(i, 1); continue; }
                if (rectsOverlap(
                    {x: pu.x, y: pu.y, w: pu.width, h: pu.height},
                    {x: player.x, y: player.y, w: player.width, h: player.height}
                )) {
                    if (pu.type === 'heart') {
                        lives++;
                        updateScore();
                        spawnFloatText(player.x + player.width / 2, player.y - player.height * 0.4, t('plusLife'), '#ff6b86');
                        flashLives();
                    }
                    else bonuses[pu.type] = BONUS_DURATION[pu.type];
                    spawnExplosion(player.x + player.width / 2, player.y, powerupDefs[pu.type].color);
                    sndPowerup();
                    powerups.splice(i, 1);
                }
            }
        }

        // Движение строя врагов, отскок от стен, спуск
        function updateEnemyFormation(deltaTime, dt) {
            if (bonuses.freeze > 0) return;
            const margin = 10 * unit;
            let leftmost = canvas.width;
            let rightmost = 0;
            let aliveCount = 0;

            // Один проход: границы + проверка на проигрыш (враги у дна)
            for (let i = 0; i < enemies.length; i++) {
                if (enemies[i].alive) {
                    aliveCount++;
                    leftmost = Math.min(leftmost, enemies[i].x);
                    rightmost = Math.max(rightmost, enemies[i].x + enemies[i].width);
                    if (enemies[i].y + enemies[i].height >= player.y) {
                        return 'lose';
                    }
                }
            }

            if (aliveCount === 0) { advanceStage(); return 'win'; }

            let moveDown = false;
            if ((enemyDirection > 0 && rightmost >= canvas.width - margin) ||
                (enemyDirection < 0 && leftmost <= margin)) {
                enemyDirection *= -1;
                moveDown = true;
            }

            // Движение + клэмпинг одним проходом
            const dx = enemyDirection * enemySpeed * dt;
            const newLeftmost = leftmost + dx;
            const newRightmost = rightmost + dx;
            let clamp = 0;
            if (newRightmost > canvas.width - margin) clamp = (canvas.width - margin) - newRightmost;
            else if (newLeftmost < margin) clamp = margin - newLeftmost;

            for (let i = 0; i < enemies.length; i++) {
                if (enemies[i].alive) {
                    enemies[i].x += dx + clamp;
                    if (moveDown) enemies[i].y += enemyStep;
                }
            }

            // Стрельба врагов
            if (bonuses.freeze <= 0) {
                enemyShootTimer += deltaTime;
                if (enemyShootTimer >= enemyShootInterval) {
                    enemyShootTimer = 0;
                    shootEnemyBullet();
                }
            }
            return null;
        }

        // Пули врагов: полёт и попадание в игрока
        function updateEnemyBullets(dt) {
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const eb = enemyBullets[i];
                eb.y += 5 * unit * dt;
                eb.x += (eb.vx || 0) * dt;

                if (eb.y > canvas.height ||
                    eb.x < -bulletWidth || eb.x > canvas.width) {
                    enemyBullets.splice(i, 1);
                    continue;
                }

                if (rectsOverlap(
                    {x: eb.x, y: eb.y, w: eb.width, h: eb.height},
                    {x: player.x, y: player.y, w: player.width, h: player.height}
                )) {
                    enemyBullets.splice(i, 1);

                    if (bonuses.shield > 0) {
                        spawnExplosion(player.x + player.width / 2, player.y + player.height / 2, '#3fd8ff');
                        continue;
                    }
                    // Магнитный щит (апгрейд): отражает выстрел вверх и уходит на перезарядку
                    if (armorReady) {
                        armorReady = false; armorTimer = 0;
                        bullets.push(playerBullet(eb.x, player.y - bulletHeight, 0));
                        spawnExplosion(eb.x, player.y, '#b06bff');
                        sndShoot();
                        continue;
                    }

                    lives--;
                    sndHit();
                    spawnExplosion(player.x + player.width / 2, player.y + player.height / 2, '#7cf6ff');
                    updateScore();
                    if (lives <= 0) return true;  // game over
                }
            }
            return false;
        }

        // Обновление состояния игры
        let prevFreeze = false;
        function update(deltaTime, dt) {
            // При смене заморозки — переключаем фон body
            const nowFreeze = bonuses.freeze > 0;
            if (nowFreeze !== prevFreeze) {
                document.documentElement.style.background = nowFreeze ? '#252241' : '#170A24';
                prevFreeze = nowFreeze;
            }

            // Движение игрока (клавиатура)
            if (keys.left && player.x > 0) player.x -= player.speed * dt;
            if (keys.right && player.x < canvas.width - player.width) player.x += player.speed * dt;

            // Таймеры бонусов тают
            for (const key of Object.keys(bonuses)) {
                if (bonuses[key] > 0) bonuses[key] = Math.max(0, bonuses[key] - deltaTime);
            }

            updateAutoFire(deltaTime);
            updateDrones(deltaTime);

            // Перезарядка брони (мини-автощит)
            if (upgrades.armor > 0 && !armorReady) {
                armorTimer += deltaTime;
                if (armorTimer >= armorCooldown()) { armorReady = true; armorTimer = 0; }
            }

            // Пули игрока (если босс повержен — return)
            if (updatePlayerBullets(deltaTime, dt)) return;

            updatePowerups(dt);

            // Босс или логика строя
            if (isBoss) {
                updateBoss(deltaTime, dt);
            } else {
                const result = updateEnemyFormation(deltaTime, dt);
                if (result === 'win') return;
                if (result === 'lose') { gameOver = true; showGameOver(); return; }
            }

            // Пули врагов
            if (updateEnemyBullets(dt)) { gameOver = true; showGameOver(); }
        }

        // Создание падающего приза в точке (cx, cy). Тип можно задать явно
        // (forced), иначе берётся случайный из POWERUP_TYPES (без сердечка).
        function spawnPowerup(cx, cy, forced) {
            const size = Math.round(enemyWidth * 0.7);
            const type = forced || pickPowerupType();
            powerups.push({
                x: cx - size / 2,
                y: cy - size / 2,
                width: size,
                height: size,
                vy: 1.7 * unit,
                type: type
            });
        }

        // Пуля игрока с учётом апгрейда «пробой» (pierce)
        function playerBullet(x, y, vx) {
            return { x: x, y: y, width: bulletWidth, height: bulletHeight, vx: vx || 0, pierce: upgrades.pierce };
        }

        // Выстрел игрока. При активном бонусе — три пули: прямо + две под углом
        function shootPlayerBullet() {
            if (!gameRunning || gameOver || paused || !player.width) return;
            const cx = player.x + player.width / 2 - bulletWidth / 2;
            const top = player.y - bulletHeight;
            if (bonuses.triple > 0) {
                bullets.push(playerBullet(cx, top, 0));
                bullets.push(playerBullet(cx, top, -2.6 * unit));
                bullets.push(playerBullet(cx, top, 2.6 * unit));
            } else if (bonuses.double > 0) {
                // две параллельные пули на ширине корабля (без угла)
                bullets.push(playerBullet(player.x + player.width * 0.2 - bulletWidth / 2, top, 0));
                bullets.push(playerBullet(player.x + player.width * 0.8 - bulletWidth / 2, top, 0));
            } else {
                bullets.push(playerBullet(cx, top, 0));
            }
            // Крылья с пушками: пары параллельных пуль с краёв (по уровню)
            for (let w = 1; w <= upgrades.wings; w++) {
                const off = player.width * (0.42 + w * 0.26);
                bullets.push(playerBullet(cx - off, top + bulletHeight * 0.4, 0));
                bullets.push(playerBullet(cx + off, top + bulletHeight * 0.4, 0));
            }
            sndShoot();
        }

        // Дроны-спутники: держатся по бокам корабля и сами стреляют
        function updateDrones(deltaTime) {
            if (!drones.length || !player.width) return;
            const t = performance.now();
            for (const d of drones) {
                const gap = player.width * (0.72 + d.slot * 0.55);
                d.cx = player.x + player.width / 2 + d.side * gap;
                d.cy = player.y + player.height * 0.25 + Math.sin(t / 280 + d.slot * 1.7) * player.height * 0.12;
            }
            droneFireTimer += deltaTime;
            if (droneFireTimer >= 480) {
                droneFireTimer = 0;
                for (const d of drones) {
                    bullets.push(playerBullet(d.cx - bulletWidth / 2, d.cy, 0));
                }
            }
        }

        // Фабрика пуль врагов (обычных и босса)
        function createEnemyBullet(x, y, vx) {
            enemyBullets.push({ x: x, y: y, width: bulletWidth, height: bulletHeight, vx: vx || 0 });
        }

        // Стрельба врагов
        function shootEnemyBullet() {
            // Выбираем случайного живого врага
            const aliveEnemies = enemies.filter(enemy => enemy.alive);
            if (aliveEnemies.length > 0) {
                const randomEnemy = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
                createEnemyBullet(
                    randomEnemy.x + randomEnemy.width / 2 - bulletWidth / 2,
                    randomEnemy.y + randomEnemy.height,
                    0
                );
            }
        }

        // ===== Босс =====
        function updateBoss(deltaTime, dt) {
            if (!boss) return;
            const margin = 10 * unit;
            // Горизонталь — с отскоком от стен
            boss.x += boss.vx * dt;
            if (boss.x <= margin) { boss.x = margin; boss.vx = Math.abs(boss.vx); }
            if (boss.x + boss.width >= canvas.width - margin) {
                boss.x = canvas.width - margin - boss.width;
                boss.vx = -Math.abs(boss.vx);
            }
            // Вертикаль (со 2-го босса) — отскок в дозволенной полосе
            if (boss.vy !== 0) {
                boss.y += boss.vy * dt;
                if (boss.y <= boss.yMin) { boss.y = boss.yMin; boss.vy = Math.abs(boss.vy); }
                if (boss.y + boss.height >= boss.yMax) {
                    boss.y = boss.yMax - boss.height;
                    boss.vy = -Math.abs(boss.vy);
                }
            }
            // Стрельба веером
            boss.shootTimer += deltaTime;
            if (boss.shootTimer >= boss.shootInterval) {
                boss.shootTimer = 0;
                shootBossBullets();
            }
        }
        function shootBossBullets() {
            const cx = boss.x + boss.width / 2 - bulletWidth / 2;
            const by = boss.y + boss.height * 0.85;
            for (const vx of [-2.4 * unit, 0, 2.4 * unit]) {
                createEnemyBullet(cx, by, vx);
            }
        }
        function defeatBoss() {
            const def = bossDefs[boss.form || 0];
            // Фейерверк взрывов по корпусу
            for (let k = 0; k < 26; k++) {
                spawnExplosion(boss.x + Math.random() * boss.width,
                               boss.y + Math.random() * boss.height, def.bodyGlow);
            }
            sndExplosion();
            score += 200;
            updateScore();
            boss = null;                 // босс уничтожен
            enemyBullets = [];           // его пули убираем, чтобы не задели в паузе
            grantBossUpgrade();          // развитие корабля: случайный апгрейд
            bossVictoryTimer = 1800;     // показываем «БОСС ПОВЕРЖЕН!» и держим паузу
            // продолжение игры (advanceStage) — по истечении таймера, см. loop()
        }

        // Выдать случайный ещё не полученный апгрейд; когда все собраны —
        // повышается уровень случайного (до UPGRADE_MAX).
        function grantBossUpgrade() {
            let pool = UPGRADE_KEYS.filter(k => upgrades[k] === 0);
            if (!pool.length) pool = UPGRADE_KEYS.filter(k => upgrades[k] < UPGRADE_MAX);
            if (!pool.length) { lastUpgradeText = ''; return; }
            const key = pool[Math.floor(Math.random() * pool.length)];
            upgrades[key]++;
            if (key === 'drones') rebuildDrones();
            if (key === 'armor') { armorReady = true; armorTimer = 0; }
            lastUpgradeKey = key;
            lastUpgradeText = t('upg_' + key) + (upgrades[key] > 1 ? ' ' + ROMAN[upgrades[key]] : '');
            sndFanfare();
        }

        // Пересоздать дронов-спутников под текущий уровень
        function rebuildDrones() {
            drones = [];
            for (let i = 0; i < upgrades.drones; i++) {
                drones.push({ cx: 0, cy: 0, side: i % 2 === 0 ? -1 : 1, slot: Math.floor(i / 2) });
            }
        }
        // Перезарядка брони зависит от уровня: ур.1 ~11с, ур.2 ~8с, ур.3 ~5с
        function armorCooldown() { return Math.max(5000, 14000 - upgrades.armor * 3000); }

        // ===== Общие утилиты =====

        // Проверка пересечения двух AABB-прямоугольников
        function rectsOverlap(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x &&
                   a.y < b.y + b.h && a.y + a.h > b.y;
        }

        // Клэмпинг player.x в границы поля
        function clampPlayerX() {
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
        }

        // Координаты мыши/касания в пространстве холста
        function canvasCoord(clientX) {
            const rect = canvas.getBoundingClientRect();
            return (clientX - rect.left) * (canvas.width / rect.width);
        }

        // ===== Рисование объектов =====

        // Затемнение / осветление hex-цвета (f<1 темнее, f>1 светлее)
        function shade(hex, f) {
            const n = parseInt(hex.slice(1), 16);
            const r = Math.max(0, Math.min(255, Math.round(((n >> 16) & 255) * f)));
            const g = Math.max(0, Math.min(255, Math.round(((n >> 8) & 255) * f)));
            const b = Math.max(0, Math.min(255, Math.round((n & 255) * f)));
            return `rgb(${r},${g},${b})`;
        }

        // Универсальный рендер пиксельного спрайта по сетке символов и палитре
        function drawSprite(grid, palette, x, y, w, h, glow) {
            const cols = grid[0].length;
            const rows = grid.length;
            const cell = Math.min(w / cols, h / rows);
            const ox = x + (w - cell * cols) / 2;
            const oy = y + (h - cell * rows) / 2;
            ctx.save();
            if (glow) {
                ctx.shadowColor = glow.color;
                ctx.shadowBlur = glow.blur;
            }
            for (let r = 0; r < rows; r++) {
                const line = grid[r];
                for (let c = 0; c < cols; c++) {
                    const color = palette[line[c]];
                    if (color) {
                        ctx.fillStyle = color;
                        // +0.5 убирает зазоры между клетками при дробном масштабе
                        ctx.fillRect(ox + c * cell, oy + r * cell, cell + 0.5, cell + 0.5);
                    }
                }
            }
            ctx.restore();
            return { cell, ox, oy, cols, rows };
        }

        // Космический корабль игрока — квадратный пиксельный спрайт
        function drawShip(p) {
            const s = drawSprite(shipFrame, shipPalette, p.x, p.y, p.width, p.height, null);

            // Крылья с пушками (апгрейд) — симметричные «лопасти» по бокам корпуса.
            // Чем ниже ряд (больше k), тем дальше крыло уходит наружу — зеркально.
            if (upgrades.wings > 0) {
                ctx.save();
                for (let w = 1; w <= upgrades.wings; w++) {
                    const len = 1 + w;                 // длиннее с уровнем
                    const rowTop = s.rows - 4;         // у «плеч» корабля
                    for (let k = 0; k < len; k++) {
                        const wy = s.oy + (rowTop + k) * s.cell;
                        const lx = s.ox - (w + k) * s.cell;                    // влево-наружу
                        const rx = s.ox + (s.cols - 1 + w + k) * s.cell;       // вправо-наружу (зеркало)
                        ctx.fillStyle = '#9aa0c8';
                        ctx.fillRect(lx, wy, s.cell + 0.5, s.cell + 0.5);
                        ctx.fillRect(rx, wy, s.cell + 0.5, s.cell + 0.5);
                        // дульца пушек на верхних концах крыльев
                        if (k === 0) {
                            ctx.fillStyle = '#ff9d00';
                            ctx.fillRect(lx, wy - s.cell, s.cell + 0.5, s.cell + 0.5);
                            ctx.fillRect(rx, wy - s.cell, s.cell + 0.5, s.cell + 0.5);
                        }
                    }
                }
                ctx.restore();
            }

            // Пламя из дюз — мигающие пиксельные блоки под двигателями
            ctx.save();
            ctx.shadowColor = '#ff9d00';
            ctx.shadowBlur = 6;
            const flick = Math.floor(performance.now() / 90) % 2;
            for (const col of [5, 7]) {
                const len = 1 + flick + (Math.random() < 0.5 ? 1 : 0);
                for (let k = 0; k < len; k++) {
                    ctx.fillStyle = k === 0 ? '#ffd27c' : '#ff6a00';
                    ctx.fillRect(s.ox + col * s.cell, s.oy + (s.rows + k) * s.cell, s.cell + 0.5, s.cell + 0.5);
                }
            }
            ctx.restore();

            drawShipDamage(p, s);
        }

        // Дроны-спутники — маленькие пиксельные кораблики по бокам
        function drawDrones() {
            if (!drones.length) return;
            const sz = Math.max(4, player.height * 0.34);
            ctx.save();
            ctx.shadowColor = '#2bd1ff';
            ctx.shadowBlur = 4;
            for (const d of drones) {
                ctx.fillStyle = '#c2c8e0';
                ctx.fillRect(d.cx - sz / 2, d.cy - sz / 2, sz, sz * 0.7);
                ctx.fillStyle = '#1b9dff';
                ctx.fillRect(d.cx - sz * 0.18, d.cy - sz * 0.18, sz * 0.36, sz * 0.36);
                // мигающее дульце сверху
                ctx.fillStyle = '#7cff6b';
                ctx.fillRect(d.cx - sz * 0.1, d.cy - sz * 0.6, sz * 0.2, sz * 0.25);
            }
            ctx.restore();
        }

        // Повреждения корабля: чем меньше жизней, тем больше обугленных клеток.
        // Урон считается от текущих жизней, поэтому +1 от сердечка его откатывает.
        function drawShipDamage(p, s) {
            const dmg = Math.max(0, Math.min(shipDamageStages.length, 3 - lives));
            if (dmg <= 0) return;
            ctx.save();
            // Обугленные клетки
            for (let i = 0; i < dmg; i++) {
                for (const [c, r] of shipDamageStages[i]) {
                    ctx.fillStyle = '#241a22';
                    ctx.fillRect(s.ox + c * s.cell, s.oy + r * s.cell, s.cell + 0.5, s.cell + 0.5);
                }
            }
            // Тлеющие угольки на свежих повреждениях (мигают)
            if (Math.floor(performance.now() / 130) % 2 === 0) {
                ctx.fillStyle = '#ff6a00';
                ctx.shadowColor = '#ff6a00';
                ctx.shadowBlur = 6;
                const e = Math.max(1, s.cell * 0.4);
                for (const [c, r] of shipDamageStages[dmg - 1]) {
                    ctx.fillRect(s.ox + c * s.cell + s.cell * 0.3, s.oy + r * s.cell + s.cell * 0.3, e, e);
                }
            }
            ctx.restore();

            // Дым при тяжёлых повреждениях (последняя стадия)
            if (dmg >= shipDamageStages.length) {
                ctx.save();
                const baseX = p.x + p.width * 0.5;
                const baseY = p.y + p.height * 0.28;
                const now = performance.now();
                for (let k = 0; k < 3; k++) {
                    const t = ((now / 750) + k * 0.37) % 1;
                    const px = baseX + Math.sin(now / 320 + k * 2) * s.cell * 0.9;
                    const py = baseY - t * p.height * 0.75;
                    ctx.globalAlpha = (1 - t) * 0.22;
                    ctx.fillStyle = '#9aa0b0';
                    ctx.beginPath();
                    ctx.arc(px, py, s.cell * (0.6 + t * 1.3), 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
                ctx.globalAlpha = 1;
            }
        }

        // Жук-враг — пиксельный спрайт текущей формы, цвет по ряду
        function drawBug(e) {
            const frames = bugForms[currentFormIndex()];
            const frame = frames[Math.floor(performance.now() / 450) % frames.length];
            let base = bugColors[e.row % bugColors.length];
            // Бронированный жук темнеет по мере урона (видно, что «потрёпан»)
            if (e.maxHp > 1 && e.hp < e.maxHp) {
                base = shade(base, 0.45 + 0.55 * (e.hp / e.maxHp));
            }
            const palette = {
                'X': base,
                'D': shade(base, 0.55),   // тень
                'L': shade(base, 1.35),   // блик
                'e': '#ffffff',           // глаз
                '.': null
            };
            drawSprite(frame, palette, e.x, e.y, e.width, e.height, null);
        }

        // Босс — большой детальный спрайт с пульсирующими глазами и лёгким покачиванием
        function drawBoss(b) {
            const def = bossDefs[b.form || 0];
            const frame = def.frame;
            const bob = Math.sin(performance.now() / 500) * b.height * 0.02;
            // свечение тела
            const s = drawSprite(frame, def.palette, b.x, b.y + bob, b.width, b.height,
                                 { color: def.bodyGlow, blur: 14 });
            // пульсирующее свечение глаз
            const glow = 6 + Math.sin(performance.now() / 180) * 4;
            ctx.save();
            ctx.shadowColor = def.eyeGlow;
            ctx.shadowBlur = glow;
            ctx.fillStyle = def.eyeGlow;
            for (let r = 0; r < frame.length; r++) {
                for (let c = 0; c < frame[r].length; c++) {
                    if (frame[r][c] === 'e') {
                        ctx.fillRect(s.ox + c * s.cell, s.oy + r * s.cell, s.cell + 0.5, s.cell + 0.5);
                    }
                }
            }
            ctx.restore();
        }

        // Полоса HP босса — по центру сверху
        function drawBossHpBar() {
            if (!boss) return;
            const bw = canvas.width * 0.5;
            const bh = Math.max(8, canvas.height * 0.016);
            const bx = (canvas.width - bw) / 2;
            const by = isTouch ? hudBottom + 4 : canvas.height * 0.03;
            const frac = Math.max(0, boss.hp / boss.maxHp);
            const col = frac > 0.5 ? '#9dff5a' : (frac > 0.25 ? '#ffd166' : '#ff5e7e');
            ctx.save();
            ctx.fillStyle = 'rgba(10, 8, 18, 0.7)';
            ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
            ctx.fillStyle = col;
            ctx.shadowColor = col;
            ctx.shadowBlur = 8;
            ctx.fillRect(bx, by, bw * frac, bh);
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(230, 240, 255, 0.5)';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(bx, by, bw, bh);
            const labelCol = bossDefs[boss.form || 0].bodyGlow;
            ctx.fillStyle = labelCol;
            ctx.font = `bold ${Math.round(canvas.width * 0.026)}px ${FONT_FAMILY}`;
            ctx.textAlign = 'center';
            ctx.shadowColor = labelCol;
            ctx.shadowBlur = TEXT_GLOW_SMALL;
            ctx.fillText(t('boss') + '  ' + boss.hp + ' / ' + boss.maxHp, canvas.width / 2, by + bh + Math.round(canvas.width * 0.032));
            ctx.restore();
            ctx.textAlign = 'left';
        }

        // Капсула-приз с пульсирующим свечением своего цвета
        function drawPowerup(pu) {
            const def = powerupDefs[pu.type];
            const blur = 10 + Math.sin(performance.now() / 150) * 5;
            drawSprite(def.frame, def.palette, pu.x, pu.y, pu.width, pu.height, { color: def.color, blur });
        }

        function drawBackground() {
            const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bg.addColorStop(0, '#0a0a2a');
            bg.addColorStop(1, '#160a26');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Звёзды
            for (const s of stars) {
                ctx.globalAlpha = 0.4 + s.r / 2;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function drawParticles() {
            for (const p of particles) {
                ctx.globalAlpha = Math.max(p.life, 0);
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3 * p.life + 1, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        // Отрисовка массива пуль (общая для пуль игрока и врагов)
        function drawBullets(arr, fillColor, shadowColor) {
            if (!arr.length) return;
            ctx.save();
            ctx.shadowColor = shadowColor;
            ctx.shadowBlur = 12;
            ctx.fillStyle = fillColor;
            for (const b of arr) {
                ctx.fillRect(b.x, b.y, bulletWidth, bulletHeight);
            }
            ctx.restore();
        }

        // ===== Подфункции отрисовки =====

        // Экран меню (до старта игры)
        function drawMenuScreen() {
            drawParticles();
            const titleSize = Math.round(canvas.width * 0.048);
            ctx.fillStyle = '#7cf6ff';
            ctx.font = `bold ${titleSize}px ${FONT_FAMILY}`;
            ctx.textAlign = 'center';
            ctx.shadowColor = '#1b9dff';
            ctx.shadowBlur = TEXT_GLOW_LARGE;
            ctx.fillText(t('title'), canvas.width / 2, canvas.height / 2 - titleSize * 1.8);
            ctx.shadowBlur = 0;
            if (hadRecord) {
                ctx.fillStyle = '#ffd166';
                ctx.font = `${Math.round(titleSize * 0.42)}px ${FONT_FAMILY}`;
                ctx.fillText(t('recordLine')(bestScore, bestLevel), canvas.width / 2, canvas.height / 2 - titleSize * 0.7);
            }
            ctx.textAlign = 'left';
        }

        // Пиксельный полукруг-щит над кораблём
        function drawShield() {
            if (bonuses.shield <= 0 || !player.width) return;
            const cell = Math.max(2, Math.min(player.width / 13, player.height / 10));
            const cx = player.x + player.width / 2;
            const cyc = player.y + player.height * 0.55;
            const R = player.width * 0.66;
            const pulse = 0.6 + Math.sin(performance.now() / 140) * 0.25;
            const steps = Math.max(10, Math.round(Math.PI * R / cell));
            ctx.save();
            ctx.shadowColor = '#3fd8ff';
            ctx.shadowBlur = 8;
            const seen = new Set();
            for (let s = 0; s <= steps; s++) {
                const a = Math.PI + Math.PI * (s / steps);
                const bx = Math.round((cx + Math.cos(a) * R) / cell) * cell;
                const by = Math.round((cyc + Math.sin(a) * R) / cell) * cell;
                const key = bx + ',' + by;
                if (seen.has(key)) continue;
                seen.add(key);
                const edge = Math.abs(s / steps - 0.5) * 2;
                ctx.globalAlpha = pulse * (1 - edge * 0.35);
                ctx.fillStyle = edge < 0.5 ? '#aef1ff' : '#3fd8ff';
                ctx.fillRect(bx, by, cell + 0.5, cell + 0.5);
            }
            ctx.restore();
        }

        // Магнитный щит (апгрейд «armor») — пульсирующее пиксельное кольцо вокруг
        // корабля; пока заряжен, отражает вражеский выстрел вверх.
        function drawMagnetShield() {
            if (!armorReady || !player.width) return;
            const cell = Math.max(2, Math.min(player.width / 13, player.height / 10));
            const cx = player.x + player.width / 2;
            const cy = player.y + player.height * 0.5;
            const R = player.width * 0.72;
            const pulse = 0.5 + Math.sin(performance.now() / 120) * 0.25;
            const steps = Math.max(16, Math.round(2 * Math.PI * R / cell));
            ctx.save();
            ctx.shadowColor = '#b06bff';
            ctx.shadowBlur = 8;
            const seen = new Set();
            for (let s = 0; s <= steps; s++) {
                const a = 2 * Math.PI * (s / steps);
                const bx = Math.round((cx + Math.cos(a) * R) / cell) * cell;
                const by = Math.round((cy + Math.sin(a) * R) / cell) * cell;
                const key = bx + ',' + by;
                if (seen.has(key)) continue;
                seen.add(key);
                ctx.globalAlpha = pulse;
                ctx.fillStyle = (s % 2 === 0) ? '#d6b3ff' : '#b06bff';
                ctx.fillRect(bx, by, cell + 0.5, cell + 0.5);
            }
            ctx.restore();
        }

        function drawFreezeOverlay() {

        }

                { key: 'shield', label: '> ' + t('buff_shield'), color: '#3fd8ff' },

                { key: 'rapid', label: '> ' + t('buff_rapid'), color: '#ff9d2e' },

                if (bonuses[def.key] > 0) buffs.push({ label: def.label, t: bonuses[def.key], color: def.color });
